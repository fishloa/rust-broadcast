[crate.dvr-runtime]
domain = "live"
summary = "Sans-IO DVR archive: one append-only HLS playlist per period over one media file, a plan-based roll/retention writer, catch-up read planning and an optional blocking std::fs adapter."
standards = "RFC 8216 / RFC 8216bis (HLS Media Playlist, DATERANGE, vendor tags); ETSI EN 300 468 (EIT present/following, via dvb-si)"
what = "The one owner of the DVR on-disk format. A period is a media file (`pN.m4s`/`pN.ts`, fMP4 init at its head) plus an HLS Media Playlist (`pN.m3u8`, `EVENT`, one append per segment, closed with `ENDLIST`), with a playlist-level archive marker and a per-segment timing tag; every line is rendered and parsed by `broadcast-hls`. `ArchiveWriter` is sans-IO: it returns a plan of storage operations and commits only when the host reports success, so a failed roll changes nothing. The `read` module parses one period (torn-line rule, sequence/uri/range/map validation) and plans catch-up over the archive plus the live tail. `recover` rescans an fMP4 period's init and fragments. Feature `fs` adds the blocking `FsRecorder` and `FsArchive` (with its own bounded parsed-playlist cache). No clock reads, no serde, no JSON. Not yet published."
crates_io = false
lifecycle = "active"
