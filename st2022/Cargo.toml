[package]
name          = "st2022"
version       = "0.2.0"
description   = "SMPTE ST 2022-6 HBRMT (SDI-over-IP) RTP payload header parser"
authors.workspace     = true
edition.workspace     = true
license.workspace     = true
repository.workspace  = true
rust-version.workspace = true
categories   = ["multimedia::video", "parser-implementations", "no-std"]
keywords     = ["smpte", "st2022", "hbrmt", "sdi-over-ip", "broadcast"]

[dependencies]
broadcast-common = { path = "../broadcast-common", version = "10.0", default-features = false }
thiserror        = { version = "2", default-features = false }

[features]
default = ["std"]
std     = ["broadcast-common/std", "serde?/std"]
serde   = ["dep:serde", "broadcast-common/serde"]

[dependencies.serde]
version          = "1"
default-features = false
features         = ["derive"]
optional         = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dev-dependencies]
test-fixtures = { path = "../test-fixtures" }

[lints]
workspace = true
