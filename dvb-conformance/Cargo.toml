[package]
name         = "dvb-conformance"
version      = "12.0.1"
edition      = "2024"
description  = "ETSI TR 101 290 transport-stream conformance monitor (DVB measurement guidelines)."
license      = "MIT OR Apache-2.0"
authors      = ["Alex Fishlock <alex.fishlock@racingjag.com>"]
keywords     = ["dvb", "mpeg-ts", "conformance", "monitoring"]
categories   = ["multimedia", "parsing"]
repository   = "https://github.com/fishloa/rust-broadcast"
readme       = "README.md"
rust-version.workspace = true
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
[dependencies]
broadcast-common = { path = "../broadcast-common", version = "10.0", default-features = false }
dvb-si      = { path = "../dvb-si", version = "12.0", default-features = false, features = ["ts"] }
mpeg-ts     = { path = "../mpeg-ts", version = "0.6", default-features = false }
serde       = { version = "1", default-features = false, optional = true, features = ["derive", "alloc"] }

[features]
default = ["std", "serde"]
std     = ["broadcast-common/std", "dvb-si/std", "mpeg-ts/std", "serde?/std"]

serde = ["dep:serde", "dvb-si/serde"]

[dev-dependencies]
test-fixtures = { path = "../test-fixtures" }
broadcast-common = { path = "../broadcast-common", version = "10.0" }

[lints]
workspace = true
