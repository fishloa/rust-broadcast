[package]
name    = "dvb-ci"
version = "0.14.0"
edition = "2024"
description = "DVB Common Interface (EN 50221) — APDU/resource objects, session/transport PDUs, and a CA_PMT builder from a dvb-si PMT."
license      = "MIT OR Apache-2.0"
authors      = ["Alex Fishlock <alex.fishlock@racingjag.com>"]
keywords = ["dvb", "common-interface", "ci", "en50221", "cam"]
categories = ["parser-implementations", "multimedia", "no-std"]
repository   = "https://github.com/fishloa/rust-broadcast"
readme       = "README.md"
rust-version.workspace = true
exclude = ["docs/**"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
broadcast-common = { path = "../broadcast-common", version = "14.0.0", default-features = false }
broadcast-core = { path = "../broadcast-core", version = "0.1.0", default-features = false }
dvb-si     = { path = "../dvb-si", version = "16.0.0", default-features = false }
mpeg-ts    = { path = "../mpeg-ts", version = "0.10.0", default-features = false }
thiserror  = { version = "2", default-features = false }
serde      = { version = "1", default-features = false, optional = true, features = ["derive", "alloc"] }

[dev-dependencies]
test-fixtures = { path = "../test-fixtures" }
# Counting/capping test allocator (path-only, publish = false; never published).
test-alloc = { path = "../test-alloc" }

[features]
default = ["std"]
std = ["broadcast-common/std", "broadcast-core/std", "dvb-si/std", "mpeg-ts/std", "thiserror/std", "serde?/std"]
serde = ["dep:serde", "mpeg-ts/serde"]

[lints]
workspace = true
