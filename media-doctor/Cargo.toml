[package]
name         = "media-doctor"
version      = "0.8.0"
edition      = "2024"
description  = "Media diagnostics harness for DVB/MPEG-TS: pluggable lint-style checks (sync, PAT/PMT versioning, CC anomalies, PCR, PTS/DTS monotonicity, SCTE-35 splice consistency) + HLS playlist validation."
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/fishloa/rust-broadcast"
rust-version.workspace = true
readme       = "README.md"
keywords     = ["mpeg-ts", "dvb", "diagnostics", "scte-35", "hls"]
categories   = ["multimedia::video", "command-line-utilities"]

[[bin]]
name = "media-doctor"
path = "src/bin/media-doctor.rs"
required-features = ["cli"]

[dependencies]
broadcast-common = { path = "../broadcast-common", version = "9.3", default-features = false }
mpeg-pes         = { path = "../mpeg-pes", version = "0.4", default-features = false }
mpeg-ts          = { path = "../mpeg-ts", version = "0.4", default-features = false }
dvb-si           = { path = "../dvb-si", version = "10", default-features = false, features = ["ts"] }
dvb-conformance  = { path = "../dvb-conformance", version = "10", default-features = false }
scte35-splice    = { path = "../scte35-splice", version = "2.1", default-features = false }
timed-metadata   = { path = "../timed-metadata", version = "0.5", default-features = false }
transmux         = { path = "../transmux", version = "0.24", default-features = false }
# HLS (M3U8) playlist syntax (issue #878): the validator parses playlists
# via this crate directly rather than reaching through `transmux` for it.
broadcast-hls    = { path = "../broadcast-hls", version = "0.2", default-features = false }
# Container-format detection for the `check` CLI's input routing (issue #1112
# / audit MD-W7): a file that is a TS but does not start on a packet boundary,
# or uses the 192-byte M2TS / 204-byte RS framing, must still be routed to the
# TS diagnostics. Only the binary needs it, so it is behind `cli`.
container-probe  = { path = "../container-probe", version = "0.1", optional = true, default-features = false }
clap             = { version = "4", features = ["derive"], optional = true }
serde            = { version = "1", features = ["derive", "alloc"], optional = true }
serde_json       = { version = "1", optional = true }
thiserror        = { version = "2", optional = true }
# Prometheus exposition for `watch` (de-hand-roll W1-P, SP2.3): the exporter's
# recorder + `PrometheusHandle::render()` do the text format (HELP/TYPE,
# label escaping). `default-features = false`: no listener, no push gateway —
# its built-in listener has no header-read timeout, no connection cap and no
# way to learn a port-0 address, so serving is `metrics_server` (hyper).
metrics                     = { version = "0.24", optional = true }
metrics-exporter-prometheus = { version = "0.18", default-features = false, optional = true }
# `watch` metrics server (de-hand-roll W1-P, SP2.3 / SP1.6): hyper does the HTTP
# framing; tokio-util owns the connection tasks and the shutdown token;
# socket2 binds the UDP socket (`udp`).
tokio                       = { version = "1", default-features = false, features = ["rt", "net", "time", "sync", "macros"], optional = true }
tokio-util                  = { version = "0.7", default-features = false, features = ["rt"], optional = true }
hyper                       = { version = "1", default-features = false, features = ["server", "http1"], optional = true }
hyper-util                  = { version = "0.1", default-features = false, features = ["tokio"], optional = true }
http-body-util              = { version = "0.1", optional = true }
socket2                     = { version = "0.6", features = ["all"], optional = true } # `all` is required for `Socket::set_reuse_port` (cfg(feature = "all") at socket2-0.6.5/src/sys/unix.rs:2237)

[features]
default = ["std", "serde", "cli"]
std     = ["broadcast-common/std", "mpeg-ts/std", "transmux/std", "dvb-conformance/std", "broadcast-hls/std"]
serde   = ["dep:serde", "dep:serde_json"]
metrics = ["std", "dep:metrics", "dep:metrics-exporter-prometheus"]
net     = ["metrics", "dep:tokio", "dep:tokio-util", "dep:hyper", "dep:hyper-util", "dep:http-body-util", "dep:socket2"]
cli     = ["dep:clap", "dep:thiserror", "dep:container-probe", "std", "net"]

[dev-dependencies]
tokio = { version = "1", features = ["rt", "net", "time", "io-util", "macros"] }
# replaces the hand-written try_wait/sleep deadline poll in the old
# tests/support/bounded.rs; the runner now lives in the shared `test-bounded`
# crate (one copy across hls-runtime/multimux/media-doctor). Path-only
# dev-dep, so it never reaches a published manifest.
test-bounded = { path = "../test-bounded" }
# `mediastreamvalidator_oracle.rs` (issue #870) renders real TS-HLS/CMAF-HLS
# output through the `transmux` packager CLI core (`transmux::cli::run_bytes`)
# to hand Apple's independent HLS conformance tool something the origin
# actually produces, not a hand-typed approximation. `cli` is dev-only here —
# the library dependency above stays `default-features = false` (no `cli`,
# no `clap`); Cargo unifies the two requirements for test builds only, same
# pattern as `rtmp-runtime`'s dev-dependency on `transmux`.
transmux = { path = "../transmux", version = "0.24", default-features = false, features = ["cli"] }
# Real SSAI Interstitial `EXT-X-DATERANGE` rendering (issue #1140): the
# oracle test renders through `ssai-runtime`'s own
# `InterstitialDateRange::to_tag_line`, not a hand-typed approximation of
# its output. Test-only: the library itself has no ssai-runtime dependency.
ssai-runtime = { path = "../ssai-runtime", default-features = false }
# Integration tests build real, CRC-correct PAT/PMT sections through `dvb-si`'s
# own builders rather than hand-rolled bytes — the same rule the in-crate unit
# tests follow (issue #1112). `dvb-si` is already a normal dependency, so this
# adds no crate to the graph; the feature set is raised for the section
# builders only in test builds.
dvb-si = { path = "../dvb-si", version = "10", default-features = false, features = ["ts"] }
# `mpeg-ts`'s `SectionPacketiser` wraps those sections into real TS packets.
mpeg-ts = { path = "../mpeg-ts", version = "0.4", default-features = false }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
