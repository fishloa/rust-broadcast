[package]
name    = "broadcast-hls"
version      = "0.2.0"
edition = "2024"
description = "HLS (M3U8) playlist syntax (RFC 8216 / RFC 8216bis) — Media/Master Playlist parse + serialize, no_std."
license      = "MIT OR Apache-2.0"
authors      = ["Alex Fishlock <alex.fishlock@racingjag.com>"]
keywords = ["hls", "m3u8", "playlist", "rfc8216", "no-std"]
categories = ["parser-implementations", "multimedia", "no-std"]
repository   = "https://github.com/fishloa/rust-broadcast"
readme       = "README.md"
rust-version.workspace = true
exclude = ["docs/**"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# Floored at 9.2: `cenc::CencScheme` (which `cenc_ext_x_key` takes, shared with
# `transmux`) and `hex::hex_encode` landed there — issue #878.
broadcast-common = { path = "../broadcast-common", version = "9.3", default-features = false }
thiserror  = { version = "2", default-features = false }
serde      = { version = "1", optional = true, default-features = false, features = ["derive", "alloc"] }

[dev-dependencies]
serde_json = "1.0"

[features]
default = ["std"]
# `std` links the standard library. Without it the crate is `#![no_std]` and
# needs only `alloc`.
std = ["broadcast-common/std", "thiserror/std", "serde?/std"]
serde = ["dep:serde", "broadcast-common/serde"]
