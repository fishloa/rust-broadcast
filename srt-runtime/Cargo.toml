[package]
name    = "srt-runtime"
version = "0.4.1"
edition = "2024"
description = "SRT (Secure Reliable Transport, draft-sharabayko-srt-01) packet codecs + sans-IO HSv5 Caller-Listener and Rendezvous handshake state machines, an ARQ reliability engine, a TSBPD delivery scheduler, LiveCC packet pacing, FileCC window-based congestion control, optional (crypto feature) payload encryption, and an optional (tokio feature) async UDP socket adapter; no_std core."
license      = "MIT OR Apache-2.0"
authors      = ["Alex Fishlock <alex.fishlock@racingjag.com>"]
keywords = ["srt", "packet", "sans-io", "transport", "streaming"]
categories = ["parser-implementations", "multimedia", "network-programming", "no-std"]
repository   = "https://github.com/fishloa/rust-broadcast"
readme       = "README.md"
rust-version.workspace = true
exclude = ["docs/**"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
broadcast-common = { path = "../broadcast-common", version = "9.4", default-features = false }
thiserror = { version = "2", default-features = false }
serde     = { version = "1", optional = true, default-features = false, features = ["derive", "alloc"] }
# §6 payload crypto (AES-CTR, RFC 3394 key wrap, PBKDF2/HMAC-SHA1 KEK
# derivation) — all optional, behind the `crypto` feature. All on the
# RustCrypto 0.13 generation (the same one `transmux`'s `cenc` feature uses).
aes    = { version = "0.9", default-features = false, optional = true }
ctr    = { version = "0.10", default-features = false, optional = true }
aes-kw = { version = "0.3", default-features = false, optional = true }
pbkdf2 = { version = "0.13", default-features = false, optional = true }
hmac   = { version = "0.13", default-features = false, optional = true }
sha1   = { version = "0.11", default-features = false, optional = true }
# Key hygiene for the `crypto` path (issue #1142): `zeroize` wipes passphrases,
# SEKs and KEKs when they go out of scope; `subtle` compares secrets in constant
# time. Both are already in the workspace lock (`subtle` via `digest`,
# `zeroize` via the RustCrypto stack), so no new version is resolved.
zeroize = { version = "1", default-features = false, features = ["alloc"], optional = true }
subtle  = { version = "2", default-features = false, optional = true }
# Async UDP socket adapter (tokio feature) — mirrors `rtsp-runtime`'s io.rs
# pattern for driving the sans-IO SRT engines over real UDP sockets. Same
# tokio feature set as the sibling crate, matching the workspace MSRV.
tokio = { version = "1", optional = true, default-features = false, features = ["net", "io-util", "rt", "macros", "time", "sync"] }
# OS randomness for the tokio adapter's per-connection ISN/Socket ID (SRT-W11):
# only the hosted adapter needs this, so it rides the `tokio` feature and the
# no_std sans-IO core stays dependency-free. Already resolved workspace-wide
# at 0.2.17 (pulled in transitively by `ring`/`rand_core`, as `rtsp-runtime`
# also observes) — pinned to the same `0.2` line so `--locked` adds no new
# version, only the new dependency edge.
getrandom = { version = "0.2", optional = true, default-features = false }
# `Bytes` datagrams (SP6.5) and the tracked-task/cancellation primitives
# (SP1.4) for the tokio adapter only; the no_std core stays dependency-free.
bytes      = { version = "1", optional = true, default-features = false }
tokio-util = { version = "0.7", optional = true, default-features = false, features = ["rt"] }

[dev-dependencies]
serde_json = "1.0"
# `test-util` for the paused, manually advanced clock the adapter tests use
# instead of sleeping.
tokio = { version = "1", default-features = false, features = ["net", "io-util", "rt", "macros", "time", "sync", "test-util"] }

[features]
default = ["std"]
# `std` links the standard library. Without it the crate is `#![no_std]` and
# needs only `alloc`. The packet codecs themselves are fully no_std.
std = ["broadcast-common/std", "thiserror/std"]
# Derive serde on the public wire types.
serde = ["dep:serde"]
# `crypto` adds the §6 payload-encryption path: AES-CTR encrypt/decrypt, RFC
# 3394 AES key wrap/unwrap of the SEK, and PBKDF2/HMAC-SHA1 KEK derivation.
# Off by default so the no_std packet-codec core pulls zero crypto deps.
crypto = ["dep:aes", "dep:ctr", "dep:aes-kw", "dep:pbkdf2", "dep:hmac", "dep:sha1", "dep:zeroize", "dep:subtle"]
# `tokio` enables the real-socket async UDP adapter over the sans-IO SRT
# engines (handshake, ARQ, TSBPD, LiveCC). Implies `std`. Only available on
# hosted targets — the `no_std` packet-codec core stays clean without it.
tokio = ["dep:tokio", "dep:getrandom", "dep:bytes", "dep:tokio-util", "std"]
