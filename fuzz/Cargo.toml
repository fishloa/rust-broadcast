[package]
name         = "rust-broadcast-fuzz"
version      = "0.0.0"
edition      = "2024"
description  = "cargo-fuzz harness for the rust-broadcast workspace"
license      = "MIT OR Apache-2.0"
publish      = false

[package.metadata]
cargo-fuzz = true

[workspace]

# Redirect crates.io references (used by dvb-ci) to the local workspace paths,
# so all crates share the same broadcast-common/dvb-si type definitions and the
# dvb_common::Parse trait is the same instance.
[patch.crates-io]
broadcast-common = { path = "../broadcast-common" }
dvb-si     = { path = "../dvb-si" }

[dependencies]
broadcast-bitstream = { path = "../broadcast-bitstream", version = "0.1.0", default-features = false, features = ["h264", "hevc", "vvc"] }
broadcast-common   = { path = "../broadcast-common" }
broadcast-core = { path = "../broadcast-core" }
broadcast-matroska = { path = "../broadcast-matroska" }
http               = "1"
headers            = "0.4"
dvb-si       = { path = "../dvb-si",       features = ["ts", "serde"] }
dvb-t2mi     = { path = "../dvb-t2mi",     features = ["ts"] }
dvb-bbframe  = { path = "../dvb-bbframe" }
mpeg-ts      = { path = "../mpeg-ts" }
mpeg-pes     = { path = "../mpeg-pes" }
dvb-subtitle = { path = "../dvb-subtitle" }
mpeg-ps      = { path = "../mpeg-ps" }
scte104      = { path = "../scte104" }
cc-data      = { path = "../cc-data" }
dvb-ci       = { path = "../dvb-ci" }
scte35-splice = { path = "../scte35-splice" }
st291        = { path = "../st291", features = ["rtp"] }
rtp-packet   = { path = "../rtp-packet", features = ["rfc8285"] }
st12-1       = { path = "../st12-1" }
st337        = { path = "../st337" }
rdd29        = { path = "../rdd29" }
st377-1      = { path = "../st377-1" }
transmux      = { path = "../transmux" }
broadcast-hls = { path = "../broadcast-hls" }
broadcast-smooth = { path = "../broadcast-smooth" }
media-doctor  = { path = "../media-doctor" }
broadcast-auth = { path = "../broadcast-auth" }
rtmp-runtime  = { path = "../rtmp-runtime" }
rtsp-runtime  = { path = "../rtsp-runtime" }
sdp-types     = "0.3"
media-plane   = { path = "../media-plane" }
ttml-subtitle = { path = "../ttml-subtitle" }
broadcast-loudness = { path = "../broadcast-loudness" }
buffering-runtime    = { path = "../buffering-runtime" }
broadcast-client     = { path = "../broadcast-client" }
dvb-csa        = { path = "../dvb-csa" }
dvb-mabr       = { path = "../dvb-mabr" }
atsc3          = { path = "../atsc3" }
st2022         = { path = "../st2022" }
rist-runtime   = { path = "../rist-runtime" }
webrtc-runtime = { path = "../webrtc-runtime" }
atsc3-route    = { path = "../atsc3-route" }
rmt-flute      = { path = "../rmt-flute" }
dash-runtime   = { path = "../dash-runtime" }
smooth-runtime = { path = "../smooth-runtime" }
url            = "2"
broadcast-dash = { path = "../broadcast-dash" }
test-fixtures  = { path = "../test-fixtures" }
jiff           = { version = "1", default-features = false, features = ["std"] }
ule            = { path = "../ule" }
caption-convert = { path = "../caption-convert" }
container-probe = { path = "../container-probe" }
srt-runtime    = { path = "../srt-runtime" }
dvb-simulcrypt = { path = "../dvb-simulcrypt" }
dvb-vbi        = { path = "../dvb-vbi" }
isobmff        = { path = "../isobmff" }
timed-metadata = { path = "../timed-metadata" }
ts-fix         = { path = "../ts-fix" }
hls-runtime    = { path = "../hls-runtime" }
dvb-ci-runtime = { path = "../dvb-ci-runtime" }
bytes         = "1"
dvr-runtime   = { path = "../dvr-runtime" }
libfuzzer-sys = "0.4"

