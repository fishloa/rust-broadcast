[package]
name         = "rust-broadcast-fuzz"
version      = "0.0.0"
edition      = "2024"
description  = "cargo-fuzz harness for the rust-broadcast workspace"
license      = "MIT OR Apache-2.0"
publish      = false

[package.metadata]
cargo-fuzz = true

[workspace]

# Redirect crates.io references (used by dvb-ci) to the local workspace paths,
# so all crates share the same broadcast-common/dvb-si type definitions and the
# dvb_common::Parse trait is the same instance.
[patch.crates-io]
broadcast-common = { path = "../broadcast-common" }
dvb-si     = { path = "../dvb-si" }

[dependencies]
broadcast-common   = { path = "../broadcast-common" }
dvb-si       = { path = "../dvb-si",       features = ["ts", "serde"] }
dvb-t2mi     = { path = "../dvb-t2mi",     features = ["ts"] }
dvb-bbframe  = { path = "../dvb-bbframe" }
mpeg-pes     = { path = "../mpeg-pes" }
dvb-subtitle = { path = "../dvb-subtitle" }
mpeg-ps      = { path = "../mpeg-ps" }
scte104      = { path = "../scte104" }
cc-data      = { path = "../cc-data" }
dvb-ci       = { path = "../dvb-ci" }
scte35-splice = { path = "../scte35-splice" }
st291        = { path = "../st291", features = ["rtp"] }
rtcp-packet  = { path = "../rtcp-packet" }
rtp-packet   = { path = "../rtp-packet", features = ["rfc8285"] }
st12-1       = { path = "../st12-1" }
st337        = { path = "../st337" }
rdd29        = { path = "../rdd29" }
st377-1      = { path = "../st377-1" }
transmux      = { path = "../transmux" }
broadcast-hls = { path = "../broadcast-hls" }
media-doctor  = { path = "../media-doctor" }
broadcast-auth = { path = "../broadcast-auth" }
rtmp-runtime  = { path = "../rtmp-runtime" }
media-plane   = { path = "../media-plane" }
ttml-subtitle = { path = "../ttml-subtitle" }
broadcast-loudness = { path = "../broadcast-loudness" }
dvb-csa        = { path = "../dvb-csa" }
dvb-mabr       = { path = "../dvb-mabr" }
atsc3          = { path = "../atsc3" }
st2022         = { path = "../st2022" }
rist-runtime   = { path = "../rist-runtime" }
webrtc-runtime = { path = "../webrtc-runtime" }
bytes         = "1"
libfuzzer-sys = "0.4"

[[bin]]
name = "ttml_subtitle"
path = "fuzz_targets/ttml_subtitle.rs"
test = false
doc  = false

