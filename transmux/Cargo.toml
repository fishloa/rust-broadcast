[package]
name         = "transmux"
version      = "0.25.0"
edition      = "2024"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/fishloa/rust-broadcast"
rust-version.workspace = true
description  = "Any-to-any media container muxing hub: demux TS, fMP4/CMAF, MPEG-PS, WebM, FLV, or RTMP into one neutral IR and mux to CMAF/fMP4, progressive MP4, TS, DASH, low-latency DASH, HLS, low-latency HLS, Smooth Streaming, or RTMP. CENC/CBCS encrypt+decrypt, SSAI splice, RTP/RTCP, and an fMP4/CMAF conformance validator; parses codec config headers only, samples stay opaque. no_std + alloc, except the XML manifest paths (DASH/Smooth/PlayReady), which need the std feature."
keywords     = ["cmaf", "fmp4", "isobmff", "hls", "remux"]
categories   = ["multimedia::video", "parser-implementations", "no-std"]
readme       = "README.md"

[dependencies]
# Floored at 9.2: `cenc::CencScheme` and `hex::hex_encode` (the definitions this
# crate re-exports, shared with `broadcast-hls` — issue #878) landed there.
broadcast-common = { path = "../broadcast-common", version = "9.4", default-features = false }
thiserror  = { version = "2", default-features = false }
# Hex codec for every hex site (SP5); `alloc` only, so the core stays no_std.
hex        = { version = "0.4", default-features = false, features = ["alloc"] }
# base64 codec for SDP sprop, DRM headers and DASH/Smooth payloads (SP5); `alloc` only.
base64     = { version = "0.23", default-features = false, features = ["alloc"] }
# Calendar and duration handling (SP5): CLI availabilityStartTime, xs:duration parse/build. `std`-only, so the no_std core is unaffected.
jiff       = { version = "0.2", default-features = false, features = ["std"], optional = true }
# BaseURL / URL-reference resolution (SP3, `base_url`): WHATWG `Url::join`. `std`-only.
url        = { version = "2", optional = true }
# RTP SDP generation (SP4): `Session::write`. `sdp-types` 0.2 is `std`-only, so SDP generation is `std`-only; tests/rtp.rs also uses its parser as an oracle.
sdp-types  = { version = "0.2", optional = true }
serde      = { version = "1", default-features = false, features = ["derive", "alloc"], optional = true }
# HLS (M3U8) playlist syntax (issue #878): the `ts_hls`/`ll_hls` segmenters
# produce `broadcast_hls::MediaPlaylist`/`MediaSegment` values; the playlist
# syntax itself no longer lives in this crate.
broadcast-hls = { path = "../broadcast-hls", version = "0.3", default-features = false }
mp4-emsg   = { path = "../mp4-emsg",  version = "0.4", default-features = false }
mpeg-ts    = { path = "../mpeg-ts",  version = "0.5", default-features = false }
mpeg-pes   = { path = "../mpeg-pes", version = "0.5", default-features = false }
mpeg-ps    = { path = "../mpeg-ps",  version = "0.5", default-features = false }
rtp-packet = { path = "../rtp-packet", version = "0.4", default-features = false }
rtcp-packet = { path = "../rtcp-packet", version = "0.4", default-features = false }
bytes      = { version = "1", default-features = false }
# XML codec for the DASH MPD / Smooth Streaming / PlayReady WRMHEADER paths: the
# only XML dependency of the crates that read or write XML (transmux,
# dvb-mabr, ttml-subtitle, multimux). std-only (quick-xml needs std).
quick-xml  = { version = "0.42", default-features = false, optional = true }
aes        = { version = "0.9", default-features = false, optional = true }
ctr        = { version = "0.10", default-features = false, optional = true }
cbc        = { version = "0.2", default-features = false, optional = true }
clap       = { version = "4.5", features = ["derive"], optional = true }
# `cli` container detection (issue #960 / audit r05-W29): the CLI's
# `detect_container` used a fixed-offset TS check that missed M2TS (192-byte
# stride) and mid-packet captures; `container-probe` is the crate built to
# replace exactly that. Optional so the `no_std` library build stays free of it.
container-probe = { path = "../container-probe", version = "0.1", default-features = false, optional = true }

[[bin]]
name = "transmux"
required-features = ["cli"]

[[example]]
name = "ssai_ad_stitch"
required-features = ["std"]

[[example]]
name = "transmux_any_to_any"
required-features = ["std"]

[features]
default = ["std", "serde", "cenc"]
std    = ["broadcast-common/std", "thiserror/std", "serde?/std", "broadcast-hls/std", "mp4-emsg/std", "mpeg-ts/std", "mpeg-pes/std", "mpeg-ps/std", "rtp-packet/std", "rtcp-packet/std", "dep:quick-xml", "dep:jiff", "dep:url", "dep:sdp-types"]
serde  = ["dep:serde", "broadcast-common/serde", "broadcast-hls/serde", "mpeg-ts/serde", "mpeg-pes/serde", "mpeg-ps/serde", "rtcp-packet/serde"]
cenc   = ["dep:aes", "dep:ctr", "dep:cbc"]
# `sample-aes` adds Apple HLS Sample-AES + full-segment AES-128 (AES-128-CBC)
# content protection. Extends `cenc` (which already pulls the `cbc` mode crate
# for CENC's own `cbcs` pattern cipher) and adds the `alloc`/`block-padding`
# `cbc` sub-features for its PKCS#7 whole-segment API. All crypto stays
# feature-gated: the default no_std core build has none.
sample-aes = ["cenc", "cbc/alloc", "cbc/block-padding"]
# `cli` builds the `transmux` command-line packager (std + clap). The library
# itself stays `no_std`; only this feature/binary pulls `clap` and `std`.
cli    = ["dep:clap", "dep:container-probe", "std"]

[dev-dependencies]
# Counting/capping test allocator (path-only, publish = false; never published).
test-alloc = { path = "../test-alloc" }
# golden_gate.rs (issue #569) shells out to `ffprobe -of json` and parses the
# result; already resolved workspace-wide at this version (see Cargo.lock), so
# this adds no new dependency to the tree.
serde_json   = "1.0"
# ssai_ad_stitch.rs (issue #664) wires transmux's splice/HLS/DASH machinery to
# the SCTE-35 cue parser and the SCTE-35<->HLS-DATERANGE/DASH-emsg conversion
# crate. Dev-dependency only: transmux itself stays free of a SCTE-35
# dependency (see `splice.rs`'s module docs, "Follow-up") — selecting splice
# *points* from SCTE-35 cues is left to callers, and this example is exactly
# that follow-up wiring, not a library dependency.
scte35-splice  = { path = "../scte35-splice", version = "3.0", default-features = false, features = ["std"] }
timed-metadata = { path = "../timed-metadata", default-features = false, features = ["std"] }

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
