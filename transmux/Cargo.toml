[package]
name         = "transmux"
version      = "0.33.0"
edition      = "2024"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/fishloa/rust-broadcast"
rust-version.workspace = true
description  = "Any-to-any media container muxing hub: demux TS, fMP4/CMAF, MPEG-PS, WebM, FLV, or RTMP into one neutral IR and mux to CMAF/fMP4, progressive MP4, TS, DASH, low-latency DASH, HLS, low-latency HLS, Smooth Streaming, or RTMP. CENC/CBCS encrypt+decrypt, SSAI splice, RTP/RTCP, and an fMP4/CMAF conformance validator; parses codec config headers only, samples stay opaque. no_std + alloc, except the XML manifest paths (DASH/Smooth/PlayReady), which need the std feature."
keywords     = ["cmaf", "fmp4", "isobmff", "hls", "remux"]
categories   = ["multimedia::video", "parser-implementations", "no-std"]
readme       = "README.md"

[dependencies]
# Floored at 9.2: `cenc::CencScheme` and `hex::hex_encode` (the definitions this
# crate re-exports, shared with `broadcast-hls` — issue #878) landed there.
broadcast-common = { path = "../broadcast-common", version = "14.0.0", default-features = false, features = ["base64"] }
# The bitstream parsers that used to be private modules here (the bit reader,
# NAL classification, Annex B conversion, access-unit splitting).
broadcast-bitstream = { path = "../broadcast-bitstream", version = "0.1.0", default-features = false, features = ["h264", "hevc", "vvc", "aac", "ac3", "dts", "mpegh", "mpeg-audio", "isobmff"] }
broadcast-core = { path = "../broadcast-core", version = "0.1.0", default-features = false }
thiserror  = { version = "2", default-features = false }
# Calendar and duration handling (SP5): CLI availabilityStartTime, xs:duration parse/build. `std`-only, so the no_std core is unaffected.
jiff       = { version = "1", default-features = false, features = ["std"], optional = true }
# BaseURL / URL-reference resolution (SP3, `base_url`): WHATWG `Url::join`. `std`-only.
# RTP SDP generation (SP4): `Session::write`. `sdp-types` 0.3 is `std`-only (no `no_std`/`alloc` feature), so SDP generation is `std`-only; tests/it/rtp.rs also uses its parser as an oracle.
sdp-types  = { workspace = true, optional = true }
serde      = { version = "1", default-features = false, features = ["derive", "alloc"], optional = true }
# HLS (M3U8) playlist syntax (issue #878): the `ts_hls`/`ll_hls` segmenters
# produce `broadcast_hls::MediaPlaylist`/`MediaSegment` values; the playlist
# syntax itself no longer lives in this crate.
broadcast-hls = { path = "../broadcast-hls", version = "0.9.0", default-features = false, optional = true }
broadcast-dash = { path = "../broadcast-dash", version = "0.3.0", optional = true, default-features = false }
# EBML (RFC 8794) / Matroska (RFC 9559) element syntax plus the sans-IO reader and
# writer below transmux: `MatroskaDemux` drives the reader, `MkvMuxStage` writes
# through the writer, so no EBML element ID is spelled in this crate.
broadcast-matroska = { path = "../broadcast-matroska", version = "0.1.0", default-features = false, optional = true }
# ISO/IEC 14496-12:2026 box syntax (box headers, the top-level/movie-fragment box
# set, sample tables, CENC boxes). It sits below transmux (broadcast-common +
# thiserror only), so a box-only consumer need not pull in the muxing hub.
isobmff    = { path = "../isobmff", version = "0.1.0", default-features = false }
mpeg-ts    = { path = "../mpeg-ts",  version = "0.10.0", default-features = false }
mpeg-pes   = { path = "../mpeg-pes", version = "0.10.0", default-features = false }
mpeg-ps    = { path = "../mpeg-ps",  version = "0.10.0", default-features = false, optional = true }
rtp-packet = { path = "../rtp-packet", version = "0.9.0", default-features = false, optional = true }
bytes      = { version = "1", default-features = false }
# Caption presence detection (`caption_detect`): `cc_data()` triplets and the 708 service decoder.
cc-data    = { path = "../cc-data", version = "0.11.0", default-features = false, features = ["decode"], optional = true }
# Typed PMT ES_info audio metadata (issue #1162 R1): `TrackSpec::audio_metadata`
# reuses dvb-si's `iso_639_language_descriptor` + `supplementary_audio_descriptor`
# parsers instead of re-parsing. dvb-si does not depend on transmux (no cycle);
# `no_std`+`alloc` with default features off.
dvb-si     = { path = "../dvb-si", version = "16.0.0", default-features = false }
# XML codec for the DASH MPD / Smooth Streaming / PlayReady WRMHEADER paths: the
# only XML dependency of the crates that read or write XML (transmux,
# dvb-mabr, ttml-subtitle, multimux). std-only (quick-xml needs std).
quick-xml  = { workspace = true, optional = true }
# The Smooth client Manifest model + its parse/serialize (issue #2356): the
# manifest syntax sits below the container hub, as broadcast-hls does. It does
# not depend on transmux (no cycle). Optional because the manifest path is an
# XML path: this crate stays `no_std` without `std`, and `std` turns it on.
broadcast-smooth = { path = "../broadcast-smooth", version = "0.3.0", optional = true, default-features = false }
aes        = { version = "0.9", default-features = false, optional = true }
ctr        = { version = "0.10", default-features = false, optional = true }
cbc        = { version = "0.2", default-features = false, optional = true }
# Content-key hygiene (issue #1142): `KeyMap`/`CencEncryptStage` wipe their keys on
# drop and compare keys in constant time. Both are already in the workspace lock.
zeroize    = { version = "1", default-features = false, features = ["alloc"], optional = true }
subtle     = { version = "2", default-features = false, optional = true }
clap       = { workspace = true, optional = true, features = ["derive"] }
# RTMP wire layer (`rtmp.rs` is only the FLV-carrying container spoke): the
# handshake, chunk stream, protocol control messages and AMF0 commands live in
# rtmp-runtime, whose core is no_std + alloc. rtmp-runtime does not depend on
# transmux, so there is no cycle.
rtmp-runtime = { path = "../rtmp-runtime", version = "0.12.0", default-features = false, optional = true }
# `cli` container detection (issue #960 / audit r05-W29): the CLI's
# `detect_container` used a fixed-offset TS check that missed M2TS (192-byte
# stride) and mid-packet captures; `container-probe` is the crate built to
# replace exactly that. Optional so the `no_std` library build stays free of it.
container-probe = { path = "../container-probe", version = "0.6.0", default-features = false, optional = true }
# Typed MISB ST 0601 item values (`LocalSetItem::value_typed`). The value
# semantics live in that crate; transmux keeps only the KLV framing.
motion-imagery-metadata = { version = "0.2", default-features = false, optional = true }

[[bin]]
name = "transmux"
required-features = ["cli"]

[[example]]
name = "ssai_ad_stitch"
required-features = ["std"]

[[example]]
name = "transmux_any_to_any"
required-features = ["std", "matroska"]

[features]
default = ["std", "cenc", "flv", "rtp", "ps", "matroska", "hls", "captions"]
std    = ["broadcast-bitstream/std", "cc-data?/std", "dvb-si/std", "broadcast-common/std", "broadcast-core/std", "broadcast-common/xml", "broadcast-common/lang", "thiserror/std", "serde?/std", "broadcast-hls?/std", "isobmff/std", "broadcast-matroska?/std", "mpeg-ts/std", "mpeg-pes/std", "mpeg-ps?/std", "rtp-packet?/std", "dep:quick-xml", "dep:jiff", "dep:sdp-types", "dep:broadcast-smooth", "broadcast-smooth/manifest", "dep:broadcast-dash"]
serde  = ["dep:serde", "broadcast-bitstream/serde", "broadcast-common/serde", "broadcast-core/serde", "broadcast-hls?/serde", "isobmff/serde", "mpeg-ts/serde", "mpeg-pes/serde", "mpeg-ps?/serde", "rtp-packet?/serde"]
cenc   = ["dep:aes", "dep:ctr", "dep:cbc", "dep:zeroize", "dep:subtle"]
# `flv` enables the Adobe FLV container spoke: the FLV muxer ([`FlvMuxStage`]), the
# streaming FLV demuxer ([`StreamingFlvDemux`]), and the RTMP signalling that
# carries FLV, all over `rtmp-runtime`'s wire layer.
flv    = ["dep:rtmp-runtime"]
# `rtp` enables the RTP/RTCP spoke: the packetiser ([`RtpPacketiserStage`]),
# streaming depayload ([`RtpStreamDepacketiser`]), the RTCP packet types and the
# A/V alignment helper, all over `rtp-packet`'s wire layer. The payload-format
# types and clock constants the IR and the SDP path share stay available without
# it.
rtp    = ["dep:rtp-packet"]
# `ps` enables the MPEG-2 Program Stream demux stage ([`StreamingPsDemux`]): the
# `mpeg-ps` framing layer and the `StreamingPsDemux` stage over its scanner.
ps     = ["dep:mpeg-ps"]
# `matroska` enables the EBML/Matroska/WebM spoke: the `MatroskaDemux` stage over
# `broadcast-matroska`'s reader and the `MkvMuxStage` over its writer.
matroska = ["dep:broadcast-matroska"]
# `hls` enables the HLS segmenters and playlist renderers: the TS-segment
# (`StreamingTsHlsSegmenter`) and low-latency (`LlHlsSegmenter`) segmenters, the
# `HlsPackager` playlist renderer, and the HLS `INSTREAM-ID` half of caption
# detection, all over `broadcast-hls`'s playlist syntax.
hls    = ["dep:broadcast-hls"]
# `captions` enables caption presence detection (`caption_detect`): the
# `cc_data()` triplet walk and the CEA-608/708 service decoders from `cc-data`.
captions = ["dep:cc-data"]
# `sample-aes` adds Apple HLS Sample-AES + full-segment AES-128 (AES-128-CBC)
# content protection. Extends `cenc` (which already pulls the `cbc` mode crate
# for CENC's own `cbcs` pattern cipher) and adds the `alloc`/`block-padding`
# `cbc` sub-features for its PKCS#7 whole-segment API; it writes `#EXT-X-KEY`
# attribute lists through `broadcast-hls`, so it implies `hls`. All crypto stays
# feature-gated: the default no_std core build has none.
sample-aes = ["cenc", "cbc/alloc", "cbc/block-padding", "hls"]
# Test-only gate for the `scan-counters` instrumentation test; not enabled by
# default, so a normal build never compiles the counter.
scan-counters = ["isobmff/scan-counters"]
# `cli` builds the `transmux` command-line packager (std + clap). The library
# itself stays `no_std`; only this feature/binary pulls `clap` and `std`. It
# also turns on every container spoke the binary can read or write.
cli    = ["dep:clap", "dep:container-probe", "std", "flv", "rtp", "ps", "matroska", "hls"]
# `motion-imagery-metadata` adds `LocalSetItem::value_typed()`, the item value
# decoded by the `motion-imagery-metadata` crate.
motion-imagery-metadata = ["dep:motion-imagery-metadata"]

[dev-dependencies]
test-fixtures = { path = "../test-fixtures" }
test-harness = { path = "../test-harness" }
container-probe = { path = "../container-probe", version = "0.6.0" }
# `tests/it/rtp.rs` / `golden_wire.rs` render the session description over
# `rtp_run::RtpOutput::medias` with the one workspace builder (`rtsp-runtime::sdp`).
# Dev-only: transmux itself never depends on the RTSP crate.
rtsp-runtime   = { path = "../rtsp-runtime", default-features = false }
# `golden.rs` takes the guard lexer (`scan::non_test_source`) rather than a copy.
workspace-guards = { path = "../workspace-guards" }
# Counting/capping test allocator (path-only, publish = false; never published).
test-alloc = { path = "../test-alloc" }
# golden_gate.rs (issue #569) shells out to `ffprobe -of json` and parses the
# result; already resolved workspace-wide at this version (see Cargo.lock), so
# this adds no new dependency to the tree.
serde_json   = { workspace = true }
# Test instrumentation only: `tests/it/isobmff_bridge.rs` asserts the fMP4 demux
# scans a file's `mdat`s once, which needs isobmff's `scan-counters` feature.
# Enabled on the dev edge only, never in a normal build.
isobmff      = { path = "../isobmff", version = "0.1.0", features = ["scan-counters"] }
# ssai_ad_stitch.rs (issue #664) wires transmux's splice/HLS/DASH machinery to
# the SCTE-35 cue parser and the SCTE-35<->HLS-DATERANGE/DASH-emsg conversion
# crate. Dev-dependency only: transmux itself stays free of a SCTE-35
# dependency (see `splice.rs`'s module docs, "Follow-up") — selecting splice
# *points* from SCTE-35 cues is left to callers, and this example is exactly
# that follow-up wiring, not a library dependency.
scte35-splice  = { path = "../scte35-splice", version = "8.0.0", default-features = false, features = ["std"] }
timed-metadata = { path = "../timed-metadata", default-features = false, features = ["std", "cc-data", "teletext"] }
# timed_metadata_sei_caption_fixture.rs / timed_metadata_teletext_tsduck_oracle.rs
# feed timed-metadata's cue extractors from transmux's own SEI unwrap and TS
# demux, so they name the carriage crates directly.
cc-data        = { path = "../cc-data", default-features = false, features = ["decode"] }
dvb-vbi        = { path = "../dvb-vbi", default-features = false }
# ts_mux_psi_repeat.rs checks the muxer's output against the independent ETSI
# TR 101 290 monitor (PAT/PMT repetition, continuity). Dev-dependency only;
# dvb-conformance does not depend on transmux, so there is no cycle.
dvb-conformance = { path = "../dvb-conformance", default-features = false, features = ["std"] }
# The PAFF fixtures are pinned by the SHA-256 recorded in
# `fixtures/video/paff/PROVENANCE.md` (a plain-image byte stream is not something
# our own parsers can check for identity), and `examples/regen_paff_fixtures.rs`
# prints the digests it would write. Dev-dependency only: the crate itself
# never hashes. Already in the workspace lock (broadcast-auth, broadcast-client,
# webrtc-runtime), so this adds no crate to the tree.
sha2         = { version = "0.11", default-features = false }
criterion    = { version = "0.8", features = ["html_reports"] }

[[bench]]
name    = "annexb_scan"
harness = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
