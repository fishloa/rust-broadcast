[package]
name         = "isobmff-tokio"
version      = "0.1.0"
edition      = "2024"
description  = "Async (tokio) driver over the isobmff sans-IO MP4 reader."
license      = "MIT OR Apache-2.0"
authors      = ["Alex Fishlock <alex.fishlock@racingjag.com>"]
keywords     = ["isobmff", "mp4", "tokio", "async", "streaming"]
categories   = ["asynchronous", "multimedia", "parser-implementations"]
repository   = "https://github.com/fishloa/rust-broadcast"
readme       = "README.md"
rust-version.workspace = true
exclude = ["docs/**"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
isobmff = { path = "../isobmff", version = "0.1.0", features = ["std"] }
tokio   = { version = "1", default-features = false, features = ["io-util"] }

[dev-dependencies]
test-fixtures = { path = "../test-fixtures" }
tokio         = { version = "1", default-features = false, features = ["fs", "macros", "rt"] }

[[example]]
name = "list_samples"

[[example]]
name = "read_sample"

[lints]
workspace = true
