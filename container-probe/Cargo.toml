[package]
name    = "container-probe"
version = "0.6.0"
edition = "2024"
description = "Robust media container-format detection — MPEG-2 TS (188/192/204/208 stride + phase), ISOBMFF, Matroska/WebM, MPEG-PS, FLV, MXF, WAV, Ogg, ASF, and elementary streams."
license      = "MIT OR Apache-2.0"
authors      = ["Alex Fishlock <alex.fishlock@racingjag.com>"]
keywords = ["container", "detection", "mpeg-ts", "mp4", "probe"]
categories = ["parser-implementations", "multimedia", "no-std"]
repository   = "https://github.com/fishloa/rust-broadcast"
readme       = "README.md"
rust-version.workspace = true
exclude = ["docs/**"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
broadcast-core = { path = "../broadcast-core", version = "0.1.0", default-features = false }
# The one ADTS and MPEG audio header parser in the workspace (features `aac`
# and `mpeg-audio`). The probers keep their own chain walk, scoring and fixture
# builders; only the header parse is shared, so a probe can never disagree with
# the demuxers about what a frame header is.
broadcast-bitstream = { path = "../broadcast-bitstream", version = "0.1.0", default-features = false, features = ["aac", "mpeg-audio"] }

# Dev-only: the drift guard pins this crate's constants against the crates that
# already validate them against real fixtures.
[dev-dependencies]
mpeg-ts  = { path = "../mpeg-ts",  version = "0.10.0" }
mpeg-ps  = { path = "../mpeg-ps",  version = "0.10.0" }
st377-1  = { path = "../st377-1",  version = "0.9.0" }
isobmff  = { path = "../isobmff",  version = "0.1.0", default-features = false }
test-alloc = { path = "../test-alloc" }
test-fixtures = { path = "../test-fixtures" }

[features]
default = ["std"]
# `std` links the standard library. Without it the crate is `#![no_std]` and
# needs only `alloc`.
std = ["broadcast-core/std", "broadcast-bitstream/std"]

[lints]
workspace = true
