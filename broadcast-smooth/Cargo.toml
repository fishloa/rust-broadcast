[package]
name    = "broadcast-smooth"
version              = "0.1.0"
edition = "2024"
description = "Microsoft Smooth Streaming (MS-SSTR) client Manifest: typed model with parse and serialize."
license      = "MIT OR Apache-2.0"
authors      = ["Alex Fishlock <alex.fishlock@racingjag.com>"]
keywords = ["smooth-streaming", "ms-sstr", "manifest", "xml"]
categories = ["parser-implementations", "multimedia"]
repository   = "https://github.com/fishloa/rust-broadcast"
readme       = "README.md"
rust-version.workspace = true
exclude = ["docs/**"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
broadcast-common = { path = "../broadcast-common", version = "11.1.0", default-features = false, features = ["xml"] }
quick-xml  = { workspace = true }
thiserror  = { version = "2", default-features = false }

[dev-dependencies]
test-fixtures = { path = "../test-fixtures" }

[features]
default = ["std", "manifest"]
# `std` links the standard library. Without it the crate is `#![no_std]` and
# needs only `alloc`.
std = ["broadcast-common/std", "thiserror/std"]
# The client Manifest itself: parsing and serializing XML. Separate from `std`
# only so the XML code has an honest name; on with it, because the shared XML
# module it reads through (`broadcast-common/xml`) is std-only.
manifest = ["std", "broadcast-common/xml"]

[lints]
workspace = true
