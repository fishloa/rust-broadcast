# Its own workspace root, so `cargo` invoked in here never walks up and adopts
# the repo's workspace (which pins MSRV 1.86 and the lockstep versions). The
# root manifest's `exclude` keeps it out of the member glob, but that alone does
# not stop the upward walk — `transmux-py` already carries this stanza for the
# same reason, and without it a build from inside a git worktree fails outright.
[workspace]

[package]
name    = "dvb-si-py"
version = "0.2.0"
edition = "2021"
description = "Python bindings for dvb-si — parse DVB SI/PSI sections and demux MPEG-TS into Python dicts."
license      = "MIT OR Apache-2.0"
authors      = ["Alex Fishlock <alex.fishlock@racingjag.com>"]
repository   = "https://github.com/fishloa/rust-broadcast"
readme       = "README.md"
# NOT a workspace member (PyO3 MSRV moves faster than the workspace 1.86); it
# consumes the published dvb-si crate by version, not path.

[lib]
name = "dvb_si_py"
crate-type = ["cdylib"]

[dependencies]
pyo3       = { version = "0.24", features = ["extension-module", "abi3-py39"] }
pythonize  = "0.24"
serde      = "1"
serde_json = "1"
# Consumed by VERSION (from crates.io), not path — keeps the binding decoupled
# from the workspace and its MSRV/lockstep.
dvb-si     = { version = "9", features = ["ts", "serde", "chrono"] }
dvb-t2mi   = { version = "9", features = ["ts", "serde"] }
