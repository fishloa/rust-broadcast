[package]
name         = "broadcast-common"
version      = "10.0.0"
edition      = "2024"
description  = "Foundation for the rust-broadcast crates: symmetric Parse/Serialize traits, CRC-32/MPEG-2, BCD + MJD time codecs, bit I/O, 33-bit/PCR clock arithmetic, checked field widths, container-mux and Stage traits. no_std + alloc."
license      = "MIT OR Apache-2.0"
authors      = ["Alex Fishlock <alex.fishlock@racingjag.com>"]
keywords     = ["dvb", "mpeg", "broadcast", "crc", "parser"]
categories   = ["parser-implementations", "multimedia"]
repository   = "https://github.com/fishloa/rust-broadcast"
readme       = "README.md"
rust-version.workspace = true
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
[features]
default = ["std"]
# `std` links the standard library. Without it the crate is `#![no_std]` and
# needs only `alloc`. chrono's wall-clock and the std `Error` glue are std-only;
# the parse/serialize/CRC/BCD/MJD core is fully no_std.
std = ["chrono?/std", "chrono?/clock", "serde?/std"]
# MJD↔calendar conversion for the UTC time codec. Off = the BCD/duration
# helpers remain available; only the chrono-typed UTC functions are gated.
chrono = ["dep:chrono"]
# `serde::Serialize` derives on the shared spec types (currently
# `cenc::CencScheme`). Off by default: the parse/serialize core needs no
# serialization framework, and a consumer that wants one enables it through
# its own `serde` feature (e.g. `transmux/serde`, `broadcast-hls/serde`).
serde = ["dep:serde"]

[dependencies]
# Default build stays lean — consumers of broadcast_common pay for nothing they aren't
# already paying for downstream. `chrono` is pulled only when the `chrono`
# feature is enabled (e.g. by dvb-si's own `chrono` feature); it is configured
# `no_std + alloc` so it composes with the crate's `no_std` build.
chrono = { workspace = true, optional = true, features = ["alloc"] }
# Hex codec backing `hex::hex_encode` (SP5). `alloc` only: the crate stays no_std.
hex = { version = "0.4", default-features = false, features = ["alloc"] }
# Only pulled in by the `serde` feature — see its comment above. Configured
# `no_std` (`derive` only, no `std`) so it composes with the no_std build.
serde = { version = "1", optional = true, default-features = false, features = ["derive", "alloc"] }

[dev-dependencies]
criterion = { workspace = true, features = ["html_reports"] }

[[bench]]
name    = "crc32"
harness = false

[lints]
workspace = true
