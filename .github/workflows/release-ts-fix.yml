name: Release ts-fix

# Publishes the ts-fix crate to crates.io on a `ts-fix-v*` tag.
# ts-fix is versioned and released INDEPENDENTLY. CI is the only source of
# published artifacts — never `cargo publish` from a workstation. Requires the
# CARGO_REGISTRY_TOKEN secret.
#
# DEPENDENCY ORDER: ts-fix depends on mpeg-ts, mpeg-pes, dvb-si and scte35-splice.
# Publish those at the referenced versions FIRST, or crates.io will reject the
# publish because a required dependency is not yet live.

on:
  push:
    tags: ["ts-fix-v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: publish ts-fix to crates.io
    runs-on: ubuntu-latest
    # crates.io publish is gated: pauses for manual approval by a
    # required reviewer before any cargo publish can run. See the
    # 'crates-io' environment (repo Settings -> Environments).
    environment: crates-io
    # `contents: write` is needed to create the GitHub Release below, and is
    # the only elevated permission this job holds — `cargo publish`
    # authenticates with CARGO_REGISTRY_TOKEN, not the GitHub token.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2

      - name: Gate — ts-fix tests
        run: cargo test -p ts-fix --all-features --locked

      - name: Gate — ts-fix clippy
        run: cargo clippy -p ts-fix --all-features --all-targets --locked -- -D warnings

      - name: Gate — ts-fix no_std (+alloc) lib build
        run: cargo build -p ts-fix --no-default-features --locked

      - name: Gate — ts-fix examples build
        run: cargo build -p ts-fix --all-features --examples --locked

      - name: Gate — tag matches ts-fix version
        run: |
          TAG="${GITHUB_REF_NAME#ts-fix-v}"
          V=$(cargo metadata --no-deps --format-version 1 --locked \
              | python3 -c "import json,sys; print({p['name']: p['version'] for p in json.load(sys.stdin)['packages']}['ts-fix'])")
          if [ "$V" != "$TAG" ]; then
            echo "::error::ts-fix is $V but tag is $TAG"; exit 1
          fi

      # docs/RELEASE-DOCS.md requires a release note per tag, and this workflow
      # uses it as the GitHub Release body — so a missing one is caught HERE,
      # before anything reaches crates.io, rather than after the version is
      # already immutable.
      - name: Gate — release note exists for this version
        run: |
          NOTE="docs/release-notes/ts-fix-${GITHUB_REF_NAME#ts-fix-v}.md"
          if [ ! -s "$NOTE" ]; then
            echo "::error::$NOTE is missing or empty — see docs/RELEASE-DOCS.md"
            exit 1
          fi
          echo "::notice::release note $NOTE present"

      - name: Publish ts-fix
        run: |
          if out=$(cargo publish -p ts-fix --locked 2>&1); then
            echo "$out"; echo "::notice::published ts-fix"
          elif echo "$out" | grep -qiE "already (been )?uploaded|already exists"; then
            echo "$out"; echo "::notice::ts-fix already on crates.io at this version — skipping"
          else
            echo "$out"; echo "::error::failed to publish ts-fix"; exit 1
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      # docs/RELEASE-DOCS.md section 3: a GitHub Release per tag, body = the
      # release note. This was a manual step for the first 191 releases and was
      # missed for 102 tags, so it is automated. Idempotent: an existing
      # release is left untouched, so re-running after a partial failure is
      # safe.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${GITHUB_REF_NAME#ts-fix-v}"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::notice::GitHub Release $GITHUB_REF_NAME already exists — leaving it alone"
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "ts-fix $V" \
              --notes-file "docs/release-notes/ts-fix-$V.md"
            echo "::notice::created GitHub Release $GITHUB_REF_NAME"
          fi

  # Compiled binaries for the four supported targets, attached to the Release
  # this tag's publish job creates. crates.io carries the source; without this
  # there is no way to use ts-fix without a Rust toolchain.
  binaries:
    needs: publish
    uses: ./.github/workflows/reusable-binaries.yml
    with:
      crate: ts-fix
      bin: ts-fix
      features: cli
