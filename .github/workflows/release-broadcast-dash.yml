name: Release broadcast-dash

# Publishes the broadcast-dash crate to crates.io on a `broadcast-dash-v*` tag.
# broadcast-dash is versioned and released INDEPENDENTLY of the lockstep `v*`
# tag (it is a standalone reusable crate with its own cadence), so it has its
# own publish workflow. CI is the only source of published artifacts — never
# `cargo publish` from a workstation. Requires the CARGO_REGISTRY_TOKEN secret.

on:
  push:
    tags: ["broadcast-dash-v*"]

jobs:
  publish:
    permissions:
      contents: write
    uses: ./.github/workflows/publish-crate.yml
    secrets: inherit
    with:
      crate: broadcast-dash
      build-gate: no-default
