name: Release atsc3-route

# Publishes the atsc3-route crate to crates.io on a `atsc3-route-v*` tag.
# atsc3-route is versioned and released INDEPENDENTLY (standalone reusable
# crate with its own cadence, split out of `atsc3` per issue #943). CI is the
# only source of published artifacts — never `cargo publish` from a
# workstation. Requires the CARGO_REGISTRY_TOKEN secret.
#
# DEPENDENCY ORDER: atsc3-route depends on broadcast-common (lockstep,
# already live) and rmt-flute (>= 0.4, already live). No new crate needs to
# land before this one. It is a sibling of `atsc3` (not a dependency of it,
# nor a dependent) — the two publish independently of each other.

on:
  push:
    tags: ["atsc3-route-v*"]

jobs:
  publish:
    permissions:
      contents: write
    uses: ./.github/workflows/publish-crate.yml
    secrets: inherit
    with:
      crate: atsc3-route
