name: Publish crate

# Reusable release lane: every `release-<crate>.yml` is a thin caller of this
# workflow, kept per crate only because `on.push.tags` is per file. CI is the
# only source of published artifacts — never `cargo publish` from a workstation.
# Requires the CARGO_REGISTRY_TOKEN secret (callers pass `secrets: inherit`).
#
# Callers must grant `permissions: contents: write` on the calling job: the
# GitHub Release step needs it, and a called workflow cannot hold more
# permission than its caller.

on:
  workflow_call:
    inputs:
      crate:
        description: Cargo package name; the tag is `<crate>-v<version>`.
        type: string
        required: true
      build-gate:
        description: >
          Which no-default-features gate to run: `bare-metal`
          (--no-default-features --target thumbv7em-none-eabi), `no-default`
          (--no-default-features on the host) or `default` (plain host build).
        type: string
        default: bare-metal
      examples:
        description: Gate on `cargo build --all-features --examples`.
        type: boolean
        default: true
      fuzz-target:
        description: When set, gate on a bounded run of this cargo-fuzz target.
        type: string
        default: ""
      oracle-skip:
        description: Set MULTIMUX_ALLOW_ORACLE_SKIP=1 so missing external-oracle tools skip, as in ci.yml.
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: publish ${{ inputs.crate }} to crates.io
    runs-on: ubuntu-24.04
    environment: crates-io
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Private fixtures (real-capture tests)
        uses: ./.github/actions/private-fixtures
        with:
          deploy-key: ${{ secrets.PRIVATE_FIXTURES_DEPLOY_KEY }}
          skip: ${{ vars.SKIP_PRIVATE_FIXTURES }}
      - uses: Swatinem/rust-cache@v2

      - name: Allow external-oracle skips
        if: inputs.oracle-skip
        run: echo "MULTIMUX_ALLOW_ORACLE_SKIP=1" >> "$GITHUB_ENV"

      - name: Gate — tests
        run: cargo test -p "$CRATE" --all-features --locked
        env:
          CRATE: ${{ inputs.crate }}

      - name: Gate — clippy
        run: cargo clippy -p "$CRATE" --all-features --all-targets --locked -- -D warnings
        env:
          CRATE: ${{ inputs.crate }}

      - name: Gate — no_std build
        if: inputs.build-gate == 'bare-metal'
        run: cargo build -p "$CRATE" --no-default-features --target thumbv7em-none-eabi --locked
        env:
          CRATE: ${{ inputs.crate }}

      - name: Gate — no-default-features build
        if: inputs.build-gate == 'no-default'
        run: cargo build -p "$CRATE" --no-default-features --locked
        env:
          CRATE: ${{ inputs.crate }}

      - name: Gate — default-feature build
        if: inputs.build-gate == 'default'
        run: cargo build -p "$CRATE" --locked
        env:
          CRATE: ${{ inputs.crate }}

      - name: Gate — examples build
        if: inputs.examples
        run: cargo build -p "$CRATE" --all-features --examples --locked
        env:
          CRATE: ${{ inputs.crate }}

      - name: Gate — fuzz run
        if: inputs.fuzz-target != ''
        run: |
          rustup toolchain install nightly --profile minimal
          cargo install cargo-fuzz --locked || true
          cd fuzz
          cargo +nightly fuzz run "$FUZZ_TARGET" --target x86_64-unknown-linux-gnu \
            -- -runs=50000 -max_total_time=120
        env:
          FUZZ_TARGET: ${{ inputs.fuzz-target }}

      - name: Gate — tag matches crate version
        run: |
          TAG="${GITHUB_REF_NAME#"$CRATE"-v}"
          V=$(cargo metadata --no-deps --format-version 1 --locked \
              | CRATE="$CRATE" python3 -c "import json,os,sys; print({p['name']: p['version'] for p in json.load(sys.stdin)['packages']}[os.environ['CRATE']])")
          if [ "$V" != "$TAG" ]; then
            echo "::error::$CRATE is $V but tag is $TAG"; exit 1
          fi
        env:
          CRATE: ${{ inputs.crate }}

      # docs/RELEASE-DOCS.md requires a release note per tag, and this workflow
      # uses it as the GitHub Release body — so a missing one is caught HERE,
      # before anything reaches crates.io, rather than after the version is
      # already immutable.
      - name: Gate — release note exists for this version
        run: |
          NOTE="docs/release-notes/$CRATE-${GITHUB_REF_NAME#"$CRATE"-v}.md"
          if [ ! -s "$NOTE" ]; then
            echo "::error::$NOTE is missing or empty — see docs/RELEASE-DOCS.md"
            exit 1
          fi
          echo "::notice::release note $NOTE present"
        env:
          CRATE: ${{ inputs.crate }}

      # Idempotent: an "already uploaded" error is treated as success.
      - name: Publish
        run: |
          if out=$(cargo publish -p "$CRATE" --locked 2>&1); then
            echo "$out"; echo "::notice::published $CRATE"
          elif echo "$out" | grep -qiE "already (been )?uploaded|already exists"; then
            echo "$out"; echo "::notice::$CRATE already on crates.io at this version — skipping"
          else
            echo "$out"; echo "::error::failed to publish $CRATE"; exit 1
          fi
        env:
          CRATE: ${{ inputs.crate }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      # docs/RELEASE-DOCS.md section 3: a GitHub Release per tag, body = the
      # release note. Idempotent: an existing release is left untouched, so
      # re-running after a partial failure is safe.
      - name: Create GitHub Release
        env:
          CRATE: ${{ inputs.crate }}
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${GITHUB_REF_NAME#"$CRATE"-v}"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::notice::GitHub Release $GITHUB_REF_NAME already exists — leaving it alone"
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "$CRATE $V" \
              --notes-file "docs/release-notes/$CRATE-$V.md"
            echo "::notice::created GitHub Release $GITHUB_REF_NAME"
          fi
