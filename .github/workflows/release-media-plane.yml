name: Release media-plane

# Publishes the media-plane crate to crates.io on a `media-plane-v*` tag.
# media-plane is versioned and released INDEPENDENTLY (standalone integration
# crate with its own cadence). CI is the only source of published artifacts —
# never `cargo publish` from a workstation. Requires the CARGO_REGISTRY_TOKEN
# secret.
#
# DEPENDENCY ORDER: media-plane depends on broadcast-common (lockstep, already
# live), and — only under its `std` feature — transmux (>= 0.20, already live)
# and timed-metadata (>= 0.4, already live). Its scte35-splice dep is dev-only
# (tests) and does not gate publishing. No new crate needs to land before this
# one.

on:
  push:
    tags: ["media-plane-v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: publish media-plane to crates.io
    runs-on: ubuntu-latest
    # crates.io publish is gated: pauses for manual approval by a
    # required reviewer before any cargo publish can run. See the
    # 'crates-io' environment (repo Settings -> Environments).
    environment: crates-io
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2

      - name: Gate — media-plane tests (all features)
        run: cargo test -p media-plane --all-features --locked

      - name: Gate — media-plane clippy
        run: cargo clippy -p media-plane --all-features --all-targets --locked -- -D warnings

      - name: Gate — media-plane byte-layer-only (no-default-features) build
        run: cargo build -p media-plane --no-default-features --locked

      - name: Gate — media-plane examples build
        run: cargo build -p media-plane --all-features --examples --locked

      - name: Gate — tag matches media-plane version
        run: |
          TAG="${GITHUB_REF_NAME#media-plane-v}"
          V=$(cargo metadata --no-deps --format-version 1 --locked \
              | python3 -c "import json,sys; print({p['name']: p['version'] for p in json.load(sys.stdin)['packages']}['media-plane'])")
          if [ "$V" != "$TAG" ]; then
            echo "::error::media-plane is $V but tag is $TAG"; exit 1
          fi

      - name: Publish media-plane
        run: |
          if out=$(cargo publish -p media-plane --locked 2>&1); then
            echo "$out"; echo "::notice::published media-plane"
          elif echo "$out" | grep -qiE "already (been )?uploaded|already exists"; then
            echo "$out"; echo "::notice::media-plane already on crates.io at this version — skipping"
          else
            echo "$out"; echo "::error::failed to publish media-plane"; exit 1
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
