name: Release webrtc-runtime

# Publishes the webrtc-runtime crate to crates.io on a `webrtc-runtime-v*`
# tag. webrtc-runtime is versioned and released INDEPENDENTLY (standalone
# integration crate with its own cadence). CI is the only source of published
# artifacts — never `cargo publish` from a workstation. Requires the
# CARGO_REGISTRY_TOKEN secret.
#
# DEPENDENCY ORDER: webrtc-runtime depends on broadcast-common and
# broadcast-auth (>= 0.2, already live), and — only under its optional
# `media` feature — rtp-packet (>= 0.3, already live) and rtcp-packet
# (>= 0.2, already live) plus external `rtc-*`/`sansio` crates (not workspace
# members). Downstream, `multimux` depends on webrtc-runtime (>= 0.1,
# optional, under its `whip`/`whep` features) and also on hls-runtime — the
# audit's forced publish order for that wave is:
#   webrtc-runtime -> hls-runtime -> multimux -> multimux-cli
# webrtc-runtime and hls-runtime must both be live before multimux is tagged;
# multimux-cli depends on multimux and must come last.
#
# MSRV NOTE: `media` used to require rustc >= 1.88 (rtc-dtls's `rcgen` dep)
# while the workspace MSRV was 1.86, so it was excluded from `--all-features`
# CI lanes. Raising the workspace MSRV to 1.95.0 (issue #949) closed that gap
# — every feature, including `media`, now builds on the pinned MSRV toolchain
# these gates run on. webrtc-runtime is NOT in the workspace's bare-metal
# no_std job (`ci.yml`'s `no-std` target list) — the `media` feature's
# `rtc-*`/`sansio` dependency tree is std-only, so unlike the other nine
# lanes in this wave there is no thumbv7em-none-eabi gate here. The
# signalling-only core (`--no-default-features`) is `no_std`+`alloc` per the
# crate's own README, verified below on the host target instead.

on:
  push:
    tags: ["webrtc-runtime-v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: publish webrtc-runtime to crates.io
    runs-on: ubuntu-latest
    # crates.io publish is gated: pauses for manual approval by a
    # required reviewer before any cargo publish can run. See the
    # 'crates-io' environment (repo Settings -> Environments).
    environment: crates-io
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2

      - name: Gate — webrtc-runtime tests (all features, incl. media)
        run: cargo test -p webrtc-runtime --all-features --locked

      - name: Gate — webrtc-runtime clippy (all features)
        run: cargo clippy -p webrtc-runtime --all-features --all-targets --locked -- -D warnings

      - name: Gate — webrtc-runtime signalling-only (no_std+alloc) build
        run: cargo build -p webrtc-runtime --no-default-features --locked

      - name: Gate — webrtc-runtime examples build (all features)
        run: cargo build -p webrtc-runtime --all-features --examples --locked

      - name: Gate — tag matches webrtc-runtime version
        run: |
          TAG="${GITHUB_REF_NAME#webrtc-runtime-v}"
          V=$(cargo metadata --no-deps --format-version 1 --locked \
              | python3 -c "import json,sys; print({p['name']: p['version'] for p in json.load(sys.stdin)['packages']}['webrtc-runtime'])")
          if [ "$V" != "$TAG" ]; then
            echo "::error::webrtc-runtime is $V but tag is $TAG"; exit 1
          fi

      # Idempotent: an "already uploaded" error is treated as success.
      - name: Publish webrtc-runtime
        run: |
          if out=$(cargo publish -p webrtc-runtime --locked 2>&1); then
            echo "$out"; echo "::notice::published webrtc-runtime"
          elif echo "$out" | grep -qiE "already (been )?uploaded|already exists"; then
            echo "$out"; echo "::notice::webrtc-runtime already on crates.io at this version — skipping"
          else
            echo "$out"; echo "::error::failed to publish webrtc-runtime"; exit 1
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
