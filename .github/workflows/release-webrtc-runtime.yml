name: Release webrtc-runtime

# Publishes the webrtc-runtime crate to crates.io on a `webrtc-runtime-v*`
# tag. webrtc-runtime is versioned and released INDEPENDENTLY (standalone
# integration crate with its own cadence). CI is the only source of published
# artifacts — never `cargo publish` from a workstation. Requires the
# CARGO_REGISTRY_TOKEN secret.
#
# DEPENDENCY ORDER: webrtc-runtime depends on broadcast-common and
# broadcast-auth (>= 0.2, already live), and — only under its optional
# `media` feature — rtp-packet (>= 0.3, already live, incl. its `rtcp` module) plus external
# `rtc-*`/`sansio` crates (not workspace members). Downstream, `multimux` depends on webrtc-runtime (>= 0.1,
# optional, under its `whip`/`whep` features) and also on hls-runtime — the
# audit's forced publish order for that wave is:
#   webrtc-runtime -> hls-runtime -> multimux -> multimux-cli
# webrtc-runtime and hls-runtime must both be live before multimux is tagged;
# multimux-cli depends on multimux and must come last.
#
# MSRV NOTE: `media` used to require rustc >= 1.88 (rtc-dtls's `rcgen` dep)
# while the workspace MSRV was 1.86, so it was excluded from `--all-features`
# CI lanes. Raising the workspace MSRV to 1.95.0 (issue #949) closed that gap
# — every feature, including `media`, now builds on the pinned MSRV toolchain
# these gates run on. webrtc-runtime is NOT in the workspace's bare-metal
# no_std job (`ci.yml`'s `no-std` target list) — the `media` feature's
# `rtc-*`/`sansio` dependency tree is std-only, so unlike the other nine
# lanes in this wave there is no thumbv7em-none-eabi gate here. The
# signalling-only core (`--no-default-features`) is `no_std`+`alloc` per the
# crate's own README, verified below on the host target instead.

on:
  push:
    tags: ["webrtc-runtime-v*"]

jobs:
  publish:
    permissions:
      contents: write
    uses: ./.github/workflows/publish-crate.yml
    secrets: inherit
    with:
      crate: webrtc-runtime
      build-gate: no-default
