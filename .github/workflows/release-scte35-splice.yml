name: Release scte35-splice

# Publishes the scte35-splice crate to crates.io on a `scte35-splice-v*` tag.
# scte35-splice is versioned and released INDEPENDENTLY of the lockstep `v*`
# tag (it is a standalone reusable crate with its own cadence), so it has its
# own publish workflow. CI is the only source of published artifacts — never
# `cargo publish` from a workstation. Requires the CARGO_REGISTRY_TOKEN secret.

on:
  push:
    tags: ["scte35-splice-v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: publish scte35-splice to crates.io
    runs-on: ubuntu-latest
    # crates.io publish is gated: pauses for manual approval by a
    # required reviewer before any cargo publish can run. See the
    # 'crates-io' environment (repo Settings -> Environments).
    environment: crates-io
    # `contents: write` is needed to create the GitHub Release below, and is
    # the only elevated permission this job holds — `cargo publish`
    # authenticates with CARGO_REGISTRY_TOKEN, not the GitHub token.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2

      - name: Gate — scte35-splice tests
        run: cargo test -p scte35-splice --all-features --locked

      - name: Gate — scte35-splice clippy
        run: cargo clippy -p scte35-splice --all-features --all-targets --locked -- -D warnings

      - name: Gate — scte35-splice no_std build
        run: cargo build -p scte35-splice --no-default-features --target thumbv7em-none-eabi --locked

      - name: Gate — scte35-splice examples build
        run: cargo build -p scte35-splice --all-features --examples --locked

      - name: Gate — tag matches scte35-splice version
        run: |
          TAG="${GITHUB_REF_NAME#scte35-splice-v}"
          V=$(cargo metadata --no-deps --format-version 1 --locked \
              | python3 -c "import json,sys; print({p['name']: p['version'] for p in json.load(sys.stdin)['packages']}['scte35-splice'])")
          if [ "$V" != "$TAG" ]; then
            echo "::error::scte35-splice is $V but tag is $TAG"; exit 1
          fi

      # Idempotent: an "already uploaded" error is treated as success.
      # docs/RELEASE-DOCS.md requires a release note per tag, and this workflow
      # uses it as the GitHub Release body — so a missing one is caught HERE,
      # before anything reaches crates.io, rather than after the version is
      # already immutable.
      - name: Gate — release note exists for this version
        run: |
          NOTE="docs/release-notes/scte35-splice-${GITHUB_REF_NAME#scte35-splice-v}.md"
          if [ ! -s "$NOTE" ]; then
            echo "::error::$NOTE is missing or empty — see docs/RELEASE-DOCS.md"
            exit 1
          fi
          echo "::notice::release note $NOTE present"

      - name: Publish scte35-splice
        run: |
          if out=$(cargo publish -p scte35-splice --locked 2>&1); then
            echo "$out"; echo "::notice::published scte35-splice"
          elif echo "$out" | grep -qiE "already (been )?uploaded|already exists"; then
            echo "$out"; echo "::notice::scte35-splice already on crates.io at this version — skipping"
          else
            echo "$out"; echo "::error::failed to publish scte35-splice"; exit 1
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      # docs/RELEASE-DOCS.md section 3: a GitHub Release per tag, body = the
      # release note. This was a manual step for the first 191 releases and was
      # missed for 102 tags, so it is automated. Idempotent: an existing
      # release is left untouched, so re-running after a partial failure is
      # safe.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${GITHUB_REF_NAME#scte35-splice-v}"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::notice::GitHub Release $GITHUB_REF_NAME already exists — leaving it alone"
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "scte35-splice $V" \
              --notes-file "docs/release-notes/scte35-splice-$V.md"
            echo "::notice::created GitHub Release $GITHUB_REF_NAME"
          fi
