name: Release broadcast-client

# Publishes the broadcast-client crate to crates.io on a `broadcast-client-v*` tag.
# broadcast-client is versioned and released INDEPENDENTLY (standalone integration
# crate with its own cadence). CI is the only source of published artifacts —
# never `cargo publish` from a workstation. Requires the CARGO_REGISTRY_TOKEN
# secret.
#
# DEPENDENCY ORDER: broadcast-client depends on broadcast-common, broadcast-auth,
# transmux, dvb-si, mpeg-ts, buffering-runtime, tshttp-runtime, hls-runtime,
# broadcast-hls and rtsp-runtime; all must be live at the versions in its
# manifest first. It is the last crate in its lane.

on:
  push:
    tags: ["broadcast-client-v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: publish broadcast-client to crates.io
    runs-on: ubuntu-latest
    # crates.io publish is gated: pauses for manual approval by a
    # required reviewer before any cargo publish can run. See the
    # 'crates-io' environment (repo Settings -> Environments).
    environment: crates-io
    # `contents: write` is needed to create the GitHub Release below, and is
    # the only elevated permission this job holds — `cargo publish`
    # authenticates with CARGO_REGISTRY_TOKEN, not the GitHub token.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Private fixtures (real-capture tests)
        uses: ./.github/actions/private-fixtures
        with:
          deploy-key: ${{ secrets.PRIVATE_FIXTURES_DEPLOY_KEY }}
          skip: ${{ vars.SKIP_PRIVATE_FIXTURES }}
      - uses: Swatinem/rust-cache@v2

      - name: Gate — broadcast-client tests (all features)
        run: cargo test -p broadcast-client --all-features --locked

      - name: Gate — broadcast-client clippy
        run: cargo clippy -p broadcast-client --all-features --all-targets --locked -- -D warnings

      - name: Gate — broadcast-client no-default-features lib build
        run: cargo build -p broadcast-client --no-default-features --locked

      - name: Gate — broadcast-client examples build
        run: cargo build -p broadcast-client --all-features --examples --locked

      - name: Gate — tag matches broadcast-client version
        run: |
          TAG="${GITHUB_REF_NAME#broadcast-client-v}"
          V=$(cargo metadata --no-deps --format-version 1 --locked \
              | python3 -c "import json,sys; print({p['name']: p['version'] for p in json.load(sys.stdin)['packages']}['broadcast-client'])")
          if [ "$V" != "$TAG" ]; then
            echo "::error::broadcast-client is $V but tag is $TAG"; exit 1
          fi

      # docs/RELEASE-DOCS.md requires a release note per tag, and this workflow
      # uses it as the GitHub Release body — so a missing one is caught HERE,
      # before anything reaches crates.io, rather than after the version is
      # already immutable.
      - name: Gate — release note exists for this version
        run: |
          NOTE="docs/release-notes/broadcast-client-${GITHUB_REF_NAME#broadcast-client-v}.md"
          if [ ! -s "$NOTE" ]; then
            echo "::error::$NOTE is missing or empty — see docs/RELEASE-DOCS.md"
            exit 1
          fi
          echo "::notice::release note $NOTE present"

      - name: Publish broadcast-client
        run: |
          if out=$(cargo publish -p broadcast-client --locked 2>&1); then
            echo "$out"; echo "::notice::published broadcast-client"
          elif echo "$out" | grep -qiE "already (been )?uploaded|already exists"; then
            echo "$out"; echo "::notice::broadcast-client already on crates.io at this version — skipping"
          else
            echo "$out"; echo "::error::failed to publish broadcast-client"; exit 1
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      # docs/RELEASE-DOCS.md section 3: a GitHub Release per tag, body = the
      # release note. This was a manual step for the first 191 releases and was
      # missed for 102 tags, so it is automated. Idempotent: an existing
      # release is left untouched, so re-running after a partial failure is
      # safe.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${GITHUB_REF_NAME#broadcast-client-v}"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::notice::GitHub Release $GITHUB_REF_NAME already exists — leaving it alone"
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "broadcast-client $V" \
              --notes-file "docs/release-notes/broadcast-client-$V.md"
            echo "::notice::created GitHub Release $GITHUB_REF_NAME"
          fi
