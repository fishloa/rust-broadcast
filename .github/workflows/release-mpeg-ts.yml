name: Release mpeg-ts

# Publishes the mpeg-ts crate to crates.io on an `mpeg-ts-v*` tag.
# mpeg-ts is versioned and released INDEPENDENTLY of the lockstep `v*` tag (it is
# a standalone reusable crate with its own cadence), so it has its own publish
# workflow. CI is the only source of published artifacts — never `cargo publish`
# from a workstation. Requires the CARGO_REGISTRY_TOKEN secret.
#
# release (via the `v*` tag) before tagging `mpeg-ts-v*`, or crates.io will reject

on:
  push:
    tags: ["mpeg-ts-v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: publish mpeg-ts to crates.io
    runs-on: ubuntu-latest
    # crates.io publish is gated: pauses for manual approval by a
    # required reviewer before any cargo publish can run. See the
    # 'crates-io' environment (repo Settings -> Environments).
    environment: crates-io
    # `contents: write` is needed to create the GitHub Release below, and is
    # the only elevated permission this job holds — `cargo publish`
    # authenticates with CARGO_REGISTRY_TOKEN, not the GitHub token.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2

      - name: Gate — mpeg-ts tests
        run: cargo test -p mpeg-ts --all-features --locked

      - name: Gate — mpeg-ts clippy
        run: cargo clippy -p mpeg-ts --all-features --all-targets --locked -- -D warnings

      - name: Gate — mpeg-ts no_std build
        run: cargo build -p mpeg-ts --no-default-features --target thumbv7em-none-eabi --locked

      - name: Gate — mpeg-ts examples build
        run: cargo build -p mpeg-ts --all-features --examples --locked

      - name: Gate — tag matches mpeg-ts version
        run: |
          TAG="${GITHUB_REF_NAME#mpeg-ts-v}"
          V=$(cargo metadata --no-deps --format-version 1 --locked \
              | python3 -c "import json,sys; print({p['name']: p['version'] for p in json.load(sys.stdin)['packages']}['mpeg-ts'])")
          if [ "$V" != "$TAG" ]; then
            echo "::error::mpeg-ts is $V but tag is $TAG"; exit 1
          fi

      # the lockstep `v*` release). Idempotent: an "already uploaded" error is
      # treated as success so a re-run is safe.
      # docs/RELEASE-DOCS.md requires a release note per tag, and this workflow
      # uses it as the GitHub Release body — so a missing one is caught HERE,
      # before anything reaches crates.io, rather than after the version is
      # already immutable.
      - name: Gate — release note exists for this version
        run: |
          NOTE="docs/release-notes/mpeg-ts-${GITHUB_REF_NAME#mpeg-ts-v}.md"
          if [ ! -s "$NOTE" ]; then
            echo "::error::$NOTE is missing or empty — see docs/RELEASE-DOCS.md"
            exit 1
          fi
          echo "::notice::release note $NOTE present"

      - name: Publish mpeg-ts
        run: |
          if out=$(cargo publish -p mpeg-ts --locked 2>&1); then
            echo "$out"; echo "::notice::published mpeg-ts"
          elif echo "$out" | grep -qiE "already (been )?uploaded|already exists"; then
            echo "$out"; echo "::notice::mpeg-ts already on crates.io at this version — skipping"
          else
            echo "$out"; echo "::error::failed to publish mpeg-ts"; exit 1
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      # docs/RELEASE-DOCS.md section 3: a GitHub Release per tag, body = the
      # release note. This was a manual step for the first 191 releases and was
      # missed for 102 tags, so it is automated. Idempotent: an existing
      # release is left untouched, so re-running after a partial failure is
      # safe.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${GITHUB_REF_NAME#mpeg-ts-v}"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::notice::GitHub Release $GITHUB_REF_NAME already exists — leaving it alone"
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "mpeg-ts $V" \
              --notes-file "docs/release-notes/mpeg-ts-$V.md"
            echo "::notice::created GitHub Release $GITHUB_REF_NAME"
          fi
