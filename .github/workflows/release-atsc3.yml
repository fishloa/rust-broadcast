name: Release atsc3

# Publishes the atsc3 crate to crates.io on a `atsc3-v*` tag. atsc3 is
# versioned and released INDEPENDENTLY (standalone reusable crate with its
# own cadence). CI is the only source of published artifacts — never
# `cargo publish` from a workstation. Requires the CARGO_REGISTRY_TOKEN
# secret.
#
# ⚠ DO NOT TAG YET. This lane exists so the crate HAS a release lane (per
# docs/RELEASE-AUDIT.md §2 — nothing can be tagged until every crate has
# one), but atsc3 is under an explicit no-publish-until-mature directive:
# its current scope is the LLS binary envelope + Service List Table (SLT)
# parser only — the rest of A/331 signalling (SLS, S-TSID, USBD, MPD-in-ROUTE)
# is not yet implemented, and `atsc3-route` (the binary ROUTE delivery layer)
# was only just split out as its own sibling crate. Do not push an
# `atsc3-v*` tag until that directive is explicitly lifted.
#
# DEPENDENCY ORDER (once mature): atsc3 depends only on broadcast-common
# (lockstep, already live) plus the external roxmltree/flate2 crates. It is
# a sibling of atsc3-route (not a dependency of it, nor a dependent) — the
# two publish independently of each other.

on:
  push:
    tags: ["atsc3-v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: publish atsc3 to crates.io
    runs-on: ubuntu-latest
    # crates.io publish is gated: pauses for manual approval by a
    # required reviewer before any cargo publish can run. See the
    # 'crates-io' environment (repo Settings -> Environments). This is the
    # backstop if the no-publish-until-mature directive above is missed —
    # the required reviewer should reject approval until it is lifted.
    environment: crates-io
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2

      - name: Gate — atsc3 tests (all features)
        run: cargo test -p atsc3 --all-features --locked

      - name: Gate — atsc3 clippy
        run: cargo clippy -p atsc3 --all-features --all-targets --locked -- -D warnings

      - name: Gate — atsc3 no_std build
        run: cargo build -p atsc3 --no-default-features --target thumbv7em-none-eabi --locked

      - name: Gate — atsc3 examples build
        run: cargo build -p atsc3 --all-features --examples --locked

      - name: Gate — tag matches atsc3 version
        run: |
          TAG="${GITHUB_REF_NAME#atsc3-v}"
          V=$(cargo metadata --no-deps --format-version 1 --locked \
              | python3 -c "import json,sys; print({p['name']: p['version'] for p in json.load(sys.stdin)['packages']}['atsc3'])")
          if [ "$V" != "$TAG" ]; then
            echo "::error::atsc3 is $V but tag is $TAG"; exit 1
          fi

      # Idempotent: an "already uploaded" error is treated as success.
      - name: Publish atsc3
        run: |
          if out=$(cargo publish -p atsc3 --locked 2>&1); then
            echo "$out"; echo "::notice::published atsc3"
          elif echo "$out" | grep -qiE "already (been )?uploaded|already exists"; then
            echo "$out"; echo "::notice::atsc3 already on crates.io at this version — skipping"
          else
            echo "$out"; echo "::error::failed to publish atsc3"; exit 1
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
