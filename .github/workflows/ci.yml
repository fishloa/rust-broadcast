name: CI

on:
  push:
    branches: [main]
  pull_request:

# A force-push / rebase of a PR branch supersedes its in-flight run: cancel the
# stale run instead of burning ~15 runner-minutes on a commit nobody will merge.
# Runs on `main` are never cancelled (every merge keeps its own verdict).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  # multimux's external-oracle tests (e.g. tests/emsg_mp4box.rs needs Bento4
  # `mp4dump`) FAIL when their tool is missing unless this is set, so a dev
  # machine can't silently skip them. The Ubuntu runners don't ship Bento4:
  # skip those oracles here explicitly (they print SKIP); run them locally.
  MULTIMUX_ALLOW_ORACLE_SKIP: "1"

# The toolchain is pinned once in rust-toolchain.toml (channel = the workspace
# MSRV, 1.95.0, plus the clippy/rustfmt components and the bare-metal target).
# GitHub runners ship rustup preinstalled, so every `cargo` call below picks it
# up automatically — no job pins a toolchain itself. The only exceptions are the
# nightly fuzz build and the non-blocking canary, which deliberately override the
# file with `cargo +nightly` / `cargo +<CANARY_RUST>`. See issue #574.

jobs:
  # Markdown-only changes cannot affect any Rust job, so they skip the heavy
  # ones. Skipped jobs (job-level `if`, not workflow `paths-ignore`) still
  # report as skipped, which satisfies a required status check; a workflow-level
  # filter would leave it pending forever. `lint` and `docs` always run (the
  # doc-link, README-snippet and crate-index gates live in `lint`). Pushes to
  # main always run everything. The classifier is tools/ci_changes.py.
  changes:
    name: changed paths
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.classify.outputs.rust }}
    steps:
      - uses: actions/checkout@v5
      - name: Classify the change set
        id: classify
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "pull_request" ]; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git diff --name-only "$BASE_SHA" HEAD | python3 tools/ci_changes.py >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  # The ONE place a CI run clones the private fixtures repo (~374 MB). GitHub
  # jobs get separate runners, so a per-job checkout paid that clone up to
  # three times a run; this job does it once (or, when the pinned commit is
  # already cached, not at all) and every consuming job restores it.
  # No secrets on a fork PR: the action then reports enabled=false, this job
  # still succeeds, and the consumers skip the private tests loudly.
  private-fixtures:
    name: private fixtures (checkout once)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Prepare the pinned private fixtures
        uses: ./.github/actions/private-fixtures
        with:
          mode: prepare
          deploy-key: ${{ secrets.PRIVATE_FIXTURES_DEPLOY_KEY }}
          skip: ${{ vars.SKIP_PRIVATE_FIXTURES }}

  test:
    name: test (MSRV 1.95.0)
    runs-on: ubuntu-latest
    needs: [private-fixtures, changes]
    if: needs.changes.outputs.rust == 'true'
    steps:
      - uses: actions/checkout@v5
      # Restores the private fixtures the `private-fixtures` job prepared (a
      # cache miss fails this job — never a silent skip); without a deploy key
      # on a fork PR it sets SKIP_PRIVATE_FIXTURES=1 so the tests skip loudly.
      - name: Private fixtures (real-capture tests)
        uses: ./.github/actions/private-fixtures
        with:
          mode: use
          deploy-key: ${{ secrets.PRIVATE_FIXTURES_DEPLOY_KEY }}
          skip: ${{ vars.SKIP_PRIVATE_FIXTURES }}
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      # --locked: the committed Cargo.lock pins MSRV-compatible dependency
      # versions (some newer transitive crates require edition2024 / Cargo 1.85).
      # dvb-stream is excluded from the core build/test: it depends on tokio and
      # is feature-forcing; it has its own job below. dvb-tools and
      # dvb-conformance are excluded because they are feature-forcing leaf crates
      # that would mask regressions in the library crates' bare
      # --no-default-features build.
      - name: Build (all features)
        run: cargo build --workspace --exclude dvb-tools --exclude dvb-conformance --exclude dvb-stream --all-features --locked
      # (Examples build + run live in the parallel `examples` job below.)
      # nextest enforces the per-test terminate-after timeout (.config/nextest.toml
      # [profile.ci]) so a hung/runaway test FAILS instead of blocking CI; it does
      # not run doctests, which get their own bounded lane below.
      - name: Test (all features)
        run: cargo nextest run --workspace --exclude dvb-tools --exclude dvb-conformance --exclude dvb-stream --all-features --locked --profile ci --cargo-profile ci
      - name: Doctests (all features)
        timeout-minutes: 15
        run: cargo test --workspace --exclude dvb-tools --exclude dvb-conformance --exclude dvb-stream --all-features --locked --profile ci --doc

  # The bare / std-only feature lanes run as their own job in PARALLEL with the
  # all-features `test` job above (they used to be its serial tail, which made
  # one job the ~15-minute long pole of every CI run).
  test-no-default:
    name: test (MSRV 1.95.0, no default features)
    runs-on: ubuntu-latest
    needs: [private-fixtures, changes]
    if: needs.changes.outputs.rust == 'true'
    steps:
      - uses: actions/checkout@v5
      # Restores the private fixtures the `private-fixtures` job prepared (a
      # cache miss fails this job — never a silent skip); without a deploy key
      # on a fork PR it sets SKIP_PRIVATE_FIXTURES=1 so the tests skip loudly.
      - name: Private fixtures (real-capture tests)
        uses: ./.github/actions/private-fixtures
        with:
          mode: use
          deploy-key: ${{ secrets.PRIVATE_FIXTURES_DEPLOY_KEY }}
          skip: ${{ vars.SKIP_PRIVATE_FIXTURES }}
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      # Exclude the feature-forcing leaf crates here. dvb-tools (binary) needs
      # dvb-si's ts/serde/chrono + dvb-t2mi's ts; dvb-conformance needs dvb-si's
      # ts/serde; dvb-stream always depends on tokio. Including any of them would
      # — via workspace feature unification — force those features on and mask a
      # regression in the library crates' bare --no-default-features build.
      - name: Build (no default features)
        run: cargo build --workspace --exclude dvb-tools --exclude dvb-conformance --exclude dvb-stream --no-default-features --locked
      # Every member's tests must COMPILE bare, one `cargo check -p <crate>`
      # per crate so workspace feature unification cannot hide a break (it hid
      # rtmp-runtime's, and the excluded leaf crates above are covered here
      # too). Bare behaviour is no longer re-run workspace-wide: a bare lane
      # only ever removes tests (everything feature-gated compiles out), so the
      # all-features `test` job already ran every one of them. What a bare run
      # can still show is the code that differs when a feature is off, below.
      - name: Tests compile without default features (per crate)
        run: tools/check-bare-features.sh
      # The only runtime alternative arms behind `cfg(not(feature = "serde"))`:
      # the TableObject / DescriptorObject / PayloadObject blanket impls in the
      # dvb-si and dvb-t2mi registries (different trait bounds). One invocation
      # per crate keeps `serde` off (a combined run would unify it back on).
      # `--features std`: libtest needs std, the OTHER optional features stay off.
      - name: Test bare-only code (serde-off registries)
        run: |
          cargo nextest run -p dvb-si --no-default-features --features std --locked --profile ci -E 'test(/registry/) | binary(descriptor_loop)'
          cargo nextest run -p dvb-t2mi --no-default-features --features std --locked --profile ci -E 'test(/registry/)'
      # Doctests whose code blocks are feature-gated (`# #[cfg(feature = ...)]`
      # in cc-data, dvb-t2mi, st291); one invocation each, again to avoid
      # unification. dvb-si is deliberately absent: its doctests need `ts`.
      - name: Doctests (bare, feature-gated crates)
        timeout-minutes: 15
        run: |
          for c in cc-data dvb-t2mi st291; do
            cargo test -p "$c" --no-default-features --features std --locked --doc
          done

  examples:
    name: examples (MSRV 1.95.0)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      # Examples are a published docs surface (they show on docs.rs and double as
      # compile-checked usage docs). Build the whole workspace's examples — no
      # excludes, so dvb-stream/dvb-conformance examples are covered too.
      - name: Build examples (all features)
        run: cargo build --workspace --examples --all-features --locked
      # Building an example only proves it compiles. Issue #947: 12 examples
      # pointed at fixture paths that stopped existing after the fixtures
      # migration and silently exited 0 via a "fixture not available" fallback,
      # so they had never actually run — and one carried a stale assertion that
      # had been failing invisibly. Every argument-free example must now RUN.
      - name: Run examples (all features)
        run: ./tools/run-examples.sh --all-features --locked

  # The one real-wire DASH check: a broadcast-client Session plays 30 s of live
  # DASH from DASH-IF livesim2 over loopback HTTP (docs/dash-runtime/DESIGN.md
  # Q9). livesim2 is BSD 3-clause licensed (Copyright (c) 2023, Dash Industry
  # Forum, LICENSE.md in the module); it is built from source at the pinned tag
  # and never redistributed. REQUIRE_LIVESIM2=1 makes a missing or wrong-version
  # server a hard failure here; the same test skips loudly on a machine without
  # it, exactly like the private-fixtures rule.
  dash-e2e:
    name: dash e2e (livesim2 v1.15.2)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    env:
      LIVESIM2_VERSION: v1.15.2
      REQUIRE_LIVESIM2: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - uses: Swatinem/rust-cache@v2
      - name: Install livesim2 (pinned)
        run: |
          set -euo pipefail
          go install "github.com/Dash-Industry-Forum/livesim2/cmd/livesim2@${LIVESIM2_VERSION}"
          echo "LIVESIM2_BIN=$(go env GOPATH)/bin/livesim2" >> "$GITHUB_ENV"
          DIR=$(go mod download -json "github.com/Dash-Industry-Forum/livesim2@${LIVESIM2_VERSION}" | jq -r .Dir)
          echo "LIVESIM2_VODROOT=${DIR}/cmd/livesim2/app/testdata/assets" >> "$GITHUB_ENV"
      - name: Play 30 s of live DASH from livesim2
        timeout-minutes: 15
        run: cargo test -p broadcast-client --all-features --locked --test e2e_livesim2 -- --nocapture

  # The independent RTSP wire oracle for broadcast-client: a Session plays
  # `fixtures/ts/h264_aac.ts` published by ffmpeg through mediamtx over RTSP/TCP
  # on loopback. mediamtx is MIT licensed (Copyright (c) 2019 aler9), fetched
  # as the pinned release tarball with its published sha256 and never
  # redistributed. REQUIRE_MEDIAMTX_E2E=1 makes a missing tool a hard failure
  # here; the same test skips loudly on a machine without them.
  rtsp-e2e:
    name: rtsp e2e (mediamtx v1.21.1)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    env:
      MEDIAMTX_VERSION: v1.21.1
      MEDIAMTX_SHA256: 653abc672a3e693f8d3b2717752492fdcfb8072291ec108d03d3dd857411b0ee
      REQUIRE_MEDIAMTX_E2E: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install mediamtx (pinned, checksum-verified)
        run: |
          set -euo pipefail
          ARCHIVE="mediamtx_${MEDIAMTX_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "${RUNNER_TEMP}/${ARCHIVE}" "https://github.com/bluenviron/mediamtx/releases/download/${MEDIAMTX_VERSION}/${ARCHIVE}"
          echo "${MEDIAMTX_SHA256}  ${RUNNER_TEMP}/${ARCHIVE}" | sha256sum --check
          mkdir -p "${RUNNER_TEMP}/mediamtx-bin"
          tar -xzf "${RUNNER_TEMP}/${ARCHIVE}" -C "${RUNNER_TEMP}/mediamtx-bin" mediamtx
          echo "${RUNNER_TEMP}/mediamtx-bin" >> "$GITHUB_PATH"
      - name: Play a real mediamtx RTSP stream
        timeout-minutes: 15
        run: cargo test -p broadcast-client --all-features --locked --test e2e_mediamtx_rtsp -- --nocapture

  lint:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      # Deliberate column alignment (TableId / DescriptorTag discriminants)
      # is protected by #[rustfmt::skip]; everything else is rustfmt-clean.
      - name: rustfmt
        run: cargo fmt --all --check
      # docs/CRATES.md and the README crate table are generated from the
      # manifests, the no-std list below and docs/crates-index.toml. Fails if
      # they are stale or a workspace member is not in crates-index.toml.
      # Pure Python (tomllib, 3.11+); no cargo, no network.
      - name: crate index is current
        run: python3 tools/gen-crate-index.py --check
      # Spec transcriptions live in the private repo; docs/specs/PRIVATE-MAP.md
      # decodes the old public paths. Fails on a Markdown link into a moved path
      # or a citation that is neither on disk nor in the map. Pure Python.
      - name: private spec map is consistent
        run: python3 tools/check-private-map.py
      # Dangling documentation references (relative links, backticked repo paths,
      # and docs/... citations) must resolve or be decoded by PRIVATE-MAP.md.
      - name: doc links are consistent
        run: python3 tools/check-doc-links.py
      # README dependency snippets (`crate = "x.y"`) must name the epoch the
      # workspace crate is at; they went stale every wave before this gate.
      # Pure Python, no cargo, no network.
      - name: README dependency snippets are current
        run: python3 tools/readme_snippets.py --check
      - name: clippy
        run: cargo clippy --workspace --all-features --all-targets --locked -- -D warnings

  docs:
    name: doc build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      # Docs are warning-clean: bit-range notation is backticked (`[7:4]`)
      # so it can't be mistaken for intra-doc links. Keep it that way.
      - name: cargo doc
        run: cargo doc --workspace --all-features --no-deps --locked
        env:
          RUSTDOCFLAGS: "-D warnings"

  # True no_std proof: build each library crate for a bare-metal target with
  # its default `std` feature off. This is per-crate (no workspace feature
  # unification) and links without the std runtime — the only check that
  # genuinely enforces #![no_std] (the `--no-default-features` host lane above
  # does not, since std is present on the host). The bare-metal target is
  # provided by rust-toolchain.toml. dvb-tools/dvb-stream are std-only
  # applications and are intentionally not built here.
  no-std:
    name: no_std (thumbv7em-none-eabi)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      # Every crate that claims `no_std` support must be listed here, or the
      # claim is unverified: `cargo build --workspace --no-default-features`
      # does NOT catch a per-crate break, because feature unification across
      # the workspace can pull `std` in for a crate that would fail alone
      # (that masked a std-only `f64::round()` once already).
      #
      # `broadcast-common`, `mpeg-ts`, `transmux`, `media-plane`,
      # `timed-metadata`, `hls-runtime`, `srt-runtime`, `media-doctor`,
      # and `ttml-subtitle` were all missing from this list while advertising
      # `no_std` on crates.io — including `broadcast-common`, which everything
      # else depends on. They cross-build clean today; they are listed now
      # so they cannot regress silently. `broadcast-hls` (issue #878) is a new
      # leaf crate added directly to this list at its own creation.
      #
      # `webrtc-runtime` and `ts-fix` joined at the 1.95.0 release audit. Both
      # advertised `no_std` (crate-root `cfg_attr`, README) while being
      # impossible to build that way: webrtc-runtime took `broadcast-common`
      # and `thiserror` with default features and declared two std-only deps it
      # never used, and ts-fix took `clap` unconditionally for its binary.
      # Fixing those manifests is what made the existing claims true; they are
      # listed here so neither can quietly become a lie again.
      #
      # Deliberately NOT here (they genuinely require `std`, verified):
      # `dvb-ci-runtime`, `multimux`, `multimux-cli`, `dvb-tools`,
      # `dvb-stream`.
      # `webrtc-runtime` left the list at W1 (SP2.2): its WHIP/WHEP core is `std` (`http`/`headers`).
      - name: Build each library crate for bare-metal (no_std)
        run: |
          for c in broadcast-common dvb-bbframe scte35-splice dvb-t2mi dvb-si dvb-conformance mpeg-pes dvb-subtitle mpeg-ps scte104 cc-data st291 ule dvb-ci dvb-simulcrypt mp4-emsg dvb-vbi rmt-flute rtp-packet rtcp-packet st12-1 st337 rdd29 st377-1 mpeg-ts container-probe broadcast-hls transmux media-plane timed-metadata hls-runtime srt-runtime media-doctor ttml-subtitle atsc3-route caption-convert dvb-csa broadcast-loudness atsc3 dvb-mabr st2022 rist-runtime ssai-runtime playout-runtime compliance-probe ts-fix buffering-runtime tshttp-runtime; do
            echo "::group::$c (no_std)"
            cargo build -p "$c" --no-default-features --target thumbv7em-none-eabi --locked
            echo "::endgroup::"
          done
      # Non-`std` optional features that must also stay no_std-clean. The loop
      # above builds with NO features, so a break behind one of these is
      # invisible to it (issue #1181: `transmux --features cenc` failed to
      # build here on missing alloc imports while the plain build passed).
      # Every no_std crate's `serde` feature is built here too (issue #1183): the
      # `serde` dependency is `default-features = false, features = ["derive",
      # "alloc"]` and each crate's own `std` feature forwards `serde?/std`.
      # Deliberately NOT here (genuinely std-only, they pull std-only deps):
      # `media-doctor` `metrics`/`net`/`cli`, `ts-fix` `cli`, `transmux` `cli`,
      # `hls-runtime` `tokio`, `srt-runtime`/`rtsp-runtime`/`rtmp-runtime`
      # tokio adapters, and the XML paths (`quick-xml`, behind each crate's `std`).
      - name: Build no_std-capable optional features for bare-metal
        run: |
          for cf in transmux:cenc transmux:sample-aes dvb-si:chrono dvb-si:ts dvb-si:yoke dvb-bbframe:yoke dvb-t2mi:chrono dvb-t2mi:yoke cc-data:decode st291:ts st291:rtp rtp-packet:rfc8285 rtp-packet:av3a timed-metadata:chrono timed-metadata:cc-data timed-metadata:teletext caption-convert:cc-data caption-convert:teletext dvb-csa:bitsliced srt-runtime:crypto dvb-si:serde,chrono,ts dvb-t2mi:serde,chrono,ts timed-metadata:serde,chrono transmux:serde,cenc,sample-aes caption-convert:serde,cc-data,teletext st291:serde,ts,rtp broadcast-common:serde,chrono broadcast-common:serde dvb-bbframe:serde scte35-splice:serde dvb-t2mi:serde dvb-si:serde dvb-conformance:serde mpeg-pes:serde dvb-subtitle:serde mpeg-ps:serde scte104:serde cc-data:serde st291:serde ule:serde dvb-ci:serde dvb-simulcrypt:serde mp4-emsg:serde dvb-vbi:serde rmt-flute:serde rtp-packet:serde rtcp-packet:serde st12-1:serde st337:serde rdd29:serde st377-1:serde mpeg-ts:serde broadcast-hls:serde transmux:serde timed-metadata:serde hls-runtime:serde srt-runtime:serde media-doctor:serde ttml-subtitle:serde atsc3-route:serde caption-convert:serde atsc3:serde st2022:serde ssai-runtime:serde playout-runtime:serde buffering-runtime:serde tshttp-runtime:serde; do
            c="${cf%%:*}"
            f="${cf##*:}"
            echo "::group::$c --features $f (no_std)"
            cargo build -p "$c" --no-default-features --features "$f" --target thumbv7em-none-eabi --locked
            echo "::endgroup::"
          done

  # Fuzz targets are not part of the workspace (own sub-workspace under fuzz/)
  # and so are never built by the jobs above — they rot silently when a crate's
  # parse API changes. Every shard builds EVERY libfuzzer target on nightly, so
  # a broken target fails CI whichever shard happens to own it; each shard then
  # smoke-runs only its own slice of the targets. `cargo +nightly` overrides the
  # pinned toolchain from rust-toolchain.toml. RUSTFLAGS="-D warnings" is unset
  # here: cargo-fuzz injects sanitizer/coverage codegen flags and we only need a
  # compile smoke, not a warning gate (the library warning gate is the lint job).
  #
  # Building a fuzz target proves it COMPILES, not that the code it drives
  # survives hostile input. container-probe shipped a panic reachable from a
  # 12-byte slice, in a crate whose fuzz target was written specifically to
  # catch that class -- because the target had never actually been executed.
  # So PRs smoke-run each target for a short budget (tools/fuzz-smoke.sh);
  # the full 60 s per target runs nightly (.github/workflows/nightly.yml).
  fuzz:
    name: fuzz (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    env:
      RUSTFLAGS: ""
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - name: Build all fuzz targets
        working-directory: fuzz
        # No --locked: fuzz/Cargo.lock is gitignored (the harness is not a
        # published artifact), so CI resolves fresh against the current crates.
        # Pin the gnu target: the taiki-e cargo-fuzz binary is musl-static, so
        # its host triple leaks as the default --target (musl), whose std isn't
        # installed and whose static libc is incompatible with the sanitizer.
        run: cargo +nightly fuzz build --target x86_64-unknown-linux-gnu
      # Seeds are generated, never committed: fuzz/corpus/ is gitignored, so the
      # generator is what gets reviewed. Without seeds, libFuzzer starting from
      # empty essentially never synthesises a valid MXF key or EBML magic, so a
      # format-detection target would smoke-test its "nothing matched" exit and
      # not its probers. Best-effort: a clone without the fixtures skips them.
      - name: Seed fuzz corpora from tracked fixtures
        run: python3 fuzz/seed-corpus.py
      - name: Smoke-run this shard's fuzz targets (10 s each)
        run: tools/fuzz-smoke.sh ${{ matrix.shard }} 4 10

  # dvb-stream is versioned and released independently from the lockstep
  # v-tag publish and is feature-forcing (tokio), so it is excluded from the
  # core `test` job's workspace build and gets its own here — still on the
  # pinned MSRV toolchain from rust-toolchain.toml.

  dvb-stream:
    name: dvb-stream
    runs-on: ubuntu-latest
    needs: [private-fixtures, changes]
    if: needs.changes.outputs.rust == 'true'
    steps:
      - uses: actions/checkout@v5
      # Restores the private fixtures the `private-fixtures` job prepared (a
      # cache miss fails this job — never a silent skip); without a deploy key
      # on a fork PR it sets SKIP_PRIVATE_FIXTURES=1 so the tests skip loudly.
      - name: Private fixtures (real-capture tests)
        uses: ./.github/actions/private-fixtures
        with:
          mode: use
          deploy-key: ${{ secrets.PRIVATE_FIXTURES_DEPLOY_KEY }}
          skip: ${{ vars.SKIP_PRIVATE_FIXTURES }}
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - name: Build
        run: cargo build -p dvb-stream --all-features --locked
      - name: Test
        run: cargo nextest run -p dvb-stream --all-features --locked --profile ci --cargo-profile ci
      - name: Doctests
        timeout-minutes: 10
        run: cargo test -p dvb-stream --all-features --locked --doc
      # The core no-default-features lane excludes dvb-stream, so a test that
      # only compiles with the default `udp` feature (e.g. a cfg that no
      # longer covers an import) would otherwise go unseen.
      - name: Tests compile without default features
        run: cargo test -p dvb-stream --no-default-features --no-run --locked

  # Non-blocking early-warning canary: clippy on a stable NEWER than the MSRV,
  # so a new lint surfaces here as a soft failure instead of red-lighting a real
  # PR the day upstream stable moves. Counterweight to pinning the gate jobs at
  # the MSRV; `cargo +$CANARY_RUST` overrides rust-toolchain.toml.
  #
  # PINNED ON PURPOSE. This used to track floating `stable`, which made the job
  # unreproducible and unownable: it could go red overnight with no code change,
  # and nobody could reproduce it locally unless their toolchain happened to
  # match the runner's. It was red for months and everyone learned to ignore it
  # (see #770, and #785 for the same rot in the Pages workflow).
  #
  # To reproduce EXACTLY what this job runs:
  #   rustup toolchain install 1.97.1
  #   cargo +1.97.1 clippy --workspace --all-features --all-targets --locked -- -D warnings
  #
  # Bumping the pin is a deliberate PR of its own: raise CANARY_RUST, fix
  # whatever new lints appear, and land the two together. That keeps "upstream
  # added a lint" as reviewable work rather than as ambient breakage. Bumping
  # the MSRV itself is separate — rust-toolchain.toml + Cargo.toml, issue #574.
  clippy-canary:
    name: clippy (pinned stable, non-blocking)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    continue-on-error: true
    env:
      CANARY_RUST: "1.97.1"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: clippy on pinned stable ${{ env.CANARY_RUST }}
        run: cargo +$CANARY_RUST clippy --workspace --all-features --all-targets --locked -- -D warnings

  # Player-validated golden gate (issue #569): every other transmux test
  # proves round-trip symmetry against our own parsers only. This job packages
  # a real fixture through transmux's CMAF/progressive-MP4/TS-HLS/DASH outputs
  # (`transmux/tests/golden_gate.rs`) and hands them to an INDEPENDENT decoder
  # (`ffprobe`) to confirm they are well-formed and report the expected
  # codec/dimensions/track-count. Non-blocking to start (continue-on-error,
  # like clippy-canary above) because external-tool availability/behaviour
  # varies across runner images; promote to required once stable. Uses the
  # pinned toolchain from rust-toolchain.toml — no dtolnay step needed, this
  # only needs `cargo test`, not a different channel.
  #
  # Issue #717's closing acceptance item extends this to the CLIENT side:
  # `multimux/tests/golden_gate.rs` stands up a real LL-HLS origin over
  # loopback, drives the real `TokioClient` (the epic's reference client)
  # against it, and hands the client's OWN reconstruction (not the origin's
  # output) to the same `ffprobe` oracle — closing the origin-only gap the
  # transmux job above leaves open.
  #
  # Issue #870 adds a SECOND independent oracle alongside `ffprobe`:
  # `media-doctor/tests/mediastreamvalidator_oracle.rs` renders every HLS
  # playlist shape the origin can produce and validates it with Apple's own
  # `mediastreamvalidator` — catching a shared our-renderer/our-checker
  # misreading of the HLS spec that `ffprobe` and `media-doctor`'s own
  # `check_hls_playlist` cannot (both `check_hls_playlist` and our renderer
  # encode the same understanding; `mediastreamvalidator` is independent of
  # both). The tool is macOS-only — this `ubuntu-latest` runner never has it
  # on `PATH`, so every test in that file skips itself loudly (an `eprintln!`
  # naming the reason) and passes trivially here; this step exists only to
  # keep the file itself building/passing on Linux. The genuine check needs
  # macOS (not available on this runner) — run it there with Apple's Additional Tools for Xcode
  # installed (see the command in `CLAUDE.md`).
  golden-gate:
    name: golden gate (ffprobe + mediastreamvalidator, non-blocking)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - name: Install ffmpeg (provides ffprobe)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Golden gate (transmux, all features)
        run: cargo test -p transmux --test golden_gate --all-features --locked
      - name: Golden gate (LL-HLS reference client, all features)
        run: cargo test -p multimux --test golden_gate --all-features --locked
      - name: HLS conformance oracle (media-doctor, all features)
        run: cargo test -p media-doctor --test mediastreamvalidator_oracle --all-features --locked

  # Apple-platform cross-check (issue #1162 R6): transmux (std, default
  # features) must keep compiling for tvOS / iOS / macOS so Apple-device
  # consumers are not broken silently. `cargo check` only — nothing is linked,
  # so no Apple SDK is needed and a Linux runner suffices (transmux's tree has
  # no C build scripts: no cc/ring/cmake). rust-std for all five targets is
  # available on the pinned 1.95.0 toolchain via rustup (verified locally); the
  # tvOS targets need no nightly / build-std.
  apple-targets:
    name: apple targets (${{ matrix.target }})
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-apple-tvos
          - aarch64-apple-tvos-sim
          - aarch64-apple-ios
          - aarch64-apple-ios-sim
          - aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - name: Add target
        run: rustup target add ${{ matrix.target }}
      - name: Check transmux (std, default features)
        run: cargo check -p transmux --target ${{ matrix.target }} --locked
      - name: Check the client stack (sans-IO crates, no tokio/reqwest; issue #1454)
        run: |
          for c in broadcast-auth broadcast-client broadcast-common broadcast-hls buffering-runtime cc-data container-probe dash-runtime dvb-si dvb-vbi hls-runtime media-plane mp4-emsg mpeg-pes mpeg-ps mpeg-ts rtcp-packet rtp-packet rtsp-runtime scte35-splice timed-metadata tshttp-runtime; do
            cargo check -p "$c" --target ${{ matrix.target }} --locked
          done
      - name: Forbid tokio/reqwest/mio/rustls in broadcast-client normal deps (issue #1454 R14)
        run: |
          if cargo tree -p broadcast-client -e normal --target ${{ matrix.target }} --locked | grep -E '(tokio|reqwest|mio|rustls) v[0-9]'; then
            echo "forbidden normal dependency found in broadcast-client (issue #1454 R14)" >&2
            exit 1
          fi
