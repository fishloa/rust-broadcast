name: GitHub Pages — WASM demo

# Build and deploy the dvb-si browser demo.
#
# The BUILD runs on pull requests as well as pushes, deliberately. This
# workflow used to be push-only, so it could not fail until after a merge: a
# stale `mpeg-ts = "0.2"` pin in demo/Cargo.toml slipped through, broke
# `cargo metadata`, and left this red on main for six consecutive merges
# without blocking anything — which trains everyone to ignore a red mark
# (issue #785; the same rot hit the clippy canary, #770).
#
# The DEPLOY still runs only on push to main. That split is the point: a broken
# demo build is our bug and should block a PR, whereas a GitHub Pages
# deployment hiccup is not and should not.
on:
  push:
    branches: [main]

  pull_request:

  # Allow manual re-deploy from the Actions tab.
  workflow_dispatch:

# Required for GitHub Pages deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment runs at a time; cancel in-flight runs on new push.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build WASM demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: demo -> demo/target

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build demo (wasm-pack)
        # --out-dir is resolved relative to the crate path (demo/), so `pkg`
        # lands at demo/pkg (NOT demo/demo/pkg, which `demo/pkg` would give).
        run: wasm-pack build demo --target web --out-dir pkg --release

      - name: Assemble site
        run: |
          mkdir -p _site
          cp demo/index.html _site/index.html
          cp demo/style.css  _site/style.css
          cp demo/app.js     _site/app.js
          cp -r demo/pkg     _site/pkg

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    # Main-line pushes only. A pull request builds the demo (so a break blocks
    # the PR) but must not publish it, and would in any case lack the Pages
    # permissions on a fork.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
