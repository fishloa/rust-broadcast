name: Release rtsp-runtime

# Publishes the rtsp-runtime crate to crates.io on a `rtsp-runtime-v*` tag.
# rtsp-runtime is versioned and released INDEPENDENTLY. CI is the only source of
# published artifacts — never `cargo publish` from a workstation. Requires the
# CARGO_REGISTRY_TOKEN secret.
#
# DEPENDENCY ORDER: rtsp-runtime depends on broadcast-auth (plus the external
# rtsp-types / sdp-types / http-auth / tokio / rustls crates). Publish
# broadcast-auth FIRST, or crates.io will reject the publish because a
# required dependency is not yet live. Downstream, hls-runtime and
# multimux depend on rtsp-runtime (>= the referenced 0.3), so this must land
# before those.

on:
  push:
    tags: ["rtsp-runtime-v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: publish rtsp-runtime to crates.io
    runs-on: ubuntu-latest
    # crates.io publish is gated: pauses for manual approval by a
    # required reviewer before any cargo publish can run. See the
    # 'crates-io' environment (repo Settings -> Environments).
    environment: crates-io
    # `contents: write` is needed to create the GitHub Release below, and is
    # the only elevated permission this job holds — `cargo publish`
    # authenticates with CARGO_REGISTRY_TOKEN, not the GitHub token.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2

      - name: Gate — rtsp-runtime tests (all features)
        run: cargo test -p rtsp-runtime --all-features --locked

      - name: Gate — rtsp-runtime clippy
        run: cargo clippy -p rtsp-runtime --all-features --all-targets --locked -- -D warnings

      - name: Gate — rtsp-runtime sans-IO (no-default) lib build
        run: cargo build -p rtsp-runtime --no-default-features --locked

      - name: Gate — tag matches rtsp-runtime version
        run: |
          TAG="${GITHUB_REF_NAME#rtsp-runtime-v}"
          V=$(cargo metadata --no-deps --format-version 1 --locked \
              | python3 -c "import json,sys; print({p['name']: p['version'] for p in json.load(sys.stdin)['packages']}['rtsp-runtime'])")
          if [ "$V" != "$TAG" ]; then
            echo "::error::rtsp-runtime is $V but tag is $TAG"; exit 1
          fi

      # docs/RELEASE-DOCS.md requires a release note per tag, and this workflow
      # uses it as the GitHub Release body — so a missing one is caught HERE,
      # before anything reaches crates.io, rather than after the version is
      # already immutable.
      - name: Gate — release note exists for this version
        run: |
          NOTE="docs/release-notes/rtsp-runtime-${GITHUB_REF_NAME#rtsp-runtime-v}.md"
          if [ ! -s "$NOTE" ]; then
            echo "::error::$NOTE is missing or empty — see docs/RELEASE-DOCS.md"
            exit 1
          fi
          echo "::notice::release note $NOTE present"

      - name: Publish rtsp-runtime
        run: |
          if out=$(cargo publish -p rtsp-runtime --locked 2>&1); then
            echo "$out"; echo "::notice::published rtsp-runtime"
          elif echo "$out" | grep -qiE "already (been )?uploaded|already exists"; then
            echo "$out"; echo "::notice::rtsp-runtime already on crates.io at this version — skipping"
          else
            echo "$out"; echo "::error::failed to publish rtsp-runtime"; exit 1
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      # docs/RELEASE-DOCS.md section 3: a GitHub Release per tag, body = the
      # release note. This was a manual step for the first 191 releases and was
      # missed for 102 tags, so it is automated. Idempotent: an existing
      # release is left untouched, so re-running after a partial failure is
      # safe.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${GITHUB_REF_NAME#rtsp-runtime-v}"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::notice::GitHub Release $GITHUB_REF_NAME already exists — leaving it alone"
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "rtsp-runtime $V" \
              --notes-file "docs/release-notes/rtsp-runtime-$V.md"
            echo "::notice::created GitHub Release $GITHUB_REF_NAME"
          fi
