name: Release tshttp-runtime

# Publishes the tshttp-runtime crate to crates.io on a `tshttp-runtime-v*` tag.
# tshttp-runtime is versioned and released INDEPENDENTLY (standalone integration
# crate with its own cadence). CI is the only source of published artifacts —
# never `cargo publish` from a workstation. Requires the CARGO_REGISTRY_TOKEN
# secret.
#
# DEPENDENCY ORDER: tshttp-runtime depends on broadcast-common and transmux
# (both must be live at the versions in its manifest first). Downstream,
# broadcast-client depends on tshttp-runtime — this must land before that.

on:
  push:
    tags: ["tshttp-runtime-v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: publish tshttp-runtime to crates.io
    runs-on: ubuntu-latest
    # crates.io publish is gated: pauses for manual approval by a
    # required reviewer before any cargo publish can run. See the
    # 'crates-io' environment (repo Settings -> Environments).
    environment: crates-io
    # `contents: write` is needed to create the GitHub Release below, and is
    # the only elevated permission this job holds — `cargo publish`
    # authenticates with CARGO_REGISTRY_TOKEN, not the GitHub token.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Private fixtures (real-capture tests)
        uses: ./.github/actions/private-fixtures
        with:
          deploy-key: ${{ secrets.PRIVATE_FIXTURES_DEPLOY_KEY }}
          skip: ${{ vars.SKIP_PRIVATE_FIXTURES }}
      - uses: Swatinem/rust-cache@v2

      - name: Gate — tshttp-runtime tests (all features)
        run: cargo test -p tshttp-runtime --all-features --locked

      - name: Gate — tshttp-runtime clippy
        run: cargo clippy -p tshttp-runtime --all-features --all-targets --locked -- -D warnings

      - name: Gate — tshttp-runtime no_std (+alloc) lib build
        run: cargo build -p tshttp-runtime --no-default-features --locked

      - name: Gate — tshttp-runtime examples build
        run: cargo build -p tshttp-runtime --all-features --examples --locked

      - name: Gate — tag matches tshttp-runtime version
        run: |
          TAG="${GITHUB_REF_NAME#tshttp-runtime-v}"
          V=$(cargo metadata --no-deps --format-version 1 --locked \
              | python3 -c "import json,sys; print({p['name']: p['version'] for p in json.load(sys.stdin)['packages']}['tshttp-runtime'])")
          if [ "$V" != "$TAG" ]; then
            echo "::error::tshttp-runtime is $V but tag is $TAG"; exit 1
          fi

      # docs/RELEASE-DOCS.md requires a release note per tag, and this workflow
      # uses it as the GitHub Release body — so a missing one is caught HERE,
      # before anything reaches crates.io, rather than after the version is
      # already immutable.
      - name: Gate — release note exists for this version
        run: |
          NOTE="docs/release-notes/tshttp-runtime-${GITHUB_REF_NAME#tshttp-runtime-v}.md"
          if [ ! -s "$NOTE" ]; then
            echo "::error::$NOTE is missing or empty — see docs/RELEASE-DOCS.md"
            exit 1
          fi
          echo "::notice::release note $NOTE present"

      - name: Publish tshttp-runtime
        run: |
          if out=$(cargo publish -p tshttp-runtime --locked 2>&1); then
            echo "$out"; echo "::notice::published tshttp-runtime"
          elif echo "$out" | grep -qiE "already (been )?uploaded|already exists"; then
            echo "$out"; echo "::notice::tshttp-runtime already on crates.io at this version — skipping"
          else
            echo "$out"; echo "::error::failed to publish tshttp-runtime"; exit 1
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      # docs/RELEASE-DOCS.md section 3: a GitHub Release per tag, body = the
      # release note. This was a manual step for the first 191 releases and was
      # missed for 102 tags, so it is automated. Idempotent: an existing
      # release is left untouched, so re-running after a partial failure is
      # safe.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${GITHUB_REF_NAME#tshttp-runtime-v}"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::notice::GitHub Release $GITHUB_REF_NAME already exists — leaving it alone"
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "tshttp-runtime $V" \
              --notes-file "docs/release-notes/tshttp-runtime-$V.md"
            echo "::notice::created GitHub Release $GITHUB_REF_NAME"
          fi
