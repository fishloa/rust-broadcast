name: Release tshttp-runtime

# Publishes the tshttp-runtime crate to crates.io on a `tshttp-runtime-v*` tag.
# tshttp-runtime is versioned and released INDEPENDENTLY (standalone integration
# crate with its own cadence). CI is the only source of published artifacts —
# never `cargo publish` from a workstation. Requires the CARGO_REGISTRY_TOKEN
# secret.
#
# DEPENDENCY ORDER: tshttp-runtime depends on broadcast-common and transmux
# (both must be live at the versions in its manifest first). Downstream,
# broadcast-client depends on tshttp-runtime — this must land before that.

on:
  push:
    tags: ["tshttp-runtime-v*"]

jobs:
  publish:
    permissions:
      contents: write
    uses: ./.github/workflows/publish-crate.yml
    secrets: inherit
    with:
      crate: tshttp-runtime
      build-gate: no-default
