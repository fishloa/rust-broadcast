name: Release multimux-cli

# Publishes the multimux-cli crate to crates.io on a `multimux-cli-v*` tag.
# multimux-cli is versioned/released INDEPENDENTLY. CI is the only source of
# published artifacts — never `cargo publish` from a workstation.
#
# DEPENDENCY ORDER: multimux-cli depends on the `multimux` library, which in
# turn depends on broadcast-auth -> transmux -> rtsp-runtime -> hls-runtime.
# Publish `multimux` (>= the referenced 0.3) FIRST — after that whole chain is
# live — or crates.io will reject the publish. multimux-cli is a std (tokio)
# CLI crate — no no_std gate.

on:
  push:
    tags: ["multimux-cli-v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: publish multimux-cli to crates.io
    runs-on: ubuntu-latest
    environment: crates-io
    # `contents: write` is needed to create the GitHub Release below, and is
    # the only elevated permission this job holds — `cargo publish`
    # authenticates with CARGO_REGISTRY_TOKEN, not the GitHub token.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2

      - name: Gate — multimux-cli tests
        run: cargo test -p multimux-cli --all-features --locked

      - name: Gate — multimux-cli clippy
        run: cargo clippy -p multimux-cli --all-features --all-targets --locked -- -D warnings

      - name: Gate — multimux-cli no-default-features build
        run: cargo build -p multimux-cli --no-default-features --locked

      - name: Gate — tag matches multimux-cli version
        run: |
          TAG="${GITHUB_REF_NAME#multimux-cli-v}"
          V=$(cargo metadata --no-deps --format-version 1 --locked \
              | python3 -c "import json,sys; print({p['name']: p['version'] for p in json.load(sys.stdin)['packages']}['multimux-cli'])")
          if [ "$V" != "$TAG" ]; then
            echo "::error::multimux-cli is $V but tag is $TAG"; exit 1
          fi

      # docs/RELEASE-DOCS.md requires a release note per tag, and this workflow
      # uses it as the GitHub Release body — so a missing one is caught HERE,
      # before anything reaches crates.io, rather than after the version is
      # already immutable.
      - name: Gate — release note exists for this version
        run: |
          NOTE="docs/release-notes/multimux-cli-${GITHUB_REF_NAME#multimux-cli-v}.md"
          if [ ! -s "$NOTE" ]; then
            echo "::error::$NOTE is missing or empty — see docs/RELEASE-DOCS.md"
            exit 1
          fi
          echo "::notice::release note $NOTE present"

      - name: Publish multimux-cli
        run: |
          if out=$(cargo publish -p multimux-cli --locked 2>&1); then
            echo "$out"; echo "::notice::published multimux-cli"
          elif echo "$out" | grep -qiE "already (been )?uploaded|already exists"; then
            echo "$out"; echo "::notice::multimux-cli already on crates.io at this version — skipping"
          else
            echo "$out"; echo "::error::failed to publish multimux-cli"; exit 1
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      # docs/RELEASE-DOCS.md section 3: a GitHub Release per tag, body = the
      # release note. This was a manual step for the first 191 releases and was
      # missed for 102 tags, so it is automated. Idempotent: an existing
      # release is left untouched, so re-running after a partial failure is
      # safe.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${GITHUB_REF_NAME#multimux-cli-v}"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::notice::GitHub Release $GITHUB_REF_NAME already exists — leaving it alone"
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "multimux-cli $V" \
              --notes-file "docs/release-notes/multimux-cli-$V.md"
            echo "::notice::created GitHub Release $GITHUB_REF_NAME"
          fi

  # Compiled binaries for the four supported targets, attached to the Release
  # this tag's publish job creates. crates.io carries the source; without this
  # there is no way to use multimux without a Rust toolchain.
  binaries:
    needs: publish
    permissions:
      contents: write
    uses: ./.github/workflows/reusable-binaries.yml
    with:
      crate: multimux-cli
      bin: multimux
