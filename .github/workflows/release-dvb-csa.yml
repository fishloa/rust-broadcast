name: Release dvb-csa

# Publishes the dvb-csa crate to crates.io on a `dvb-csa-v*` tag.
# dvb-csa is versioned and released INDEPENDENTLY of the lockstep `v*` tag,
# so it has its own publish workflow. CI is the only source of published
# artifacts — never `cargo publish` from a workstation.
# Requires the CARGO_REGISTRY_TOKEN secret.

on:
  push:
    tags: ["dvb-csa-v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: publish dvb-csa to crates.io
    runs-on: ubuntu-latest
    # crates.io publish is gated: pauses for manual approval by a
    # required reviewer before any cargo publish can run. See the
    # 'crates-io' environment (repo Settings -> Environments).
    environment: crates-io
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2

      - name: Gate — dvb-csa tests
        run: cargo test -p dvb-csa --all-features --locked

      - name: Gate — dvb-csa clippy
        run: cargo clippy -p dvb-csa --all-features --all-targets --locked -- -D warnings

      - name: Gate — dvb-csa no_std build
        run: cargo build -p dvb-csa --no-default-features --target thumbv7em-none-eabi --locked

      - name: Gate — tag matches dvb-csa version
        run: |
          TAG="${GITHUB_REF_NAME#dvb-csa-v}"
          V=$(cargo metadata --no-deps --format-version 1 --locked \
              | python3 -c "import json,sys; print({p['name']: p['version'] for p in json.load(sys.stdin)['packages']}['dvb-csa'])")
          if [ "$V" != "$TAG" ]; then
            echo "::error::dvb-csa is $V but tag is $TAG"; exit 1
          fi

      # Idempotent: an "already uploaded" error is treated as success.
      - name: Publish dvb-csa
        run: |
          if out=$(cargo publish -p dvb-csa --locked 2>&1); then
            echo "$out"; echo "::notice::published dvb-csa"
          elif echo "$out" | grep -qiE "already (been )?uploaded|already exists"; then
            echo "$out"; echo "::notice::dvb-csa already on crates.io at this version — skipping"
          else
            echo "$out"; echo "::error::failed to publish dvb-csa"; exit 1
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
