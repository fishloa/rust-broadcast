name: Release dvb-csa

# Publishes the dvb-csa crate to crates.io on a `dvb-csa-v*` tag.
# dvb-csa is versioned and released INDEPENDENTLY of the lockstep `v*` tag,
# so it has its own publish workflow. CI is the only source of published
# artifacts — never `cargo publish` from a workstation.
# Requires the CARGO_REGISTRY_TOKEN secret.

on:
  push:
    tags: ["dvb-csa-v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: publish dvb-csa to crates.io
    runs-on: ubuntu-latest
    # crates.io publish is gated: pauses for manual approval by a
    # required reviewer before any cargo publish can run. See the
    # 'crates-io' environment (repo Settings -> Environments).
    environment: crates-io
    # `contents: write` is needed to create the GitHub Release below, and is
    # the only elevated permission this job holds — `cargo publish`
    # authenticates with CARGO_REGISTRY_TOKEN, not the GitHub token.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2

      - name: Gate — dvb-csa tests
        run: cargo test -p dvb-csa --all-features --locked

      - name: Gate — dvb-csa clippy
        run: cargo clippy -p dvb-csa --all-features --all-targets --locked -- -D warnings

      - name: Gate — dvb-csa no_std build
        run: cargo build -p dvb-csa --no-default-features --target thumbv7em-none-eabi --locked

      - name: Gate — dvb-csa examples build
        run: cargo build -p dvb-csa --all-features --examples --locked

      - name: Gate — tag matches dvb-csa version
        run: |
          TAG="${GITHUB_REF_NAME#dvb-csa-v}"
          V=$(cargo metadata --no-deps --format-version 1 --locked \
              | python3 -c "import json,sys; print({p['name']: p['version'] for p in json.load(sys.stdin)['packages']}['dvb-csa'])")
          if [ "$V" != "$TAG" ]; then
            echo "::error::dvb-csa is $V but tag is $TAG"; exit 1
          fi

      # Idempotent: an "already uploaded" error is treated as success.
      # docs/RELEASE-DOCS.md requires a release note per tag, and this workflow
      # uses it as the GitHub Release body — so a missing one is caught HERE,
      # before anything reaches crates.io, rather than after the version is
      # already immutable.
      - name: Gate — release note exists for this version
        run: |
          NOTE="docs/release-notes/dvb-csa-${GITHUB_REF_NAME#dvb-csa-v}.md"
          if [ ! -s "$NOTE" ]; then
            echo "::error::$NOTE is missing or empty — see docs/RELEASE-DOCS.md"
            exit 1
          fi
          echo "::notice::release note $NOTE present"

      - name: Publish dvb-csa
        run: |
          if out=$(cargo publish -p dvb-csa --locked 2>&1); then
            echo "$out"; echo "::notice::published dvb-csa"
          elif echo "$out" | grep -qiE "already (been )?uploaded|already exists"; then
            echo "$out"; echo "::notice::dvb-csa already on crates.io at this version — skipping"
          else
            echo "$out"; echo "::error::failed to publish dvb-csa"; exit 1
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      # docs/RELEASE-DOCS.md section 3: a GitHub Release per tag, body = the
      # release note. This was a manual step for the first 191 releases and was
      # missed for 102 tags, so it is automated. Idempotent: an existing
      # release is left untouched, so re-running after a partial failure is
      # safe.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${GITHUB_REF_NAME#dvb-csa-v}"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::notice::GitHub Release $GITHUB_REF_NAME already exists — leaving it alone"
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "dvb-csa $V" \
              --notes-file "docs/release-notes/dvb-csa-$V.md"
            echo "::notice::created GitHub Release $GITHUB_REF_NAME"
          fi
