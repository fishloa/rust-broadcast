name: Release ssai-runtime

# Publishes the ssai-runtime crate to crates.io on a `ssai-runtime-v*` tag.
# ssai-runtime is versioned and released INDEPENDENTLY (standalone integration
# crate with its own cadence). CI is the only source of published artifacts —
# never `cargo publish` from a workstation. Requires the CARGO_REGISTRY_TOKEN
# secret.
#
# DEPENDENCY ORDER: ssai-runtime depends on broadcast-common (lockstep,
# already live) and broadcast-hls (>= 0.1, already live); its scte35-splice
# and mp4-emsg deps are dev-only (fixture tests/examples) and do not gate
# publishing. Downstream, playout-runtime depends on ssai-runtime (>= 0.1) —
# this must land before that (see release-playout-runtime.yml).

on:
  push:
    tags: ["ssai-runtime-v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: publish ssai-runtime to crates.io
    runs-on: ubuntu-latest
    # crates.io publish is gated: pauses for manual approval by a
    # required reviewer before any cargo publish can run. See the
    # 'crates-io' environment (repo Settings -> Environments).
    environment: crates-io
    # `contents: write` is needed to create the GitHub Release below, and is
    # the only elevated permission this job holds — `cargo publish`
    # authenticates with CARGO_REGISTRY_TOKEN, not the GitHub token.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2

      - name: Gate — ssai-runtime tests (all features)
        run: cargo test -p ssai-runtime --all-features --locked

      - name: Gate — ssai-runtime clippy
        run: cargo clippy -p ssai-runtime --all-features --all-targets --locked -- -D warnings

      - name: Gate — ssai-runtime no_std build
        run: cargo build -p ssai-runtime --no-default-features --target thumbv7em-none-eabi --locked

      - name: Gate — ssai-runtime examples build
        run: cargo build -p ssai-runtime --all-features --examples --locked

      - name: Gate — tag matches ssai-runtime version
        run: |
          TAG="${GITHUB_REF_NAME#ssai-runtime-v}"
          V=$(cargo metadata --no-deps --format-version 1 --locked \
              | python3 -c "import json,sys; print({p['name']: p['version'] for p in json.load(sys.stdin)['packages']}['ssai-runtime'])")
          if [ "$V" != "$TAG" ]; then
            echo "::error::ssai-runtime is $V but tag is $TAG"; exit 1
          fi

      # Idempotent: an "already uploaded" error is treated as success.
      # docs/RELEASE-DOCS.md requires a release note per tag, and this workflow
      # uses it as the GitHub Release body — so a missing one is caught HERE,
      # before anything reaches crates.io, rather than after the version is
      # already immutable.
      - name: Gate — release note exists for this version
        run: |
          NOTE="docs/release-notes/ssai-runtime-${GITHUB_REF_NAME#ssai-runtime-v}.md"
          if [ ! -s "$NOTE" ]; then
            echo "::error::$NOTE is missing or empty — see docs/RELEASE-DOCS.md"
            exit 1
          fi
          echo "::notice::release note $NOTE present"

      - name: Publish ssai-runtime
        run: |
          if out=$(cargo publish -p ssai-runtime --locked 2>&1); then
            echo "$out"; echo "::notice::published ssai-runtime"
          elif echo "$out" | grep -qiE "already (been )?uploaded|already exists"; then
            echo "$out"; echo "::notice::ssai-runtime already on crates.io at this version — skipping"
          else
            echo "$out"; echo "::error::failed to publish ssai-runtime"; exit 1
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      # docs/RELEASE-DOCS.md section 3: a GitHub Release per tag, body = the
      # release note. This was a manual step for the first 191 releases and was
      # missed for 102 tags, so it is automated. Idempotent: an existing
      # release is left untouched, so re-running after a partial failure is
      # safe.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${GITHUB_REF_NAME#ssai-runtime-v}"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::notice::GitHub Release $GITHUB_REF_NAME already exists — leaving it alone"
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "ssai-runtime $V" \
              --notes-file "docs/release-notes/ssai-runtime-$V.md"
            echo "::notice::created GitHub Release $GITHUB_REF_NAME"
          fi
