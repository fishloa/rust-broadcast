name: Release broadcast-loudness

# Publishes the broadcast-loudness crate to crates.io on a
# `broadcast-loudness-v*` tag. broadcast-loudness is versioned and released
# INDEPENDENTLY of the lockstep `v*` tag, so it has its own publish workflow.
# CI is the only source of published artifacts — never `cargo publish` from a
# workstation. Requires the CARGO_REGISTRY_TOKEN secret.

on:
  push:
    tags: ["broadcast-loudness-v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: publish broadcast-loudness to crates.io
    runs-on: ubuntu-latest
    # crates.io publish is gated: pauses for manual approval by a
    # required reviewer before any cargo publish can run. See the
    # 'crates-io' environment (repo Settings -> Environments).
    environment: crates-io
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2

      - name: Gate — broadcast-loudness tests
        run: cargo test -p broadcast-loudness --all-features --locked

      - name: Gate — broadcast-loudness clippy
        run: cargo clippy -p broadcast-loudness --all-features --all-targets --locked -- -D warnings

      - name: Gate — broadcast-loudness no_std build
        run: cargo build -p broadcast-loudness --no-default-features --target thumbv7em-none-eabi --locked

      - name: Gate — broadcast-loudness examples build
        run: cargo build -p broadcast-loudness --all-features --examples --locked

      - name: Gate — tag matches broadcast-loudness version
        run: |
          TAG="${GITHUB_REF_NAME#broadcast-loudness-v}"
          V=$(cargo metadata --no-deps --format-version 1 --locked \
              | python3 -c "import json,sys; print({p['name']: p['version'] for p in json.load(sys.stdin)['packages']}['broadcast-loudness'])")
          if [ "$V" != "$TAG" ]; then
            echo "::error::broadcast-loudness is $V but tag is $TAG"; exit 1
          fi

      # Idempotent: an "already uploaded" error is treated as success.
      - name: Publish broadcast-loudness
        run: |
          if out=$(cargo publish -p broadcast-loudness --locked 2>&1); then
            echo "$out"; echo "::notice::published broadcast-loudness"
          elif echo "$out" | grep -qiE "already (been )?uploaded|already exists"; then
            echo "$out"; echo "::notice::broadcast-loudness already on crates.io at this version — skipping"
          else
            echo "$out"; echo "::error::failed to publish broadcast-loudness"; exit 1
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
