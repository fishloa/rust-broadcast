name: Release playout-runtime

# Publishes the playout-runtime crate to crates.io on a `playout-runtime-v*`
# tag. playout-runtime is versioned and released INDEPENDENTLY (standalone
# integration crate with its own cadence). CI is the only source of published
# artifacts — never `cargo publish` from a workstation. Requires the
# CARGO_REGISTRY_TOKEN secret.
#
# DEPENDENCY ORDER: playout-runtime depends on broadcast-common (lockstep,
# already live), ssai-runtime (>= 0.1 — see release-ssai-runtime.yml, MUST
# land first), and scte35-splice (>= 2, already live). Its mp4-emsg dep is
# dev-only (fixture tests/examples) and does not gate publishing.

on:
  push:
    tags: ["playout-runtime-v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: publish playout-runtime to crates.io
    runs-on: ubuntu-latest
    # crates.io publish is gated: pauses for manual approval by a
    # required reviewer before any cargo publish can run. See the
    # 'crates-io' environment (repo Settings -> Environments).
    environment: crates-io
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2

      - name: Gate — playout-runtime tests (all features)
        run: cargo test -p playout-runtime --all-features --locked

      - name: Gate — playout-runtime clippy
        run: cargo clippy -p playout-runtime --all-features --all-targets --locked -- -D warnings

      - name: Gate — playout-runtime no_std build
        run: cargo build -p playout-runtime --no-default-features --target thumbv7em-none-eabi --locked

      - name: Gate — playout-runtime examples build
        run: cargo build -p playout-runtime --all-features --examples --locked

      - name: Gate — tag matches playout-runtime version
        run: |
          TAG="${GITHUB_REF_NAME#playout-runtime-v}"
          V=$(cargo metadata --no-deps --format-version 1 --locked \
              | python3 -c "import json,sys; print({p['name']: p['version'] for p in json.load(sys.stdin)['packages']}['playout-runtime'])")
          if [ "$V" != "$TAG" ]; then
            echo "::error::playout-runtime is $V but tag is $TAG"; exit 1
          fi

      # playout-runtime's ssai-runtime dependency must already be on
      # crates.io. Idempotent: an "already uploaded" error is treated as
      # success.
      - name: Publish playout-runtime
        run: |
          if out=$(cargo publish -p playout-runtime --locked 2>&1); then
            echo "$out"; echo "::notice::published playout-runtime"
          elif echo "$out" | grep -qiE "already (been )?uploaded|already exists"; then
            echo "$out"; echo "::notice::playout-runtime already on crates.io at this version — skipping"
          else
            echo "$out"; echo "::error::failed to publish playout-runtime"; exit 1
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
