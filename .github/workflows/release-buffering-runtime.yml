name: Release buffering-runtime

# Publishes the buffering-runtime crate to crates.io on a `buffering-runtime-v*` tag.
# buffering-runtime is versioned and released INDEPENDENTLY. CI is the only source of
# published artifacts — never `cargo publish` from a workstation. Requires the
# CARGO_REGISTRY_TOKEN secret.
#
# DEPENDENCY ORDER: buffering-runtime depends on broadcast-common (path dep, version
# "10.0"), so broadcast-common must already be published at a compatible version
# before this tag is pushed.
#
# It is released by docs/release-plan-2026-10-patch4.pairs together with mpeg-ts
# and transmux; its tag is independent of theirs. broadcast-common 10.0 is already
# live, so there is nothing to wait for. The lane checks out the pinned private
# fixtures through the shared `./.github/actions/private-fixtures` composite
# action (read-only deploy key, as ci.yml does) so the real-capture goldens run
# here with REQUIRE_PRIVATE_FIXTURES=1; without the key, or with
# SKIP_PRIVATE_FIXTURES=1 set, they skip loudly.

on:
  push:
    tags: ["buffering-runtime-v*"]

jobs:
  publish:
    permissions:
      contents: write
    uses: ./.github/workflows/publish-crate.yml
    secrets: inherit
    with:
      crate: buffering-runtime
