name: Release buffering-runtime

# Publishes the buffering-runtime crate to crates.io on a `buffering-runtime-v*` tag.
# buffering-runtime is versioned and released INDEPENDENTLY. CI is the only source of
# published artifacts — never `cargo publish` from a workstation. Requires the
# CARGO_REGISTRY_TOKEN secret.
#
# DEPENDENCY ORDER: buffering-runtime depends on broadcast-common (path dep, version
# "10.0"), so broadcast-common must already be published at a compatible version
# before this tag is pushed.
#
# It is released by docs/release-plan-2026-10-patch4.pairs together with mpeg-ts
# and transmux; its tag is independent of theirs. broadcast-common 10.0 is already
# live, so there is nothing to wait for. The private-fixture tests skip loudly in
# this lane (no private checkout); the CI test matrix runs them with
# REQUIRE_PRIVATE_FIXTURES=1 before the tag is pushed.

on:
  push:
    tags: ["buffering-runtime-v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: publish buffering-runtime to crates.io
    runs-on: ubuntu-latest
    # crates.io publish is gated: pauses for manual approval by a
    # required reviewer before any cargo publish can run. See the
    # 'crates-io' environment (repo Settings -> Environments).
    environment: crates-io
    # `contents: write` is needed to create the GitHub Release below, and is
    # the only elevated permission this job holds — `cargo publish`
    # authenticates with CARGO_REGISTRY_TOKEN, not the GitHub token.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2

      - name: Gate — buffering-runtime tests (all features)
        run: cargo test -p buffering-runtime --all-features --locked

      - name: Gate — buffering-runtime clippy
        run: cargo clippy -p buffering-runtime --all-features --all-targets --locked -- -D warnings

      - name: Gate — buffering-runtime no_std build (bare metal)
        run: cargo build -p buffering-runtime --no-default-features --target thumbv7em-none-eabi --locked

      - name: Gate — buffering-runtime examples build
        run: cargo build -p buffering-runtime --all-features --examples --locked

      - name: Gate — tag matches buffering-runtime version
        run: |
          TAG="${GITHUB_REF_NAME#buffering-runtime-v}"
          V=$(cargo metadata --no-deps --format-version 1 --locked \
              | python3 -c "import json,sys; print({p['name']: p['version'] for p in json.load(sys.stdin)['packages']}['buffering-runtime'])")
          if [ "$V" != "$TAG" ]; then
            echo "::error::buffering-runtime is $V but tag is $TAG"; exit 1
          fi

      # docs/RELEASE-DOCS.md requires a release note per tag, and this workflow
      # uses it as the GitHub Release body — so a missing one is caught HERE,
      # before anything reaches crates.io, rather than after the version is
      # already immutable.
      - name: Gate — release note exists for this version
        run: |
          NOTE="docs/release-notes/buffering-runtime-${GITHUB_REF_NAME#buffering-runtime-v}.md"
          if [ ! -s "$NOTE" ]; then
            echo "::error::$NOTE is missing or empty — see docs/RELEASE-DOCS.md"
            exit 1
          fi
          echo "::notice::release note $NOTE present"

      - name: Publish buffering-runtime
        run: |
          if out=$(cargo publish -p buffering-runtime --locked 2>&1); then
            echo "$out"; echo "::notice::published buffering-runtime"
          elif echo "$out" | grep -qiE "already (been )?uploaded|already exists"; then
            echo "$out"; echo "::notice::buffering-runtime already on crates.io at this version — skipping"
          else
            echo "$out"; echo "::error::failed to publish buffering-runtime"; exit 1
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      # docs/RELEASE-DOCS.md section 3: a GitHub Release per tag, body = the
      # release note. This was a manual step for the first 191 releases and was
      # missed for 102 tags, so it is automated. Idempotent: an existing
      # release is left untouched, so re-running after a partial failure is
      # safe.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${GITHUB_REF_NAME#buffering-runtime-v}"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::notice::GitHub Release $GITHUB_REF_NAME already exists — leaving it alone"
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "buffering-runtime $V" \
              --notes-file "docs/release-notes/buffering-runtime-$V.md"
            echo "::notice::created GitHub Release $GITHUB_REF_NAME"
          fi
