name: Release rtmp-runtime

# Publishes the rtmp-runtime crate to crates.io on a `rtmp-runtime-v*` tag.
# rtmp-runtime is versioned and released INDEPENDENTLY. CI is the only source of
# published artifacts — never `cargo publish` from a workstation. Requires the
# CARGO_REGISTRY_TOKEN secret.
#
# DEPENDENCY ORDER: rtmp-runtime's only workspace dep at publish time is a
# **dev**-dependency on transmux (path-only-published-as-version 0.19) —
# publish transmux 0.19 FIRST. multimux depends on rtmp-runtime (>= 0.1), so
# this lands before multimux.

on:
  push:
    tags: ["rtmp-runtime-v*"]

jobs:
  publish:
    permissions:
      contents: write
    uses: ./.github/workflows/publish-crate.yml
    secrets: inherit
    with:
      crate: rtmp-runtime
      build-gate: no-default
