name: Release rtmp-runtime

# Publishes the rtmp-runtime crate to crates.io on a `rtmp-runtime-v*` tag.
# rtmp-runtime is versioned and released INDEPENDENTLY. CI is the only source of
# published artifacts — never `cargo publish` from a workstation. Requires the
# CARGO_REGISTRY_TOKEN secret.
#
# DEPENDENCY ORDER: rtmp-runtime's only workspace dep at publish time is a
# **dev**-dependency on transmux (path-only-published-as-version 0.19) —
# publish transmux 0.19 FIRST. multimux depends on rtmp-runtime (>= 0.1), so
# this lands before multimux.

on:
  push:
    tags: ["rtmp-runtime-v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: publish rtmp-runtime to crates.io
    runs-on: ubuntu-latest
    # crates.io publish is gated: pauses for manual approval by a
    # required reviewer before any cargo publish can run. See the
    # 'crates-io' environment (repo Settings -> Environments).
    environment: crates-io
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2

      - name: Gate — rtmp-runtime tests (all features)
        run: cargo test -p rtmp-runtime --all-features --locked

      - name: Gate — rtmp-runtime clippy
        run: cargo clippy -p rtmp-runtime --all-features --all-targets --locked -- -D warnings

      - name: Gate — rtmp-runtime sans-IO (no-default) lib build
        run: cargo build -p rtmp-runtime --no-default-features --locked

      - name: Gate — tag matches rtmp-runtime version
        run: |
          TAG="${GITHUB_REF_NAME#rtmp-runtime-v}"
          V=$(cargo metadata --no-deps --format-version 1 --locked \
              | python3 -c "import json,sys; print({p['name']: p['version'] for p in json.load(sys.stdin)['packages']}['rtmp-runtime'])")
          if [ "$V" != "$TAG" ]; then
            echo "::error::rtmp-runtime is $V but tag is $TAG"; exit 1
          fi

      - name: Publish rtmp-runtime
        run: |
          if out=$(cargo publish -p rtmp-runtime --locked 2>&1); then
            echo "$out"; echo "::notice::published rtmp-runtime"
          elif echo "$out" | grep -qiE "already (been )?uploaded|already exists"; then
            echo "$out"; echo "::notice::rtmp-runtime already on crates.io at this version — skipping"
          else
            echo "$out"; echo "::error::failed to publish rtmp-runtime"; exit 1
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
