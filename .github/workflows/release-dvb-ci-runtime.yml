name: Release dvb-ci-runtime

# Publishes the dvb-ci-runtime crate to crates.io on a `dvb-ci-runtime-v*` tag.
# dvb-ci-runtime is a std-only crate versioned and released INDEPENDENTLY of the
# lockstep `v*` tag (it follows dvb-ci's cadence, not the core MSRV lockstep), so
# it has its own publish workflow. CI is the only source of published artifacts —
# never `cargo publish` from a workstation. Requires the CARGO_REGISTRY_TOKEN secret.

on:
  push:
    tags: ["dvb-ci-runtime-v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: publish dvb-ci-runtime to crates.io
    runs-on: ubuntu-latest
    # crates.io publish is gated: pauses for manual approval by a
    # required reviewer before any cargo publish can run. See the
    # 'crates-io' environment (repo Settings -> Environments).
    environment: crates-io
    # `contents: write` is needed to create the GitHub Release below, and is
    # the only elevated permission this job holds — `cargo publish`
    # authenticates with CARGO_REGISTRY_TOKEN, not the GitHub token.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2

      - name: Gate — dvb-ci-runtime tests
        run: cargo test -p dvb-ci-runtime --all-features --locked

      - name: Gate — dvb-ci-runtime clippy
        run: cargo clippy -p dvb-ci-runtime --all-features --all-targets --locked -- -D warnings

      - name: Gate — dvb-ci-runtime examples build
        run: cargo build -p dvb-ci-runtime --all-features --examples --locked

      - name: Gate — dvb-ci-runtime no-default-features build
        run: cargo build -p dvb-ci-runtime --no-default-features --locked

      - name: Gate — tag matches dvb-ci-runtime version
        run: |
          TAG="${GITHUB_REF_NAME#dvb-ci-runtime-v}"
          V=$(cargo metadata --no-deps --format-version 1 --locked \
              | python3 -c "import json,sys; print({p['name']: p['version'] for p in json.load(sys.stdin)['packages']}['dvb-ci-runtime'])")
          if [ "$V" != "$TAG" ]; then
            echo "::error::dvb-ci-runtime is $V but tag is $TAG"; exit 1
          fi

      # crates.io. Idempotent: an "already uploaded" error is treated as success
      # so a re-run is safe.
      # docs/RELEASE-DOCS.md requires a release note per tag, and this workflow
      # uses it as the GitHub Release body — so a missing one is caught HERE,
      # before anything reaches crates.io, rather than after the version is
      # already immutable.
      - name: Gate — release note exists for this version
        run: |
          NOTE="docs/release-notes/dvb-ci-runtime-${GITHUB_REF_NAME#dvb-ci-runtime-v}.md"
          if [ ! -s "$NOTE" ]; then
            echo "::error::$NOTE is missing or empty — see docs/RELEASE-DOCS.md"
            exit 1
          fi
          echo "::notice::release note $NOTE present"

      - name: Publish dvb-ci-runtime
        run: |
          if out=$(cargo publish -p dvb-ci-runtime --locked 2>&1); then
            echo "$out"; echo "::notice::published dvb-ci-runtime"
          elif echo "$out" | grep -qiE "already (been )?uploaded|already exists"; then
            echo "$out"; echo "::notice::dvb-ci-runtime already on crates.io at this version — skipping"
          else
            echo "$out"; echo "::error::failed to publish dvb-ci-runtime"; exit 1
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      # docs/RELEASE-DOCS.md section 3: a GitHub Release per tag, body = the
      # release note. This was a manual step for the first 191 releases and was
      # missed for 102 tags, so it is automated. Idempotent: an existing
      # release is left untouched, so re-running after a partial failure is
      # safe.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${GITHUB_REF_NAME#dvb-ci-runtime-v}"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::notice::GitHub Release $GITHUB_REF_NAME already exists — leaving it alone"
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "dvb-ci-runtime $V" \
              --notes-file "docs/release-notes/dvb-ci-runtime-$V.md"
            echo "::notice::created GitHub Release $GITHUB_REF_NAME"
          fi

  # Compiled binaries for the four supported targets, attached to the Release
  # this tag's publish job creates. crates.io carries the source; without this
  # there is no way to use ci-probe without a Rust toolchain.
  binaries:
    needs: publish
    uses: ./.github/workflows/reusable-binaries.yml
    with:
      crate: dvb-ci-runtime
      bin: ci-probe
      features: linux
      # ci-probe is `#[cfg(target_os = "linux")]` gated — the Apple
      # targets are omitted rather than built and skipped.
      targets: '[{"os":"ubuntu-latest","target":"x86_64-unknown-linux-gnu"},
                 {"os":"ubuntu-24.04-arm","target":"aarch64-unknown-linux-gnu"}]'
