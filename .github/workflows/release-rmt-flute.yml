name: Release rmt-flute

# Publishes the rmt-flute crate to crates.io on a `rmt-flute-v*` tag.
# rmt-flute is versioned and released INDEPENDENTLY of the lockstep `v*` tag
# (it is a standalone reusable crate with its own cadence), so it has its own
# publish workflow. CI is the only source of published artifacts — never
# `cargo publish` from a workstation. Requires the CARGO_REGISTRY_TOKEN secret.
#
# Renamed from `release-dvb-flute.yml` at 0.4.0 — the crate implements only
# IETF RMT standards (RFC 5651/5775/6726/5740) and no DVB standard. All
# `dvb-flute` versions are yanked; there is no shim.

on:
  push:
    tags: ["rmt-flute-v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: publish rmt-flute to crates.io
    runs-on: ubuntu-latest
    # crates.io publish is gated: pauses for manual approval by a
    # required reviewer before any cargo publish can run. See the
    # 'crates-io' environment (repo Settings -> Environments).
    environment: crates-io
    # `contents: write` is needed to create the GitHub Release below, and is
    # the only elevated permission this job holds — `cargo publish`
    # authenticates with CARGO_REGISTRY_TOKEN, not the GitHub token.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2

      - name: Gate — rmt-flute tests
        run: cargo test -p rmt-flute --all-features --locked

      - name: Gate — rmt-flute clippy
        run: cargo clippy -p rmt-flute --all-features --all-targets --locked -- -D warnings

      - name: Gate — rmt-flute no_std build
        run: cargo build -p rmt-flute --no-default-features --target thumbv7em-none-eabi --locked

      - name: Gate — rmt-flute examples build
        run: cargo build -p rmt-flute --all-features --examples --locked

      - name: Gate — tag matches rmt-flute version
        run: |
          TAG="${GITHUB_REF_NAME#rmt-flute-v}"
          V=$(cargo metadata --no-deps --format-version 1 --locked \
              | python3 -c "import json,sys; print({p['name']: p['version'] for p in json.load(sys.stdin)['packages']}['rmt-flute'])")
          if [ "$V" != "$TAG" ]; then
            echo "::error::rmt-flute is $V but tag is $TAG"; exit 1
          fi

      # Idempotent: an "already uploaded" error is treated as success.
      # docs/RELEASE-DOCS.md requires a release note per tag, and this workflow
      # uses it as the GitHub Release body — so a missing one is caught HERE,
      # before anything reaches crates.io, rather than after the version is
      # already immutable.
      - name: Gate — release note exists for this version
        run: |
          NOTE="docs/release-notes/rmt-flute-${GITHUB_REF_NAME#rmt-flute-v}.md"
          if [ ! -s "$NOTE" ]; then
            echo "::error::$NOTE is missing or empty — see docs/RELEASE-DOCS.md"
            exit 1
          fi
          echo "::notice::release note $NOTE present"

      - name: Publish rmt-flute
        run: |
          if out=$(cargo publish -p rmt-flute --locked 2>&1); then
            echo "$out"; echo "::notice::published rmt-flute"
          elif echo "$out" | grep -qiE "already (been )?uploaded|already exists"; then
            echo "$out"; echo "::notice::rmt-flute already on crates.io at this version — skipping"
          else
            echo "$out"; echo "::error::failed to publish rmt-flute"; exit 1
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      # docs/RELEASE-DOCS.md section 3: a GitHub Release per tag, body = the
      # release note. This was a manual step for the first 191 releases and was
      # missed for 102 tags, so it is automated. Idempotent: an existing
      # release is left untouched, so re-running after a partial failure is
      # safe.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${GITHUB_REF_NAME#rmt-flute-v}"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::notice::GitHub Release $GITHUB_REF_NAME already exists — leaving it alone"
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "rmt-flute $V" \
              --notes-file "docs/release-notes/rmt-flute-$V.md"
            echo "::notice::created GitHub Release $GITHUB_REF_NAME"
          fi
