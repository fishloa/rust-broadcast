name: Release broadcast-smooth

# Publishes the broadcast-smooth crate to crates.io on a `broadcast-smooth-v*`
# tag. broadcast-smooth is versioned and released INDEPENDENTLY of the lockstep
# `v*` tag, so it has its own publish workflow. CI is the only source of
# published artifacts — never `cargo publish` from a workstation. Requires the
# CARGO_REGISTRY_TOKEN secret.

on:
  push:
    tags: ["broadcast-smooth-v*"]

jobs:
  publish:
    permissions:
      contents: write
    uses: ./.github/workflows/publish-crate.yml
    secrets: inherit
    with:
      crate: broadcast-smooth
      build-gate: no-default
