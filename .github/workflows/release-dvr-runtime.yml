name: Release dvr-runtime

# Publishes the dvr-runtime crate to crates.io on a `dvr-runtime-v*` tag.
# dvr-runtime is versioned and released INDEPENDENTLY (standalone sans-IO
# crate with its own cadence). CI is the only source of published artifacts —
# never `cargo publish` from a workstation. Requires the CARGO_REGISTRY_TOKEN
# secret.
#
# DEPENDENCY ORDER: dvr-runtime depends on broadcast-common, broadcast-hls,
# media-plane, dvb-si and transmux, all of which must be live (at the versions
# its manifest names) before this tag is pushed. Downstream, multimux depends
# on dvr-runtime, so this must land before it does. `docs/crates-index.toml`
# keeps `crates_io = false` for dvr-runtime until the publish succeeds.

on:
  push:
    tags: ["dvr-runtime-v*"]

jobs:
  publish:
    permissions:
      contents: write
    uses: ./.github/workflows/publish-crate.yml
    secrets: inherit
    with:
      crate: dvr-runtime
      build-gate: default
