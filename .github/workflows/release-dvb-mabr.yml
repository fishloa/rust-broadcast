name: Release dvb-mabr

# Publishes the dvb-mabr crate to crates.io on a `dvb-mabr-v*` tag. dvb-mabr
# is versioned and released INDEPENDENTLY (standalone reusable crate with its
# own cadence). CI is the only source of published artifacts — never
# `cargo publish` from a workstation. Requires the CARGO_REGISTRY_TOKEN
# secret.
#
# DEPENDENCY ORDER: dvb-mabr depends only on broadcast-common (lockstep,
# already live) plus the external roxmltree crate. No new crate needs to
# land before this one.

on:
  push:
    tags: ["dvb-mabr-v*"]

jobs:
  publish:
    permissions:
      contents: write
    uses: ./.github/workflows/publish-crate.yml
    secrets: inherit
    with:
      crate: dvb-mabr
