name: Release

# Publishes the workspace crates to crates.io when a version tag is pushed.
# CI is the only source of published artifacts — never `cargo publish` from a
# workstation. Requires the CARGO_REGISTRY_TOKEN repository secret (a
# crates.io API token with publish-new + publish-update scope).

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: publish to crates.io
    runs-on: ubuntu-latest
    # crates.io publish is gated: pauses for manual approval by a
    # required reviewer before any cargo publish can run. See the
    # 'crates-io' environment (repo Settings -> Environments).
    environment: crates-io
    # `contents: write` is needed to create the GitHub Release below, and is
    # the only elevated permission this job holds — `cargo publish`
    # authenticates with CARGO_REGISTRY_TOKEN, not the GitHub token.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2

      # dvb-stream is intentionally excluded from the lockstep v-tag publish
      # (it is versioned and released independently; see dvb-stream/Cargo.toml).
      - name: Gate — full test suite
        run: cargo test --workspace --exclude dvb-stream --all-features --locked

      - name: Gate — clippy
        run: cargo clippy --workspace --exclude dvb-stream --all-features --all-targets --locked -- -D warnings

      - name: Gate — tag matches crate versions
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          for c in dvb-si dvb-conformance dvb-t2mi dvb-bbframe dvb-tools; do
            V=$(cargo metadata --no-deps --format-version 1 --locked \
                | python3 -c "import json,sys; print({p['name']: p['version'] for p in json.load(sys.stdin)['packages']}['$c'])")
            if [ "$V" != "$TAG" ]; then
              echo "::error::$c is $V but tag is $TAG"; exit 1
            fi
          done

      # broadcast-common is NO LONGER part of this lockstep. It has its own
      # tag lane (`broadcast-common-v*`, see release-broadcast-common.yml) and
      # versions on its own API changes. It was ejected because lockstep forced
      # it to major whenever a sibling broke — 9.0.0 was purely additive and
      # should have been 8.2.0 — and with a fan-in of 35 (only five of them
      # lockstep members) each inherited major migrated thirty uninvolved
      # crates and created the 8/9 boundary behind #819, #824 and #858.
      #
      # If a wave moves broadcast-common too, push `broadcast-common-v<x>` and
      # let it go LIVE before pushing this `v<y>` tag: dvb-* here require it
      # from crates.io, not by path, at publish time.
      #
      # Dependency order (topological) for the five that remain:
      # dvb-si and dvb-bbframe each depend on broadcast-common (already live).
      # dvb-t2mi depends on broadcast-common AND (optionally, ts-gated) dvb-bbframe,
      # so it must publish after dvb-bbframe is on the index.
      # dvb-tools depends on both dvb-si (ts + serde + chrono) and dvb-t2mi (ts),
      # so it publishes LAST. Hence:
      #   bbframe → si → conformance → t2mi → tools.
      # `broadcast-common` is NOT gated or published here. It was ejected from
      # the lockstep in #862 and ships from its own `broadcast-common-v*` tag.
      # Its pre-rename versions (1.0.0-8.1.0) are on crates.io under the old
      # name `dvb-common` and stay there, live and unyanked — that is history,
      # not a shim: this project publishes no re-export shims, and a rename
      # here normally yanks the old name so a stale dependency fails loudly
      # rather than silently resolving to a frozen copy. The same is true of
      # dvb-scte35, dvb-pes, dvb-cc, dvb-ule and dvb-emsg. None of them is a
      # workspace member; none of those directories exists.
      # The index can lag a few seconds after a publish; `cargo publish` blocks
      # until the published crate is available since Cargo 1.66, so no manual
      # sleep is needed.
      #
      # Each step is idempotent: `publish_crate` treats an "already uploaded"
      # / "crate version already exists" error as success, so re-running the
      # workflow after a partial publish skips the crates that already shipped
      # and only publishes the missing ones.

      # docs/RELEASE-DOCS.md requires a release note per tag, and this workflow
      # uses it as the GitHub Release body — so a missing one is caught HERE,
      # before any of the five crates reaches crates.io, rather than after five
      # versions are already immutable.
      - name: Gate — release note exists for this version
        run: |
          NOTE="docs/release-notes/${GITHUB_REF_NAME}.md"
          if [ ! -s "$NOTE" ]; then
            echo "::error::$NOTE is missing or empty — see docs/RELEASE-DOCS.md"
            exit 1
          fi
          echo "::notice::release note $NOTE present"

      - name: Publish crates
        run: |
          publish_crate() {
            local crate="$1"
            local out
            if out=$(cargo publish -p "$crate" --locked 2>&1); then
              echo "$out"
              echo "::notice::published $crate"
              return 0
            fi
            echo "$out"
            if echo "$out" | grep -qiE "already (been )?uploaded|already exists"; then
              echo "::notice::$crate already on crates.io at this version — skipping"
              return 0
            fi
            echo "::error::failed to publish $crate"
            return 1
          }
          publish_crate dvb-bbframe
          publish_crate dvb-si
          publish_crate dvb-conformance
          publish_crate dvb-t2mi
          publish_crate dvb-tools
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      # docs/RELEASE-DOCS.md section 3: a GitHub Release per tag, body = the
      # release note. This was a manual step for the first 191 releases and was
      # missed for 102 tags, so it is automated. One Release for the lockstep
      # tag, covering all five crates. Idempotent: an existing release is left
      # untouched, so re-running after a partial publish is safe.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::notice::GitHub Release $GITHUB_REF_NAME already exists — leaving it alone"
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "DVB lockstep ${GITHUB_REF_NAME#v}" \
              --notes-file "docs/release-notes/${GITHUB_REF_NAME}.md"
            echo "::notice::created GitHub Release $GITHUB_REF_NAME"
          fi

  # dvb-tools is the family's CLI analyzer and has no lane of its own — it ships
  # from this lockstep tag. Its compiled binaries attach to the same Release.
  # It is also the one crate here docs.rs cannot document (no library target),
  # so the binary IS its deliverable.
  binaries:
    needs: publish
    uses: ./.github/workflows/reusable-binaries.yml
    with:
      crate: dvb-tools
      bin: dvb-tools
