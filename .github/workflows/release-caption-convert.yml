name: Release caption-convert

# Publishes the caption-convert crate to crates.io on a `caption-convert-v*`
# tag. caption-convert is versioned and released INDEPENDENTLY (standalone
# integration crate with its own cadence). CI is the only source of published
# artifacts — never `cargo publish` from a workstation. Requires the
# CARGO_REGISTRY_TOKEN secret.
#
# DEPENDENCY ORDER: caption-convert depends on broadcast-common (lockstep,
# already live), timed-metadata (>= 0.4.2, already live), and — only under
# its optional `cc-data`/`teletext` features — cc-data (>= 0.4, already live)
# and dvb-vbi (>= 0.3, already live). No new crate needs to land before this
# one.

on:
  push:
    tags: ["caption-convert-v*"]

jobs:
  publish:
    permissions:
      contents: write
    uses: ./.github/workflows/publish-crate.yml
    secrets: inherit
    with:
      crate: caption-convert
