name: Release caption-convert

# Publishes the caption-convert crate to crates.io on a `caption-convert-v*`
# tag. caption-convert is versioned and released INDEPENDENTLY (standalone
# integration crate with its own cadence). CI is the only source of published
# artifacts — never `cargo publish` from a workstation. Requires the
# CARGO_REGISTRY_TOKEN secret.
#
# DEPENDENCY ORDER: caption-convert depends on broadcast-common (lockstep,
# already live), timed-metadata (>= 0.4.2, already live), and — only under
# its optional `cc-data`/`teletext` features — cc-data (>= 0.4, already live)
# and dvb-vbi (>= 0.3, already live). No new crate needs to land before this
# one.

on:
  push:
    tags: ["caption-convert-v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: publish caption-convert to crates.io
    runs-on: ubuntu-latest
    # crates.io publish is gated: pauses for manual approval by a
    # required reviewer before any cargo publish can run. See the
    # 'crates-io' environment (repo Settings -> Environments).
    environment: crates-io
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2

      - name: Gate — caption-convert tests (all features)
        run: cargo test -p caption-convert --all-features --locked

      - name: Gate — caption-convert clippy
        run: cargo clippy -p caption-convert --all-features --all-targets --locked -- -D warnings

      - name: Gate — caption-convert no_std build
        run: cargo build -p caption-convert --no-default-features --target thumbv7em-none-eabi --locked

      - name: Gate — caption-convert examples build
        run: cargo build -p caption-convert --all-features --examples --locked

      - name: Gate — tag matches caption-convert version
        run: |
          TAG="${GITHUB_REF_NAME#caption-convert-v}"
          V=$(cargo metadata --no-deps --format-version 1 --locked \
              | python3 -c "import json,sys; print({p['name']: p['version'] for p in json.load(sys.stdin)['packages']}['caption-convert'])")
          if [ "$V" != "$TAG" ]; then
            echo "::error::caption-convert is $V but tag is $TAG"; exit 1
          fi

      # Idempotent: an "already uploaded" error is treated as success.
      - name: Publish caption-convert
        run: |
          if out=$(cargo publish -p caption-convert --locked 2>&1); then
            echo "$out"; echo "::notice::published caption-convert"
          elif echo "$out" | grep -qiE "already (been )?uploaded|already exists"; then
            echo "$out"; echo "::notice::caption-convert already on crates.io at this version — skipping"
          else
            echo "$out"; echo "::error::failed to publish caption-convert"; exit 1
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
