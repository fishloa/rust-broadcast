name: Release dvb-vbi

# Publishes the dvb-vbi crate to crates.io on a `dvb-vbi-v*` tag.
# dvb-vbi is versioned and released INDEPENDENTLY of the lockstep `v*` tag
# (it is a standalone reusable crate with its own cadence), so it has its own
# publish workflow. CI is the only source of published artifacts — never
# `cargo publish` from a workstation. Requires the CARGO_REGISTRY_TOKEN secret.

on:
  push:
    tags: ["dvb-vbi-v*"]

jobs:
  publish:
    permissions:
      contents: write
    uses: ./.github/workflows/publish-crate.yml
    secrets: inherit
    with:
      crate: dvb-vbi
