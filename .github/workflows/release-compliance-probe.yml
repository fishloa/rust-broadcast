name: Release compliance-probe

# Publishes the compliance-probe crate to crates.io on a `compliance-probe-v*`
# tag. compliance-probe is versioned and released INDEPENDENTLY (standalone
# integration crate with its own cadence). CI is the only source of published
# artifacts — never `cargo publish` from a workstation. Requires the
# CARGO_REGISTRY_TOKEN secret.
#
# DEPENDENCY ORDER: compliance-probe depends on broadcast-common/
# dvb-conformance (lockstep, already live), mpeg-ts (>= 0.3.1, already live),
# scte35-splice (>= 2, already live), timed-metadata (>= 0.4.2, already
# live), media-plane (>= 0.3, already live), and media-doctor (>= 0.8 — see
# release-media-doctor.yml, MUST have a published version >= 0.8 before this
# tag is pushed).

on:
  push:
    tags: ["compliance-probe-v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: publish compliance-probe to crates.io
    runs-on: ubuntu-latest
    # crates.io publish is gated: pauses for manual approval by a
    # required reviewer before any cargo publish can run. See the
    # 'crates-io' environment (repo Settings -> Environments).
    environment: crates-io
    # `contents: write` is needed to create the GitHub Release below, and is
    # the only elevated permission this job holds — `cargo publish`
    # authenticates with CARGO_REGISTRY_TOKEN, not the GitHub token.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2

      - name: Gate — compliance-probe tests (all features)
        run: cargo test -p compliance-probe --all-features --locked

      - name: Gate — compliance-probe clippy
        run: cargo clippy -p compliance-probe --all-features --all-targets --locked -- -D warnings

      - name: Gate — compliance-probe no_std build
        run: cargo build -p compliance-probe --no-default-features --target thumbv7em-none-eabi --locked

      - name: Gate — compliance-probe examples build
        run: cargo build -p compliance-probe --all-features --examples --locked

      - name: Gate — tag matches compliance-probe version
        run: |
          TAG="${GITHUB_REF_NAME#compliance-probe-v}"
          V=$(cargo metadata --no-deps --format-version 1 --locked \
              | python3 -c "import json,sys; print({p['name']: p['version'] for p in json.load(sys.stdin)['packages']}['compliance-probe'])")
          if [ "$V" != "$TAG" ]; then
            echo "::error::compliance-probe is $V but tag is $TAG"; exit 1
          fi

      # compliance-probe's media-doctor dependency must already be on
      # crates.io at >= 0.8. Idempotent: an "already uploaded" error is
      # treated as success.
      # docs/RELEASE-DOCS.md requires a release note per tag, and this workflow
      # uses it as the GitHub Release body — so a missing one is caught HERE,
      # before anything reaches crates.io, rather than after the version is
      # already immutable.
      - name: Gate — release note exists for this version
        run: |
          NOTE="docs/release-notes/compliance-probe-${GITHUB_REF_NAME#compliance-probe-v}.md"
          if [ ! -s "$NOTE" ]; then
            echo "::error::$NOTE is missing or empty — see docs/RELEASE-DOCS.md"
            exit 1
          fi
          echo "::notice::release note $NOTE present"

      - name: Publish compliance-probe
        run: |
          if out=$(cargo publish -p compliance-probe --locked 2>&1); then
            echo "$out"; echo "::notice::published compliance-probe"
          elif echo "$out" | grep -qiE "already (been )?uploaded|already exists"; then
            echo "$out"; echo "::notice::compliance-probe already on crates.io at this version — skipping"
          else
            echo "$out"; echo "::error::failed to publish compliance-probe"; exit 1
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      # docs/RELEASE-DOCS.md section 3: a GitHub Release per tag, body = the
      # release note. This was a manual step for the first 191 releases and was
      # missed for 102 tags, so it is automated. Idempotent: an existing
      # release is left untouched, so re-running after a partial failure is
      # safe.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${GITHUB_REF_NAME#compliance-probe-v}"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::notice::GitHub Release $GITHUB_REF_NAME already exists — leaving it alone"
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "compliance-probe $V" \
              --notes-file "docs/release-notes/compliance-probe-$V.md"
            echo "::notice::created GitHub Release $GITHUB_REF_NAME"
          fi
