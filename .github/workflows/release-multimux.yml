name: Release multimux

# Publishes the multimux crate to crates.io on a `multimux-v*` tag.
# multimux is versioned and released INDEPENDENTLY. CI is the only source of
# published artifacts — never `cargo publish` from a workstation. Requires the
# CARGO_REGISTRY_TOKEN secret.
#
# DEPENDENCY ORDER: multimux depends on transmux, rtsp-runtime, hls-runtime,
# and broadcast-auth (plus the published sdp-types / url / axum / tokio).
# Publish in order: broadcast-auth -> transmux (>= the referenced 0.18) ->
# rtsp-runtime (>= 0.3) -> hls-runtime (>= 0.1) -> multimux, or crates.io
# will reject the publish because a required dependency is not yet live.
#
# multimux is a std (tokio + axum) application crate — no no_std gate.

on:
  push:
    tags: ["multimux-v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: publish multimux to crates.io
    runs-on: ubuntu-latest
    # crates.io publish is gated: pauses for manual approval by a
    # required reviewer before any cargo publish can run. See the
    # 'crates-io' environment (repo Settings -> Environments).
    environment: crates-io
    # `contents: write` is needed to create the GitHub Release below, and is
    # the only elevated permission this job holds — `cargo publish`
    # authenticates with CARGO_REGISTRY_TOKEN, not the GitHub token.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2

      - name: Gate — multimux tests
        run: cargo test -p multimux --all-features --locked

      - name: Gate — multimux clippy
        run: cargo clippy -p multimux --all-features --all-targets --locked -- -D warnings

      - name: Gate — multimux examples build
        run: cargo build -p multimux --all-features --examples --locked

      - name: Gate — multimux no-default-features build
        run: cargo build -p multimux --no-default-features --locked

      - name: Gate — tag matches multimux version
        run: |
          TAG="${GITHUB_REF_NAME#multimux-v}"
          V=$(cargo metadata --no-deps --format-version 1 --locked \
              | python3 -c "import json,sys; print({p['name']: p['version'] for p in json.load(sys.stdin)['packages']}['multimux'])")
          if [ "$V" != "$TAG" ]; then
            echo "::error::multimux is $V but tag is $TAG"; exit 1
          fi

      # docs/RELEASE-DOCS.md requires a release note per tag, and this workflow
      # uses it as the GitHub Release body — so a missing one is caught HERE,
      # before anything reaches crates.io, rather than after the version is
      # already immutable.
      - name: Gate — release note exists for this version
        run: |
          NOTE="docs/release-notes/multimux-${GITHUB_REF_NAME#multimux-v}.md"
          if [ ! -s "$NOTE" ]; then
            echo "::error::$NOTE is missing or empty — see docs/RELEASE-DOCS.md"
            exit 1
          fi
          echo "::notice::release note $NOTE present"

      - name: Publish multimux
        run: |
          if out=$(cargo publish -p multimux --locked 2>&1); then
            echo "$out"; echo "::notice::published multimux"
          elif echo "$out" | grep -qiE "already (been )?uploaded|already exists"; then
            echo "$out"; echo "::notice::multimux already on crates.io at this version — skipping"
          else
            echo "$out"; echo "::error::failed to publish multimux"; exit 1
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      # docs/RELEASE-DOCS.md section 3: a GitHub Release per tag, body = the
      # release note. This was a manual step for the first 191 releases and was
      # missed for 102 tags, so it is automated. Idempotent: an existing
      # release is left untouched, so re-running after a partial failure is
      # safe.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${GITHUB_REF_NAME#multimux-v}"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::notice::GitHub Release $GITHUB_REF_NAME already exists — leaving it alone"
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "multimux $V" \
              --notes-file "docs/release-notes/multimux-$V.md"
            echo "::notice::created GitHub Release $GITHUB_REF_NAME"
          fi
