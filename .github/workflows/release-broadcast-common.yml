name: Release broadcast-common

# Publishes the broadcast-common crate to crates.io on a `broadcast-common-v*`
# tag. CI is the only source of published artifacts — never `cargo publish`
# from a workstation. Requires the CARGO_REGISTRY_TOKEN secret.
#
# WHY THIS LANE EXISTS. broadcast-common used to be the sixth member of the
# DVB lockstep, so it published from the `v*` tag alongside dvb-si and friends.
# That forced its version to track dvb-si's even when broadcast-common itself
# had not changed: 9.0.0 was PURELY ADDITIVE (it added `mux.rs` and `stage.rs`
# and two `pub use` lines; the only deletions in the whole crate were two lines
# of doc comment) and should have been 8.2.0. It majored because a lockstep
# sibling broke.
#
# broadcast-common has a fan-in of 35 — only five of which are lockstep
# members — so an inherited major forced a migration on thirty crates that had
# no reason to move, and manufactured the broadcast-common 8/9 boundary behind
# issues #819, #824 and #858. Versioning it on its own API changes is what this
# lane is for.
#
# DEPENDENCY ORDER: broadcast-common has NO workspace dependencies, so it is
# always publishable on its own and must go FIRST in any wave that also moves
# crates depending on it. If a release moves both broadcast-common and the
# lockstep five, push `broadcast-common-v<x>` and let it go live BEFORE pushing
# the `v<y>` lockstep tag.

on:
  push:
    tags: ["broadcast-common-v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: publish broadcast-common to crates.io
    runs-on: ubuntu-latest
    # crates.io publish is gated: pauses for manual approval by a
    # required reviewer before any cargo publish can run. See the
    # 'crates-io' environment (repo Settings -> Environments).
    environment: crates-io
    # `contents: write` is needed to create the GitHub Release below, and is
    # the only elevated permission this job holds — `cargo publish`
    # authenticates with CARGO_REGISTRY_TOKEN, not the GitHub token.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2

      - name: Gate — broadcast-common tests (all features)
        run: cargo test -p broadcast-common --all-features --locked

      - name: Gate — broadcast-common clippy
        run: cargo clippy -p broadcast-common --all-features --all-targets --locked -- -D warnings

      - name: Gate — broadcast-common no_std (no-default-features) build
        run: cargo build -p broadcast-common --no-default-features --locked

      - name: Gate — broadcast-common examples build
        run: cargo build -p broadcast-common --all-features --examples --locked

      - name: Gate — tag matches broadcast-common version
        run: |
          TAG="${GITHUB_REF_NAME#broadcast-common-v}"
          V=$(cargo metadata --no-deps --format-version 1 --locked \
              | python3 -c "import json,sys; print({p['name']: p['version'] for p in json.load(sys.stdin)['packages']}['broadcast-common'])")
          if [ "$V" != "$TAG" ]; then
            echo "::error::broadcast-common is $V but tag is $TAG"; exit 1
          fi

      # docs/RELEASE-DOCS.md requires a release note per tag, and this workflow
      # uses it as the GitHub Release body — so a missing one is caught HERE,
      # before anything reaches crates.io, rather than after the version is
      # already immutable.
      - name: Gate — release note exists for this version
        run: |
          NOTE="docs/release-notes/broadcast-common-${GITHUB_REF_NAME#broadcast-common-v}.md"
          if [ ! -s "$NOTE" ]; then
            echo "::error::$NOTE is missing or empty — see docs/RELEASE-DOCS.md"
            exit 1
          fi
          echo "::notice::release note $NOTE present"

      - name: Publish broadcast-common
        run: |
          if out=$(cargo publish -p broadcast-common --locked 2>&1); then
            echo "$out"; echo "::notice::published broadcast-common"
          elif echo "$out" | grep -qiE "already (been )?uploaded|already exists"; then
            echo "$out"; echo "::notice::broadcast-common already on crates.io at this version — skipping"
          else
            echo "$out"; echo "::error::failed to publish broadcast-common"; exit 1
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      # docs/RELEASE-DOCS.md section 3: a GitHub Release per tag, body = the
      # release note. This was a manual step for the first 191 releases and was
      # missed for 102 tags, so it is automated. Idempotent: an existing
      # release is left untouched, so re-running after a partial failure is
      # safe.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${GITHUB_REF_NAME#broadcast-common-v}"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::notice::GitHub Release $GITHUB_REF_NAME already exists — leaving it alone"
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "broadcast-common $V" \
              --notes-file "docs/release-notes/broadcast-common-$V.md"
            echo "::notice::created GitHub Release $GITHUB_REF_NAME"
          fi
