name: Release hls-runtime

# Publishes the hls-runtime crate to crates.io on a `hls-runtime-v*` tag.
# hls-runtime is versioned and released INDEPENDENTLY (standalone integration
# crate with its own cadence). CI is the only source of published artifacts —
# never `cargo publish` from a workstation. Requires the CARGO_REGISTRY_TOKEN
# secret.
#
# DEPENDENCY ORDER: hls-runtime depends on broadcast-common (lockstep,
# already live) and transmux (>= 0.21, already live), and — only under its
# `std` feature — media-plane (>= 0.1.1, already live), and — only under its
# `tokio` feature — broadcast-auth (>= 0.2, already live). No new crate needs
# to land before this one. Downstream, multimux depends on hls-runtime — this
# must land before that.

on:
  push:
    tags: ["hls-runtime-v*"]

jobs:
  publish:
    permissions:
      contents: write
    uses: ./.github/workflows/publish-crate.yml
    secrets: inherit
    with:
      crate: hls-runtime
      build-gate: no-default
