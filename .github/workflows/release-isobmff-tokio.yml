name: Release isobmff-tokio

# Publishes the isobmff-tokio crate to crates.io on an `isobmff-tokio-v*` tag.
# isobmff-tokio is versioned and released INDEPENDENTLY of the DVB lockstep:
# it is the async driver over isobmff's sans-IO reader, with its own API
# surface and cadence. It is unpublished until a release is approved. CI is the
# only source of published artifacts — never `cargo publish` from a
# workstation. Requires the CARGO_REGISTRY_TOKEN secret.
#
# DEPENDENCY ORDER: isobmff-tokio depends on isobmff and tokio only, so both
# must already be live.

on:
  push:
    tags: ["isobmff-tokio-v*"]

jobs:
  publish:
    permissions:
      contents: write
    uses: ./.github/workflows/publish-crate.yml
    secrets: inherit
    with:
      crate: isobmff-tokio
      build-gate: no-default
