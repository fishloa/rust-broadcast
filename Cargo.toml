[workspace]
members = ["broadcast-common", "broadcast-auth", "dvb-si", "dvb-t2mi", "dvb-bbframe", "dvb-conformance", "dvb-tools", "media-doctor", "multimux", "multimux-cli", "scte35-splice", "dvb-stream", "mpeg-pes", "dvb-subtitle", "mpeg-ps", "scte104", "cc-data", "dvb-ci", "st291", "ule", "dvb-simulcrypt", "mp4-emsg", "dvb-vbi", "dvb-flute", "dvb-ci-runtime", "timed-metadata", "mpeg-ts", "ts-fix", "transmux", "rtsp-runtime", "rtmp-runtime", "srt-runtime", "rtp-packet", "rtcp-packet", "st12-1", "st337", "rdd29", "st377-1", "hls-runtime", "media-plane", "ttml-subtitle", "broadcast-hls", "broadcast-loudness", "dvb-csa", "dvb-mabr"]
