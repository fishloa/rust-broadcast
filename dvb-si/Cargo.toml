[package]
name         = "dvb-si"
version      = "14.0.0"
edition      = "2024"
description  = "ETSI EN 300 468 DVB Service Information parser + builder. MPEG-2 PSI included."
license      = "MIT OR Apache-2.0"
authors      = ["Alex Fishlock <alex.fishlock@racingjag.com>"]
keywords     = ["dvb", "mpeg", "broadcast", "si", "psi"]
categories   = ["parser-implementations", "multimedia"]
repository   = "https://github.com/fishloa/rust-broadcast"
readme       = "README.md"
rust-version.workspace = true
exclude      = ["docs/**"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
[dependencies]
broadcast-common  = { path = "../broadcast-common", version = "12.0.0", default-features = false }
mpeg-ts     = { path = "../mpeg-ts",    version = "0.8.0", default-features = false }
thiserror = { version = "2", default-features = false }
num_enum = { workspace = true }
chrono      = { workspace = true, optional = true, features = ["alloc"] }
serde         = { version = "1", default-features = false, optional = true, features = ["derive", "alloc"] }
bytes         = { version = "1", optional = true, default-features = false }
yoke          = { workspace = true, optional = true, features = ["derive"] }
flate2        = { version = "1", optional = true }
encoding_rs = { version = "0.8", optional = true }

[dev-dependencies]
test-fixtures = { path = "../test-fixtures" }
# Counting/capping test allocator (path-only, publish = false; never published).
test-alloc = { path = "../test-alloc" }
quick-xml = { workspace = true }
serde_json = { workspace = true }
criterion  = { workspace = true, features = ["html_reports"] }
# Oracle for the tabulated ISO 8859 parts (`text::iso8859` tests).
encoding_rs = { version = "0.8" }

[[bench]]
name     = "si_hot_paths"
harness  = false
required-features = ["ts"]

[features]
default = ["std", "chrono", "ts", "legacy-charsets"]

# `std` links the standard library. Without it the crate is `#![no_std]` and
# needs only `alloc`. chrono's wall-clock and the std `Error` glue are std-only.
std      = ["broadcast-common/std", "chrono?/std", "chrono?/clock", "thiserror/std", "num_enum/std", "bytes?/std", "mpeg-ts/std", "serde?/std"]

# EN 300 468 Annex A KS X 1001 / GB-2312 / Big5 text (selectors 0x12-0x14),
# decoded with `encoding_rs`'s codec tables. Off = those three selectors are
# `Error::CharsetNotEnabled` from `try_decode` (U+FFFD from `decode`); every
# other Annex A charset, ISO 8859 included, decodes without it.
legacy-charsets = ["std", "dep:encoding_rs"]

# Date/time decoding (MJD + BCD -> chrono DateTime<Utc>). Off = raw bytes returned.
chrono   = ["dep:chrono", "broadcast-common/chrono"]

# MPEG-TS packet + SectionReassembler helpers. Off = bring-your-own section bytes.
ts       = ["dep:bytes"]

# JSON / generic serialization on parsed + owned variants. Propagates to chrono.
serde    = ["dep:serde", "broadcast-common/serde", "chrono?/serde", "mpeg-ts/serde"]

# Yokeable impls on the zero-copy view types + the `Owned<T>` wrapper, so a
# parsed table/descriptor can be retained past the input buffer's borrow
# (store/cache/send across threads) without re-parsing or a mirror type.
yoke     = ["dep:yoke"]

# zlib decompression of compressed_module_descriptor (BIOP module carousels).
# Off by default; without it the compressed module bytes are exposed raw.
# flate2 requires std (it uses std::io internally).
flate2   = ["dep:flate2", "std"]

[[example]]
name              = "list_services"
required-features = ["ts"]

[lints]
workspace = true
