[package]
name                    = "atsc3-route"
version                 = "0.1.0"
description             = "ATSC A/331 Annex A ROUTE binary framing: EXT_ROUTE_PRESENTATION_TIME / EXT_TOL LCT header extensions, source/repair FEC Payload ID layouts, and the Codepoint (CP) delivery-object semantics table. Built on rmt-flute's LCT/ALC/FLUTE; no XML/S-TSID/SLS."
authors.workspace       = true
edition.workspace       = true
license.workspace       = true
repository.workspace    = true
rust-version.workspace  = true
categories = ["parser-implementations", "multimedia", "no-std"]
keywords   = ["atsc3", "route", "flute", "broadcast", "no-std"]
readme     = "README.md"
exclude    = ["docs/**"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
broadcast-common = { path = "../broadcast-common", version = "9",   default-features = false }
rmt-flute         = { path = "../rmt-flute",         version = "0.4", default-features = false }
thiserror         = { version = "2", default-features = false }
serde             = { version = "1", optional = true, features = ["derive"] }

[dev-dependencies]
serde_json = "1.0"

[features]
default = ["std"]
# `std` links the standard library. Without it the crate is `#![no_std]` and
# needs only `alloc`.
std = ["broadcast-common/std", "rmt-flute/std", "thiserror/std"]
serde = ["dep:serde", "rmt-flute/serde"]

[[example]]
name = "parse_route_fdt"

[[example]]
name = "build_route_media_fragment"
