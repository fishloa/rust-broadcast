[package]
name = "test-fixtures"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
description = "Workspace fixture loader shared by test suites (unpublished)."

[lints]
workspace = true

[dependencies]
# The MSB-first bit writer (`bits::BitWriter`) the H.264/HEVC test suites build
# RBSP bytes with: it sits on the workspace bit buffer, not a second one.
broadcast-core = { path = "../broadcast-core", default-features = false }
hex = "0.4"
wait-timeout = "0.2"
tokio = { version = "1", default-features = false, features = ["rt", "time", "net"] }
serde_json = { workspace = true }
headers = { workspace = true }
http = { workspace = true }
