[workspace]

[package]
name = "codec-symphonia"
version = "0.0.0"
edition = "2024"
publish = false
description = "Codec-seam spike: a symphonia AAC decoder behind broadcast-codec::Decoder."

[dependencies]
broadcast-codec = { path = "../../broadcast-codec" }
broadcast-loudness = { path = "../../broadcast-loudness" }
symphonia = { version = "0.6", default-features = false, features = ["aac"] }

[dev-dependencies]
test-fixtures = { path = "../../test-fixtures" }

[lints.rust]
unsafe_code = "deny"
