[package]
name    = "tshttp-runtime"
version = "0.1.0"
edition = "2024"
description = "Sans-IO TS-over-HTTP pull session client: bytes-in, actions-out state machine over a StreamingTsDemux."
license      = "MIT OR Apache-2.0"
authors      = ["Alex Fishlock <alex.fishlock@racingjag.com>"]
keywords = ["mpeg-ts", "http", "live", "streaming", "no-std"]
categories = ["multimedia", "no-std", "network-programming"]
repository   = "https://github.com/fishloa/rust-broadcast"
readme       = "README.md"
rust-version.workspace = true
exclude = ["fuzz/**"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
broadcast-common = { path = "../broadcast-common", version = "10.0", default-features = false }
transmux        = { path = "../transmux", version = "0.28", default-features = false }
serde           = { version = "1", default-features = false, optional = true, features = ["derive", "alloc"] }

[dev-dependencies]
test-fixtures = { path = "../test-fixtures" }
transmux = { path = "../transmux", default-features = false }
serde_json    = { workspace = true }

[features]
default = ["std"]
std = ["broadcast-common/std", "transmux/std", "serde?/std"]
serde = ["dep:serde", "broadcast-common/serde", "transmux/serde"]

[[example]]
name = "live_loop"

[[example]]
name = "stall_demo"

[lints]
workspace = true
