[package]
name    = "ttml-subtitle"
version = "0.2.1"
edition = "2024"
description = "TTML2 / IMSC 1.1 timed-text subtitle parser — W3C TTML2 + IMSC 1.1 profile validation."
license      = "MIT OR Apache-2.0"
authors      = ["Alex Fishlock <alex.fishlock@racingjag.com>"]
keywords = ["ttml", "imsc", "subtitle", "timed-text", "broadcast"]
categories = ["parser-implementations", "multimedia"]
repository   = "https://github.com/fishloa/rust-broadcast"
readme       = "README.md"
rust-version.workspace = true
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
broadcast-common = { path = "../broadcast-common", version = "9.3", default-features = false }
# XML codec: the only XML dependency of the crates that read or write XML (transmux,
# dvb-mabr, ttml-subtitle, multimux). std-only (quick-xml needs std).
quick-xml = { version = "0.42", default-features = false, optional = true }
thiserror  = { version = "2", default-features = false }
serde      = { version = "1", optional = true, features = ["derive"] }

[dev-dependencies]
serde_json = "1.0"

[[example]]
name = "from_scratch"
required-features = ["std"]

[[example]]
name = "parse_document"
required-features = ["std"]

[[example]]
name = "validate_document"
required-features = ["std"]

[features]
default = ["std"]
std = ["broadcast-common/std", "thiserror/std", "dep:quick-xml"]
serde = ["dep:serde"]
