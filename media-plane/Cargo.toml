[package]
name         = "media-plane"
version      = "0.1.2"
edition      = "2024"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/fishloa/rust-broadcast"
rust-version = "1.86"
description  = "The ingress/egress spine for a live media origin: Dialer/Listener -> byte stages -> IngestSession -> Trunk (bounded sample/segment/event/part rings with cursor subscribers), three egress shapes (served/push/segment), and tiered retention with DVR pinning. Built on broadcast_common::Stage. no_std + alloc byte layer; Trunk and above require std."
keywords     = ["streaming", "ingest", "no-std", "media"]
categories   = ["multimedia", "no-std"]
readme       = "README.md"

[dependencies]
broadcast-common = { path = "../broadcast-common", version = "9.0", default-features = false }
bytes            = { version = "1", default-features = false }
thiserror        = { version = "2", default-features = false }
transmux         = { path = "../transmux", version = "0.22", default-features = false, optional = true }
timed-metadata   = { path = "../timed-metadata", version = "0.4.1", default-features = false, optional = true }
# Only pulled in by the `std` feature: `Trunk`'s reader-wake primitive
# (step 3b-iv) needs a runtime-agnostic wakeup a `ServedEgress` can wait on
# without busy-polling — NOT `tokio::sync::watch`, so it works under any
# executor (or none, via its blocking `.wait_deadline()`). Same crate,
# same version, same feature set `hls-runtime::server::MediaStore`
# already depends on (see its Cargo.toml) — reusing the primitive the
# consumer already uses, not hand-rolling a parallel one.
event-listener   = { version = "5", default-features = false, features = ["std"], optional = true }

[dev-dependencies]
# Builds real, valid (Parse/Serialize round-tripping) SCTE-35 splice_insert()
# fixtures in-test, to drive `timed_metadata::Timeline`'s 33-bit PTS
# wrap-unroll across a genuine wrap boundary — see the event-log wrap test in
# `src/trunk.rs`. Test-only: the library itself depends only on `timed-metadata`.
scte35-splice = { path = "../scte35-splice", version = "2", default-features = false }

[features]
default = ["std"]
std     = ["broadcast-common/std", "thiserror/std", "dep:transmux", "dep:timed-metadata", "dep:event-listener"]

[package.metadata.docs.rs]
# `all-features = true` alone is not enough here: this crate's `std` feature
# is not just additive API, it gates four of the seven top-level modules
# (`egress`/`ingress`/`retention`/`trunk`, plus their re-exports) — see the
# crate-root docs' "no_std note" for why `Trunk` needs `std::sync::Mutex`.
# `rustdoc-args = ["--cfg", "docsrs"]` (+ `#![cfg_attr(docsrs, ...)]` in
# `src/lib.rs`) turns those `#[cfg(feature = "std")]` items into visible
# doc(cfg) pills instead of vanishing silently, matching `rtmp-runtime`'s
# and `mpeg-pes`'s docs.rs setup for the same std-gated-module shape.
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[[example]]
name = "ingest_trunk_playback"
required-features = ["std"]
