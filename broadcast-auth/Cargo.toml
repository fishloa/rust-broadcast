[package]
name         = "broadcast-auth"
version      = "0.4.0"
edition      = "2024"
description  = "Shared multi-scheme HTTP/RTSP auth: Basic/Digest (RFC 7235, RFC 2326 §14) via http-auth, Bearer (RFC 6750); one Credentials model + challenge->response helper for rtsp-runtime and multimux's HTTP clients."
license      = "MIT OR Apache-2.0"
authors      = ["Alex Fishlock <alex.fishlock@racingjag.com>"]
keywords     = ["auth", "http-auth", "digest", "basic-auth", "bearer"]
categories   = ["network-programming", "authentication"]
repository   = "https://github.com/fishloa/rust-broadcast"
readme       = "README.md"
rust-version.workspace = true
exclude      = ["docs/**"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
http-auth = { version = "0.1", default-features = false, features = ["basic-scheme", "digest-scheme"] }
thiserror = "2"
# Server-side (`server::Verifier`) challenge/verify: decoding a client's
# Basic `Authorization` header (`base64`), recomputing a Digest response
# (`md-5`) to verify against, and generating a fresh server nonce (`rand`).
base64    = "0.23"
md-5      = "0.11"
rand      = "0.8"
# Signed-URL scheme (`signed_url::SignedUrlKeySet`, issue #747): HMAC-SHA256
# over the canonical `path\nexp\nip` string. `hmac`/`sha2` are already
# also used by `srt-runtime`'s `crypto` feature (same RustCrypto generation);
# `subtle::ConstantTimeEq` is the constant-time signature compare (see
# the module docs — never a hand-rolled short-circuiting `==`).
hmac      = { version = "0.13", default-features = false }
sha2      = { version = "0.11", default-features = false }
subtle    = { version = "2", default-features = false }
# Typed `Authorization` (Basic/Bearer, token68 schemes `http-auth` cannot parse; SP2.4).
headers   = "0.4"
# Digest `username*` (RFC 7616 §3.4.4 / RFC 8187 ext-value) percent-decoding.
percent-encoding = "2"
# Digest `uri` substitution guard (`server::digest_uri_matches`, SP2.4): normalised-spelling check.
url       = "2"
# Digest nonce-count table (`server::DigestNonces`): least-recently-used order (SP2.4).
lru       = "0.18"
# Signed-URL query encode/parse (`signed_url`, defect 6): `application/x-www-form-urlencoded`.
form_urlencoded = "1"
# Digest nonce codec (SP5).
hex       = { version = "0.4", default-features = false, features = ["alloc"] }

[dev-dependencies]
