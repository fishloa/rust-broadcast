[package]
name         = "ts-fix"
version      = "0.5.0"
edition      = "2024"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/fishloa/rust-broadcast"
rust-version.workspace = true
description  = "MPEG-2 TS repair / remux — continuity, PID filter, PAT/PMT regen, stuffing, PCR restamp (ISO/IEC 13818-1)."
keywords     = ["mpeg-ts", "transport-stream", "repair", "remux", "dvb"]
categories   = ["parser-implementations", "multimedia::video"]
exclude      = ["tests/fixtures/**"]
readme       = "README.md"

[dependencies]
broadcast-common = { path = "../broadcast-common", version = "9.3", default-features = false }
mpeg-ts   = { path = "../mpeg-ts",  version = "0.4", default-features = false }
mpeg-pes  = { path = "../mpeg-pes", version = "0.4", default-features = false }
dvb-si    = { path = "../dvb-si",   version = "10",   default-features = false }
dvb-conformance = { path = "../dvb-conformance", version = "10", default-features = false }
thiserror = { version = "2",        default-features = false }
# Only the `ts-fix` binary uses clap; the library uses no `std` path at all.
# Unconditional, it made `#![no_std]` unreachable — the crate root carried the
# `cfg_attr` but no build could ever satisfy it, because clap dragged in
# `anstyle`/`std` regardless of features. Gated, the library is genuinely
# bare-metal-buildable and the CI no_std lane proves it.
clap      = { version = "4.5",      features = ["derive"], optional = true }

[features]
default = ["std", "cli"]
std     = ["broadcast-common/std", "mpeg-ts/std", "mpeg-pes/std", "dvb-si/std", "dvb-conformance/std", "thiserror/std"]
# The `ts-fix` binary. On by default so `cargo install ts-fix` keeps working.
cli     = ["std", "dep:clap"]

[[bin]]
name = "ts-fix"
path = "src/bin/ts-fix.rs"
required-features = ["cli"]

[dev-dependencies]
scte35-splice = { path = "../scte35-splice", version = "2.1", default-features = false }

[package.metadata.docs.rs]
all-features = true
features = ["std"]
