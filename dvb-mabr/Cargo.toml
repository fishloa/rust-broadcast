[package]
name          = "dvb-mabr"
version       = "0.3.0"
edition       = "2024"
rust-version.workspace = true
license       = "MIT OR Apache-2.0"
description   = "DVB multicast ABR (ETSI TS 103 769) session configuration XML parser/serializer"
authors       = ["Alex Fishlock <alex.fishlock@racingjag.com>"]
repository    = "https://github.com/fishloa/rust-broadcast"
readme        = "README.md"
keywords      = ["dvb", "mabr", "multicast", "abr", "xml"]
categories    = ["parser-implementations", "multimedia::video"]
exclude       = ["docs/**"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
broadcast-common = { path = "../broadcast-common", version = "10.0", default-features = false }
# XML codec: the only XML dependency of the crates that read or write XML (transmux,
# dvb-mabr, ttml-subtitle, multimux). std-only (quick-xml needs std).
quick-xml         = { workspace = true, optional = true }
thiserror         = { version = "2", default-features = false }

[dev-dependencies]
test-fixtures = { path = "../test-fixtures" }

[features]
default = ["std"]
# `std` is REQUIRED for any XML parsing/serialising: `quick-xml` is std-only, so a
# `no_std` build exposes only `error`. Not buildable on bare metal beyond that.
std     = ["broadcast-common/std", "thiserror/std", "dep:quick-xml"]

[lints]
workspace = true
