[package]
name    = "broadcast-client"
version = "0.1.0"
edition = "2024"
description = "Generic sans-IO client session: auth, redirects, and TS-over-HTTP, HLS, DASH, RTSP, UDP/RTP and SRT sources."
license      = "MIT OR Apache-2.0"
authors      = ["Alex Fishlock <alex.fishlock@racingjag.com>"]
keywords = ["broadcast", "client", "rtsp", "live", "streaming"]
categories = ["multimedia", "network-programming"]
repository   = "https://github.com/fishloa/rust-broadcast"
readme       = "README.md"
rust-version.workspace = true
exclude = ["fuzz/**"]

[package.metadata.docs.rs]
features = ["serde"]
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
broadcast-common  = { path = "../broadcast-common", version = "10.0", default-features = false, features = ["std"] }
broadcast-auth     = { path = "../broadcast-auth", version = "0.5.1" }
transmux           = { path = "../transmux", version = "0.28", default-features = false, features = ["std"] }
dvb-si             = { path = "../dvb-si", version = "12.0", default-features = false, features = ["ts", "std"] }
mpeg-ts            = { path = "../mpeg-ts", version = "0.6", default-features = false, features = ["std"] }
buffering-runtime  = { path = "../buffering-runtime", version = "0.1", default-features = false, features = ["std"] }
tshttp-runtime     = { path = "../tshttp-runtime", version = "0.1", default-features = false, features = ["std"] }
hls-runtime        = { path = "../hls-runtime", version = "0.10" }
dash-runtime       = { path = "../dash-runtime", version = "0.1" }
broadcast-hls      = { path = "../broadcast-hls", version = "0.5" }
rtsp-runtime       = { path = "../rtsp-runtime", version = "0.8.1", default-features = false }
sdp-types          = { workspace = true }
rtp-packet         = { path = "../rtp-packet", version = "0.5", default-features = false, features = ["std"] }
srt-runtime        = { path = "../srt-runtime", version = "0.6.1", default-features = false, features = ["std", "crypto"] }
sha2               = { version = "0.11", default-features = false }
rustls-pki-types  = { version = "1", default-features = false, features = ["alloc"] }
zeroize            = { version = "1", default-features = false, features = ["alloc"] }
url                = "2"
percent-encoding   = "2"
http               = "1"
headers            = { workspace = true }
cookie             = { version = "0.18", default-features = false }
cookie_store       = { version = "~0.22.1", default-features = false }
thiserror          = "2"
serde              = { version = "1", default-features = false, optional = true, features = ["derive", "alloc"] }

[dev-dependencies]
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
srt-runtime = { path = "../srt-runtime", version = "0.6.1", features = ["tokio", "crypto"] }
test-fixtures = { path = "../test-fixtures" }
buffering-runtime = { path = "../buffering-runtime", version = "0.1" }
transmux = { path = "../transmux", version = "0.28" }
broadcast-auth = { path = "../broadcast-auth", version = "0.5.1" }
rtsp-runtime = { path = "../rtsp-runtime", version = "0.8.1", default-features = false }
sdp-types = { workspace = true }
rtsp-types = "0.1"
url = "2"
jiff = { version = "0.2", default-features = false, features = ["std"] }
test-bounded = { path = "../test-bounded" }
tokio = { version = "1", default-features = false, features = ["rt", "time", "net"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking"] }

[features]
serde = ["dep:serde", "serde/std", "broadcast-common/serde", "transmux/serde", "tshttp-runtime/serde", "buffering-runtime/serde"]

__test-seams = []

[[example]]
name = "live_loop"

[[example]]
name = "auth_wait"

[lints]
workspace = true
