[package]
name    = "broadcast-client"
version = "0.5.0"
edition = "2024"
description = "Generic sans-IO client session: auth, redirects, and TS-over-HTTP, HLS, DASH, Smooth, RTMP, RTSP, UDP/RTP and SRT sources."
license      = "MIT OR Apache-2.0"
authors      = ["Alex Fishlock <alex.fishlock@racingjag.com>"]
keywords = ["broadcast", "client", "rtsp", "live", "streaming"]
categories = ["multimedia", "network-programming"]
repository   = "https://github.com/fishloa/rust-broadcast"
readme       = "README.md"
rust-version.workspace = true
exclude = ["fuzz/**"]

[package.metadata.docs.rs]
features = ["serde"]
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
broadcast-common  = { path = "../broadcast-common", version = "11.0.1", default-features = false, features = ["std", "http-date", "lang", "url"] }
broadcast-auth     = { path = "../broadcast-auth", version = "0.6.0" }
transmux           = { path = "../transmux", version = "0.31.0", default-features = false, features = ["std"] }
dvb-si             = { path = "../dvb-si", version = "13.1.0", default-features = false, features = ["ts", "std"] }
mpeg-ts            = { path = "../mpeg-ts", version = "0.7.1", default-features = false, features = ["std"] }
buffering-runtime  = { path = "../buffering-runtime", version = "0.2.2", default-features = false, features = ["std"] }
hls-runtime        = { path = "../hls-runtime", version = "0.13.0" }

dash-runtime       = { path = "../dash-runtime", version = "0.4.0" }
broadcast-hls      = { path = "../broadcast-hls", version = "0.7.0" }
smooth-runtime     = { path = "../smooth-runtime", version = "0.1.0" }
rtsp-runtime       = { path = "../rtsp-runtime", version = "0.11.0", default-features = false }
sdp-types          = { workspace = true }
rtp-packet         = { path = "../rtp-packet", version = "0.6.0", default-features = false, features = ["std"] }
srt-runtime        = { path = "../srt-runtime", version = "0.8.1", default-features = false, features = ["std", "crypto"] }
rtmp-runtime       = { path = "../rtmp-runtime", version = "0.9.1", default-features = false, features = ["target"] }
sha2               = { version = "0.11", default-features = false }
rustls-pki-types  = { version = "1", default-features = false, features = ["alloc"] }
zeroize            = { version = "1", default-features = false, features = ["alloc"] }
url                = "2"
percent-encoding   = "2"
http               = "1"
headers            = { workspace = true }
cookie             = { version = "0.18", default-features = false }
cookie_store       = { version = "~0.22.1", default-features = false }
thiserror          = "2"
serde              = { version = "1", default-features = false, optional = true, features = ["derive", "alloc", "std"] }

[dev-dependencies]
broadcast-dash     = { path = "../broadcast-dash", version = "0.1.0" }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
srt-runtime = { path = "../srt-runtime", version = "0.8.1", features = ["tokio", "crypto"] }
test-fixtures = { path = "../test-fixtures" }
test-harness = { path = "../test-harness" }
buffering-runtime = { path = "../buffering-runtime", version = "0.2.2" }
transmux = { path = "../transmux", version = "0.31.0" }
broadcast-auth = { path = "../broadcast-auth", version = "0.6.0" }
rtsp-runtime = { path = "../rtsp-runtime", version = "0.11.0", default-features = false }
sdp-types = { workspace = true }
rtsp-types = "0.1"
url = "2"
jiff = { version = "0.2", default-features = false, features = ["std"] }
serde_json = { workspace = true }
workspace-guards = { path = "../workspace-guards" }
tokio = { version = "1", default-features = false, features = ["rt", "time", "net"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking"] }

[features]
serde = ["dep:serde", "broadcast-common/serde", "transmux/serde", "buffering-runtime/serde"]

test-seams = []

[[example]]
name = "session_loop"

[[example]]
name = "auth_wait"

[lints]
workspace = true
