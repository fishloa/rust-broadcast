[package]
name    = "broadcast-client"
version = "0.1.0"
edition = "2024"
description = "Generic sans-IO client session: auth, redirects, and TS-over-HTTP, HLS and RTSP sources."
license      = "MIT OR Apache-2.0"
authors      = ["Alex Fishlock <alex.fishlock@racingjag.com>"]
keywords = ["broadcast", "client", "rtsp", "live", "streaming"]
categories = ["multimedia", "network-programming"]
repository   = "https://github.com/fishloa/rust-broadcast"
readme       = "README.md"
rust-version.workspace = true
exclude = ["fuzz/**"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
broadcast-common  = { path = "../broadcast-common", version = "10.0", default-features = false }
broadcast-auth     = { path = "../broadcast-auth", version = "0.5" }
transmux           = { path = "../transmux", version = "0.27", default-features = false }
dvb-si             = { path = "../dvb-si", version = "12.0", default-features = false, features = ["ts"] }
mpeg-ts            = { path = "../mpeg-ts", version = "0.6", default-features = false }
buffering-runtime  = { path = "../buffering-runtime", version = "0.1", default-features = false }
tshttp-runtime     = { path = "../tshttp-runtime", version = "0.1", default-features = false }
hls-runtime        = { path = "../hls-runtime", version = "0.9" }
dash-runtime       = { path = "../dash-runtime", version = "0.1" }
broadcast-hls      = { path = "../broadcast-hls", version = "0.4" }
rtsp-runtime       = { path = "../rtsp-runtime", version = "0.8", default-features = false }
sdp-types          = { workspace = true }
url                = "2"
percent-encoding   = "2"
http               = "1"
cookie             = { version = "0.18", default-features = false }
cookie_store       = { version = "~0.22.1", default-features = false }
thiserror          = "2"
serde              = { version = "1", default-features = false, optional = true, features = ["derive", "alloc"] }

[dev-dependencies]
test-fixtures = { path = "../test-fixtures" }
buffering-runtime = { path = "../buffering-runtime", version = "0.1" }
transmux = { path = "../transmux", version = "0.27" }
broadcast-auth = { path = "../broadcast-auth", version = "0.5" }
rtsp-runtime = { path = "../rtsp-runtime", version = "0.8", default-features = false }
sdp-types = { workspace = true }
rtsp-types = "0.1"
url = "2"

[features]
default = ["std"]
std = ["broadcast-common/std", "transmux/std", "dvb-si/std", "mpeg-ts/std", "tshttp-runtime/std", "buffering-runtime/std", "serde?/std"]
serde = ["dep:serde", "broadcast-common/serde", "transmux/serde", "tshttp-runtime/serde", "buffering-runtime/serde"]

test-seams = []

[[test]]
name = "buffer"
required-features = ["test-seams"]

[[test]]
name = "playout"
required-features = ["test-seams"]

[[test]]
name = "timeline_jump"
required-features = ["test-seams"]

[[test]]
name = "audit_1498_live"
required-features = ["test-seams"]

[[test]]
name = "r6_ts_tracks"
required-features = ["test-seams"]

[[example]]
name = "live_loop"

[[example]]
name = "auth_wait"

[lints]
workspace = true
