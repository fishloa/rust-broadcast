[package]
name = "test-harness"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
description = "Shared test harnesses for workspace integration tests (unpublished)."

[dependencies]
broadcast-common = { path = "../broadcast-common", version = "14.0.0", default-features = false, features = ["std"] }
dash-runtime = { path = "../dash-runtime", version = "0.7.0" }
rtmp-runtime = { path = "../rtmp-runtime", version = "0.12.0", features = ["target"] }
test-fixtures = { path = "../test-fixtures" }
jiff = { version = "1", default-features = false, features = ["std"] }
url = "2"
headers = { workspace = true }
transmux = { path = "../transmux", version = "0.33.0" }

[lints]
workspace = true
