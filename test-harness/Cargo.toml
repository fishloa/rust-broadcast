[package]
name = "test-harness"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
description = "Shared test harnesses for workspace integration tests (unpublished)."

[dependencies]
broadcast-common = { path = "../broadcast-common", version = "11.0.1", default-features = false, features = ["std"] }
dash-runtime = { path = "../dash-runtime", version = "0.4.0" }
rtmp-runtime = { path = "../rtmp-runtime", version = "0.9.1", features = ["target"] }
