[package]
name = "test-harness"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
description = "Shared test harnesses for workspace integration tests (unpublished)."

[dependencies]
broadcast-common = { path = "../broadcast-common", version = "14.0.0", default-features = false, features = ["std"] }
dash-runtime = { path = "../dash-runtime", version = "0.7.0" }
rtmp-runtime = { path = "../rtmp-runtime", version = "0.12.0", features = ["target"] }
test-fixtures = { path = "../test-fixtures" }
jiff = { version = "1", default-features = false, features = ["std"] }
url = "2"
headers = { workspace = true }
isobmff = { path = "../isobmff", version = "0.1.0", default-features = false }
transmux = { path = "../transmux", version = "0.33.0" }
mpeg-ps = { path = "../mpeg-ps", version = "0.10.0" }

[dev-dependencies]
test-alloc = { path = "../test-alloc" }
# `Pcr`/`Pid` for the collector equality test's PCR field.
mpeg-ts = { path = "../mpeg-ts", version = "0.10.0", default-features = false }

[lints]
workspace = true
