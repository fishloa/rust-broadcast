[package]
name         = "dvb-tools"
version      = "12.0.1"
description  = "Command-line DVB stream analyzer (dump / services / epg / pids / t2mi) over the rust-broadcast crates."
edition      = "2024"
authors      = ["Alex Fishlock <alex.fishlock@racingjag.com>"]
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/fishloa/rust-broadcast"
rust-version.workspace = true
readme       = "README.md"
keywords     = ["dvb", "mpeg-ts", "analyzer", "cli", "broadcast"]
categories   = ["command-line-utilities", "parsing"]

[[bin]]
name = "dvb-tools"
path = "src/main.rs"

[dependencies]
broadcast-common = { path = "../broadcast-common", version = "10.0", default-features = false }
dvb-si    = { path = "../dvb-si",    version = "12.0", features = ["ts", "serde", "chrono"] }
dvb-t2mi  = { path = "../dvb-t2mi",  version = "12.0", features = ["ts"] }
mpeg-ts   = { path = "../mpeg-ts",   version = "0.6", default-features = false, features = ["std"] }
serde_json = { workspace = true }
clap       = { workspace = true, features = ["derive"] }

[dev-dependencies]
test-fixtures = { path = "../test-fixtures" }

[lints]
workspace = true
