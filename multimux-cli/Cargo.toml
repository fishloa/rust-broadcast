[package]
name         = "multimux-cli"
version      = "0.9.0"
edition      = "2024"
rust-version.workspace = true
license      = "MIT OR Apache-2.0"
description  = "CLI for multimux — a config-driven, multi-input/multi-output (RTSP/RTP/TS-UDP/TS-HTTP/SRT/HLS-pull/DASH-pull/Smooth-pull/RTMP/file -> LL-HLS/DASH/LL-DASH/Smooth/TS-HLS/catch-up + SRT/RTMP/RTSP push) just-in-time repackaging HTTP origin."
repository   = "https://github.com/fishloa/rust-broadcast"
keywords     = ["rtsp", "hls", "ll-hls", "cmaf", "origin"]
categories   = ["multimedia", "command-line-utilities"]
readme       = "README.md"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
multimux           = { path = "../multimux", version = "0.11" }
tokio              = { version = "1", features = ["rt-multi-thread", "macros"] }
clap               = { version = "4", features = ["derive"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[[bin]]
name = "multimux"
path = "src/main.rs"
# Same name as the `multimux` library: documenting both makes rustdoc write
# both into target/doc/multimux and race (cargo #6313). The binary's CLI is
# documented by `--help`; the library docs are the API reference.
doc  = false

[lints]
workspace = true
