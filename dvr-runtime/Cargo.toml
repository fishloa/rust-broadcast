[package]
name         = "dvr-runtime"
version      = "0.1.0"
edition      = "2024"
description  = "Sans-IO DVR archive: the on-disk period format (an append-only HLS media playlist per period plus one media file), the writer's roll and retention state machine that returns a plan of storage operations, catch-up read planning, and typeless recovery. No I/O unless the `fs` feature is on, no clock reads."
license      = "MIT OR Apache-2.0"
authors      = ["Alex Fishlock <alex.fishlock@racingjag.com>"]
keywords     = ["dvr", "hls", "archive", "streaming", "sans-io"]
categories   = ["multimedia", "parser-implementations"]
repository   = "https://github.com/fishloa/rust-broadcast"
readme       = "README.md"
rust-version.workspace = true
exclude      = ["docs/**"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
broadcast-common = { path = "../broadcast-common", version = "13.1.0", default-features = false, features = ["std"] }
broadcast-hls    = { path = "../broadcast-hls",    version = "0.8.1",  default-features = false, features = ["std"] }
media-plane      = { path = "../media-plane",      version = "0.13.0", default-features = false, features = ["std"] }
dvb-si           = { path = "../dvb-si",           version = "15.1.0", default-features = false, features = ["std", "jiff", "ts"] }
transmux         = { path = "../transmux",         version = "0.32.1", default-features = false, features = ["std"] }
bytes            = "1"
jiff             = "1.0.2"
thiserror        = "2"

[[example]]
name = "record_ts_file"
required-features = ["fs"]

[[example]]
name = "list_programmes"
required-features = ["fs"]

[dev-dependencies]
test-fixtures    = { path = "../test-fixtures" }
mpeg-ts          = { path = "../mpeg-ts", version = "0.9.0" }

[features]
default = []
fs = []

[lints]
workspace = true
