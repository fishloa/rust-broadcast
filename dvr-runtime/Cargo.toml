[package]
name         = "dvr-runtime"
version      = "0.1.0"
edition      = "2024"
description  = "Sans-IO DVR archive: the on-disk period format (an append-only HLS media playlist per period plus one media file), the writer's roll and retention state machine that returns a plan of storage operations, catch-up read planning, and typeless recovery. No I/O unless the `fs` feature is on, no clock reads."
license      = "MIT OR Apache-2.0"
authors      = ["Alex Fishlock <alex.fishlock@racingjag.com>"]
keywords     = ["dvr", "hls", "archive", "streaming", "sans-io"]
categories   = ["multimedia", "parser-implementations"]
repository   = "https://github.com/fishloa/rust-broadcast"
readme       = "README.md"
rust-version.workspace = true
exclude      = ["docs/**"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
broadcast-common = { path = "../broadcast-common", version = "14.0.0", default-features = false, features = ["std"] }
broadcast-core = { path = "../broadcast-core", version = "0.1.0", default-features = false }
broadcast-hls    = { path = "../broadcast-hls",    version = "0.9.0",  default-features = false, features = ["std"] }
media-plane      = { path = "../media-plane",      version = "0.14.0", default-features = false, features = ["std"] }
dvb-si           = { path = "../dvb-si",           version = "16.0.0", default-features = false, features = ["std", "jiff", "ts"] }
transmux         = { path = "../transmux",         version = "0.33.0", default-features = false, features = ["std"] }
isobmff          = { path = "../isobmff",          version = "0.1.0", default-features = false }
bytes            = "1"
jiff             = "1"
thiserror        = "2"

[[example]]
name = "record_ts_file"
required-features = ["fs"]

[[example]]
name = "list_programmes"
required-features = ["fs"]

[dev-dependencies]
test-fixtures    = { path = "../test-fixtures" }
test-harness     = { path = "../test-harness" }
test-alloc       = { path = "../test-alloc" }
mpeg-ts          = { path = "../mpeg-ts", version = "0.10.0" }

[features]
default = []
fs = []

[lints]
workspace = true
