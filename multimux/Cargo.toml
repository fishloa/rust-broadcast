[package]
name         = "multimux"
version      = "0.21.0"
edition      = "2024"
rust-version.workspace = true
license      = "MIT OR Apache-2.0"
description  = "Multi-input (RTSP/RTP/TS-UDP/TS-HTTP/SRT/HLS-pull/DASH-pull/Smooth-pull/RTMP/file), multi-output (LL-HLS/DASH/LL-DASH/Smooth/TS-HLS/catch-up + SRT/RTMP/RTSP push) just-in-time repackaging HTTP origin (library: tokio + axum), with shared output auth and an external scheme plugin registry."
repository   = "https://github.com/fishloa/rust-broadcast"
keywords     = ["rtsp", "hls", "ll-hls", "cmaf", "origin"]
categories   = ["multimedia", "network-programming"]
readme       = "README.md"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# Floor is 0.23.1, not 0.23: `push::rtmp` uses
# `flv_sequence_header_payloads` / `flv_frame_payloads`, which do not
# exist in 0.23.0 (verified at the tag). Published multimux 0.8.0 shipped
# with the understated `"0.23"` bound.
transmux          = { path = "../transmux",     version = "0.33.0", features = ["serde"] }
# Smooth manifest rendering (`output::smooth`) and the Smooth-pull encryption
# probe: the single XML dependency of the crates that read or write XML.
quick-xml         = { workspace = true }
container-probe   = { path = "../container-probe", version = "0.6.0" }
# HLS (M3U8) playlist syntax (issue #878): `source::hls_pull` builds/parses
# playlists via this crate directly rather than through `transmux`.
broadcast-hls     = { path = "../broadcast-hls", version = "0.9.0" }
# The Smooth client Manifest model, used by `source::smooth_pull` and
# `output::smooth` directly (issue #2356).
broadcast-smooth  = { path = "../broadcast-smooth", version = "0.3.0" }
# The MPD model: a Period split on a gap (`output::dash`) composes the periods
# of per-run `DashPackager` documents.
broadcast-dash    = { path = "../broadcast-dash", version = "0.3.0" }
smooth-runtime    = { path = "../smooth-runtime", version = "0.4.0" }
rtsp-runtime      = { path = "../rtsp-runtime",  version = "0.14.0", features = ["tokio"] }
# RTMP push ingest (`source::rtmp`, issue #738): the `tokio` feature pulls
# `rtmp_runtime::io::AsyncRtmpServer`/`RtmpConnection`, the real-socket
# adapter over the sans-IO `ServerSession`.
rtmp-runtime      = { path = "../rtmp-runtime",  version = "0.12.0", features = ["tokio"] }
# SRT push/pull ingest (`source::srt`, issue #739): the `tokio` feature
# pulls `srt_runtime::io::{SrtListener, SrtSocket}`, the real-socket adapter
# over the sans-IO ARQ/TSBPD/handshake engines.
srt-runtime       = { path = "../srt-runtime",   version = "0.12.0", features = ["tokio"] }
# The LL-HLS origin engine itself (rolling window/store, blocking-reload +
# part-availability decision logic, playlist rendering — issue #663/#717
# Stage 2). multimux is now a thin tokio+axum adapter over
# `hls_runtime::server`; see `output::llhls`. The HLS-pull input
# (`source::hls_pull`, issue #663 P3c) drives `hls_runtime::client`'s
# sans-IO `HlsClient` itself (no `tokio` client feature), doing the GETs the
# engine asks for rather than re-implementing LL-HLS playback.
# Floor is 0.6, not 0.5: `output::catchup` uses `server::ClosedSegment` and
# `HlsOrigin::closed_segments()`, which do not exist in the published
# 0.5.0 (verified: 0 hits at the hls-runtime-v0.5.0 tag). hls-runtime
# must publish 0.6.0 before multimux can publish.
hls-runtime       = { path = "../hls-runtime",   version = "0.16.0", features = ["std", "serde"] }
# DASH-pull policy core (`source::dash_pull`): MPD parsing, segment addressing
# for every Period and selected AdaptationSet, the UTC clock ladder, live
# refresh/join/availability and failure classification. `dash_pull` keeps the
# tokio loop and the media-plane mapping; the core is sans-IO.
dash-runtime      = { path = "../dash-runtime", version = "0.7.0" }
# TS-over-HTTP pull policy core (`source::ts_http`): finite/VOD detection and
# the post-establishment stall decision; the demuxer stays `ts_program`.
broadcast-client  = { path = "../broadcast-client", version = "0.8.0" }
# The workspace's single UDP bind (`dvb_stream::udp::bind_standard`): the
# `SO_REUSEADDR`/`SO_REUSEPORT`/`SO_RCVBUF`/multicast-join option list lives
# there, not in each UDP-family ingest source.
dvb-stream        = { path = "../dvb-stream",     version = "0.11.0", features = ["udp"] }
# Needed directly (not just via hls-runtime/transmux) by `source::hls_pull`
# to recover `TrackSpec`s from a pulled stream's init segment via
# `Fmp4Demux::unpackage` (the `Unpackage` trait) — issue #663 P3c.
# API floor is 9.2, not 9: `output::smooth` uses `hex::hex_encode`, added in
# 9.2.0 (absent at the 9.0.0 and 9.1.0 tags — verified). Published
# multimux 0.8.0 shipped with the understated `"9"` bound, so a lock
# resolving 9.0/9.1 fails to compile it today. The pin below is 9.3, above
# that floor, tracking the current published line; same caret bucket, so it
# is not an epoch change.
broadcast-common  = { path = "../broadcast-common", version = "14.0.0", features = ["lang", "base64"] }
# The media-plane ingress traits this crate's sources port onto (plan step
# 5a): `Dialer`/`Listener`/`IngestSession`/`IngestDriver`/`ListenDriver`, and
# the `Trunk` every ported session publishes into.
media-plane       = { path = "../media-plane", version = "0.14.0", features = ["std"] }
bytes             = "1"
# Shared Basic/Digest/Bearer auth model + challenge/response helper
# (`source::http_auth`, issue #663 P3b/P3c) — the same crate `rtsp-runtime`
# and `hls_runtime::client::tokio_client` use.
# Floor is 0.2.1, not 0.2: `config.rs` uses `Verifier::signed_url` /
# `SignedUrlKeySet`, added in 0.2.1 (#747). A `"0.2"` bound admits 0.2.0,
# which lacks them — multimux 0.8.0 shipped with that understated bound and
# fails to compile against a lock that pins 0.2.0.
broadcast-auth    = { path = "../broadcast-auth", version = "0.9.0" }
sdp-types         = { workspace = true }
tokio             = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "time", "sync", "signal"] }
axum              = { workspace = true }
# Every multimux HTTP listener is served through hyper-util's auto server
# builder (`origin::serve_hyper_util`) rather than `axum::serve`, so it can
# set a header-read timeout, a connection cap, and graceful drain on shutdown
# (W2a SP2.1) — `axum::serve` sets none of them. The auto builder accepts
# both HTTP/1.1 and h2c prior-knowledge on one listener.
hyper             = { version = "1", features = ["server", "http1", "http2"] }
hyper-util        = { version = "0.1", features = ["server", "http1", "http2", "server-auto", "server-graceful", "tokio", "service"] }
# HTTP-layer resource limits (issue #663 P5, audit-concurrency #3): request
# timeout + request-body size cap (`tower-http`) and a concurrency bound
# (`tower::limit`) — see `origin::HttpLimits`/`origin::router`. `util` is
# needed for `tower::ServiceExt::oneshot` in this crate's own axum-router
# tests. `cors` is for the WHIP/WHEP signalling routers (W2a SP2.1).
tower-http        = { version = "0.7", default-features = false, features = ["timeout", "limit", "cors", "compression-gzip", "decompression-gzip"] }
tower             = { version = "0.5", default-features = false, features = ["limit", "util"] }
# `http_body::{Frame, SizeHint}` for `origin::limit::PermitBody` (the response
# body that owns a concurrency permit): `axum::body` re-exports only
# `HttpBody`/`Body`/`Bytes`, not these. Already in the lock at 1.1.0.
http-body        = "1"
# Typed response headers (`CacheControl`, `AccessControlAllow*`, `Vary`) in
# `origin::add_response_headers` (W2a Task 3) instead of hand-built constants.
headers          = { workspace = true }
http             = "1"
# `ArcSwap<Router>` for the admin media router (W2a Task 3) so a per-request
# read never takes a write lock on the rebuild path.
arc-swap         = "1"
serde             = { version = "1", features = ["derive"] }
serde_json        = { workspace = true }
thiserror         = "2"
url               = "2"
# OS CSPRNG for ICE credentials, resource ids and SSRCs (issue #1142); 0.2 is
# already in the workspace lock.
getrandom         = "0.4"
# Dates and durations (DASH `availabilityStartTime`, `@duration`,
# `EXT-X-PROGRAM-DATE-TIME`, DASH-pull `parse_iso8601_utc`) via `jiff` rather
# than the hand-rolled `civil_from_days` / manual ISO-8601 parsing this crate
# used before (SP5). `jiff` is already in the workspace lock (transmux,
# timed-metadata), so this adds no new version.
jiff              = "1"
tracing           = "0.1"
# Push output driver (`push`, issue #744): `#[async_trait]` drives the
# `PushTransport` trait's async methods over the sans-IO `SrtSocket` handle.
async-trait       = "0.1"
# `tokio_util::sync::CancellationToken` for cooperative cancellation of the
# push loop (`drive_push`).
tokio-util        = { version = "0.7", features = ["rt"] }
# The workspace's one reconnect-backoff implementation (SP1.5): every retry
# site (supervisor, push `ReconnectEngine`, `file_reader`, `hls_pull`) goes
# through `reconnect::ReconnectSchedule` rather than a hand-rolled `powi`
# series. `default-features = false` drops the `tokio-sleep` convenience (the
# caller applies the delay itself) so this does not pull a second `tokio`.
# Locks without poisoning (SP6.6): a panicking holder's guard drops and the
# next acquire succeeds.
parking_lot       = "0.13"
metrics           = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
tokio-rustls      = { version = "0.26", optional = true, default-features = false, features = ["ring", "tls12", "logging"] }
# `rustls::pki_types::ServerName` for SNI, plus the loopback TLS test server
# (`source::rtsp`'s `rtsps://` connect, issue #804) — pinned to the same
# "0.23" line as `rtsp-runtime`'s own optional `rustls` dep, already resolved
# at that version transitively (via `reqwest`/`hyper-rustls`), so this adds no
# new version to the lock.
rustls            = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# The ring-backed verifier reqwest's own default would have built (platform
# roots), handed to reqwest through `use_preconfigured_tls`.
rustls-platform-verifier = "0.7"
# TS-over-HTTP ingest (`source::ts_http`, issue #663 P3c): a streaming GET
# fed straight into `StreamingTsDemux`. `rustls-no-provider` so no aws-lc-rs
# provider is linked; the client is built from a ring `ClientConfig`
# (`source::client_host::http_client`). `stream` for `Response::bytes_stream()`.
reqwest           = { version = "0.13", default-features = false, features = ["rustls-no-provider", "stream"] }
# `.next()` on `reqwest::Response::bytes_stream()` (a bare `Stream`, no
# extension methods of its own).
futures-util      = { workspace = true, features = ["std"] }
# WHIP input (`source::whip`, issue #740) / WHEP output (`output::whep`,
# issue #743), `whip`/`whep` features only: the ICE + DTLS-SRTP media
# transport this crate has no reason to reimplement.
# Declared as a *plain* optional dep (no extra features) so merely depending
# on it (feature off) never pulls `webrtc-runtime`'s own `media` feature —
# only `multimux`'s `whip`/`whep` features below turn that on. See this
# crate's `rust-version` note on those features for why the split matters.
webrtc-runtime    = { path = "../webrtc-runtime", version = "0.10.0", optional = true, default-features = false }
# RFC 3550 §5.1 RTP header, in two places: WHEP output (`output::whep`,
# issue #743) builds the typed `rtp_packet::RtpPacket` values
# `webrtc_runtime::media::MediaTransport::encrypt_rtp` requires, and the raw
# RTP-over-UDP source (`source::rtp_udp`) reads the payload type through
# `RtpPacket` rather than masking header byte 1. The source one is not
# feature-gated, so this dependency is unconditional; it is a small,
# `no_std`-capable crate with no `rtc-dtls` tree behind it.
rtp-packet        = { path = "../rtp-packet", version = "0.9.0", default-features = false }
# The DVR archive (format, writer roll/retention state machine, catch-up read
# planning) and its blocking `fs` adapter: `route` records through
# `FsRecorder`, `output::catchup` reads through `FsArchive`.
dvr-runtime       = { path = "../dvr-runtime", version = "0.1.0", features = ["fs"] }
# The EIT present/following tracker (`epg`, behind `jiff`) a program runs
# while its DVR recorder waits to be created, and the EIT event names
# `dvr-runtime` records into the archive's `EXT-X-DATERANGE` titles:
# `legacy-charsets` keeps KS X 1001 / GB-2312 / Big5 names decoding
# (dvr-runtime itself does not enable it). Also used by the
# `source::split_subtitle` and `source::segment` tests.
dvb-si            = { path = "../dvb-si", version = "16.0.0", default-features = false, features = ["std", "ts", "jiff", "legacy-charsets"] }
# TS packet framing: the datagram and packet sizes the push transports and the
# TS-carrying sources chunk by.
mpeg-ts           = { path = "../mpeg-ts", version = "0.10.0" }
# Canonical timed-metadata event types (issue #969): `source::scte35` /
# `route` ingest `timed_metadata::TimedEvent` values into the trunk's event
# log, and `origin::resource::inject_segment_events` pattern-matches on
# `timed_metadata::event::SourcePayload::Scte35`. A transitive dep through
# `media-plane` alone cannot be named inside a pattern match (edition 2024
# requires it be declared), hence the direct dependency.
timed-metadata    = { path = "../timed-metadata", version = "0.12.0", default-features = false }
# Teletext subtitle pages -> WebVTT cues (`source::split_subtitle`, issue
# #1428): the PES data-field decoder and cue extractor behind the SUBTITLES
# renditions, not re-implemented here.

[features]
# `tls` is default-on: `rtsps://` sources should work out of the box. It pulls
# rtsp-runtime's `tls` feature (rustls/webpki-roots via its
# `default_tls_client_config` helper) plus `tokio-rustls` directly, needed here
# only to name the connected stream's concrete type
# (`tokio_rustls::client::TlsStream<TcpStream>`).
default     = ["tls"]
tls         = ["rtsp-runtime/tls", "dep:tokio-rustls"]
# WHIP (RFC 9725) push input (issue #740): accepts an inbound WHIP publisher
# over HTTP + ICE/DTLS-SRTP, via `webrtc_runtime::media::MediaTransport`.
#
# Opt-in rather than `default` because it pulls the whole ICE/DTLS-SRTP
# dependency tree (`rtc-ice`/`rtc-dtls`/`rtc-srtp`/`rcgen`), which a
# deployment serving only HTTP outputs has no reason to build.
#
# This used to carry an MSRV constraint too — `rcgen ^0.14.8` needs rustc
# >= 1.88, while the workspace MSRV was 1.86 — which is why the feature was
# excluded from the `--all-features` lanes and covered by a dedicated CI job.
# The workspace MSRV is now 1.95.0 (issue #949), so that gap is gone and the
# feature is opt-in purely on dependency weight.
whip        = ["dep:webrtc-runtime", "webrtc-runtime/media"]
# Dependency-free test seams (`Config::prebound`, the `PreboundListeners`
# hand-in entry points): a caller binds `127.0.0.1:0` and hands the live
# listener in instead of reserving a port and racing to re-bind it. Deliberately
# split out of `test-hooks` so a test that needs only a pre-bound socket (e.g.
# the TS-UDP / Smooth / TS-HLS end-to-end binaries) does not drag in
# `webrtc-runtime`'s whole ICE/DTLS-SRTP tree. `test-hooks` implies it.
test-seams  = []
# WebRTC fault injection (`WhipRouteShared::force_next_timer_error`) that stages
# a fatal transport timer error. Non-default; implies `test-seams` plus
# `webrtc-runtime/test-seams`. `tests/it/whip_whep_timers.rs` requires it.
test-hooks  = ["test-seams", "dep:webrtc-runtime", "webrtc-runtime/test-seams"]
# WHEP (draft-ietf-wish-whep) egress (issue #743): accepts a viewer's HTTP
# `POST` + SDP offer, negotiates ICE/DTLS-SRTP, and pushes the route's
# `Trunk` samples out as SRTP RTP — the mirror image of `whip` (see
# `crate::output::whep`'s module doc). A *sibling* feature to `whip` rather
# than folded into it: ingest and egress are independently useful (a route
# may want only one), matching this crate's one-feature-per-protocol
# pattern elsewhere (`InputSpec::Whip` vs. a hypothetical output-side
# equivalent). Both enable `webrtc-runtime/media`, so both pull the same
# ICE/DTLS-SRTP dependency tree described on `whip` above.
whep        = ["dep:webrtc-runtime", "webrtc-runtime/media"]

[[example]]
name = "serve_rtsp"

[[example]]
name = "custom_scheme"

[[test]]
name = "whip_ingest"
required-features = ["whip", "test-hooks"]

[[test]]
name = "whep_egress"
required-features = ["whip", "whep", "test-hooks"]

[dev-dependencies]
test-fixtures = { path = "../test-fixtures" }
workspace-guards = { path = "../workspace-guards" }
# Issue #4057: `tests/file_memory.rs` proves TS file playout holds a bounded
# live-byte peak; `test-harness` generates the 256 MiB capture incrementally at
# test time (it cannot be committed) and `test-alloc` reports the peak.
test-harness = { path = "../test-harness" }
test-alloc   = { path = "../test-alloc" }
transmux = { path = "../transmux", version = "0.33.0", features = ["sample-aes"] }
# `test-seams`: webrtc-runtime's hidden fault-injection hooks (inert without
# `media`, so this pulls nothing extra into builds that do not enable whip/whep).
webrtc-runtime   = { path = "../webrtc-runtime", version = "0.10.0", default-features = false, features = ["test-seams"] }
# Builds the STUN connectivity checks the WHEP shared-socket tests send.
rtc-stun         = "0.21"
# `test-util`: the paused, manually advanced clock the push-flush tests use
# instead of sleeping (feature-only; no new version in the lock).
tokio            = { version = "1", features = ["test-util"] }
# gzip decompression for origin_gzip tests; already in the lock via
# tower-http/compression-gzip (async-compression -> flate2), so no new entry.
flate2            = "1"
# Adds `reqwest`'s `json` feature (`Response::json`/`RequestBuilder::json`)
# for test-only use (`tests/it/admin_api.rs`, issue #749) — Cargo unifies this
# into the one `reqwest` dependency only for test builds, never for the
# library target itself.
reqwest          = { version = "0.13", default-features = false, features = ["json", "http2"] }
# An INDEPENDENT SCTE-35 parser (no shared code with `timed-metadata`) so
# `tests/it/emsg_mp4box.rs` can decode the `message_data` of an emitted DASH
# `emsg` back to the source section and prove the bytes are the source's own
# (issue #1083, E).
scte35-splice    = { path = "../scte35-splice", version = "8.0.0" }
# `rtp-packet` (default-features off, matching the `whep` optional dep) so
# `tests/it/whip_whep_timers.rs` can build the RTP packet a loopback WebRTC
# peer encrypts and sends — the only honest way to drive a WHIP session to a
# decrypted `Events` feed (the reap path the idle-clock-leak test pins).
rtp-packet       = { path = "../rtp-packet", version = "0.9.0", default-features = false }
# `rtc-dtls` so the same loopback test can pre-generate its client DTLS
# certificate (and so signal its genuine fingerprint in the offer before
# construction). Already a transitive dep via `webrtc-runtime/media` at the
# locked version, so this adds no new lock entry.
rtc-dtls         = "0.21"
# The independent ETSI TR 101 290 monitor `multimux/tests/it/push_ts_stream.rs` runs over
# the TS a push output actually delivers (#1024). Dev-only; dvb-conformance
# depends on neither multimux nor transmux, so there is no cycle.
# The independent DASH MPD validator `multimux/tests/it/dash_sliding_window.rs` runs over
# every MPD the origin emits as the window slides (#1058). Dev-only;
# media-doctor does not depend on multimux (no cycle).
media-doctor     = { path = "../media-doctor", version = "0.18.0", default-features = false, features = ["std"] }

dvb-conformance  = { path = "../dvb-conformance", version = "16.0.0", default-features = false, features = ["std"] }
# A dependency on ourselves, enabling the tiny `test-seams` feature for every
# test build. Without it a plain `cargo test -p multimux` (default features)
# would fail to compile any test that uses `Config::prebound`, silently
# excluding the TS-UDP/Smooth/TS-HLS end-to-end binaries from a lean run (the
# `required-features` entries alone only SKIP a target, they do not enable the
# feature). This is the standard self-dev-dependency pattern (Cargo allows a
# crate to dev-depend on itself); it adds no new package to the lock.
multimux         = { path = ".", features = ["test-seams"] }
# `socket2` sockets in the test hosts (`SockRef::recv_buffer_size` so
# `udp_bind.rs` can prove the requested `SO_RCVBUF` was APPLIED, `SockRef` for
# the rtmp read-failure harness, `Socket::new` for the RTSP push bounds).
# The library's own UDP bind lives in `dvb_stream::udp::bind_standard`. Needs
# `all` for the option getters/setters (`set_reuse_port` is non-default).
socket2          = { workspace = true, features = ["all"] }
# `ProgramId` for the SPTS program in `multimux/tests/it/origin_gzip.rs` (already a
# dependency of the library, so no new lock entry).
media-plane         = { path = "../media-plane", version = "0.14.0", default-features = false, features = ["std", "test-support"] }
# `parking_lot::Mutex` so a test can prove the no-poison
# property directly (the library uses it internally but does not re-export it).
parking_lot      = "0.13"

[lints]
workspace = true
