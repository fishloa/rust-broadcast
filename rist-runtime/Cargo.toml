[package]
name         = "rist-runtime"
version      = "0.1.0"
edition      = "2024"
description  = "RIST Simple Profile (VSF TR-06-1:2020) RTCP message types: Generic NACK (RFC 4585), Range NACK, RTT Echo, and compound packet builders."
license      = "MIT OR Apache-2.0"
authors      = ["Alex Fishlock <alex.fishlock@racingjag.com>"]
keywords     = ["rist", "rtcp", "nack", "no-std", "broadcast"]
categories   = ["parser-implementations", "multimedia", "no-std"]
repository   = "https://github.com/fishloa/rust-broadcast"
readme       = "README.md"
rust-version.workspace = true
exclude      = ["docs/**", "tests/fixtures/**"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
broadcast-common = { path = "../broadcast-common", version = "9.3", default-features = false }
rtcp-packet      = { path = "../rtcp-packet",      version = "0.3", default-features = false }
thiserror        = { version = "2", default-features = false }

[dev-dependencies]

[features]
default = ["std"]
# `std` links the standard library. Without it the crate is `#![no_std]` and
# needs only `alloc`.
std = ["broadcast-common/std", "rtcp-packet/std", "thiserror/std"]
