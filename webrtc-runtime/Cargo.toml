[package]
name    = "webrtc-runtime"
version = "0.1.0"
edition = "2024"
description = "Sans-IO WHIP (RFC 9725) + WHEP (draft-ietf-wish-whep) HTTP signalling engine — SDP offer/answer, Trickle ICE, ICE restart, session lifecycle. No IO adapter; caller drives HTTP."
license      = "MIT OR Apache-2.0"
authors      = ["Alex Fishlock <alex.fishlock@racingjag.com>"]
keywords = ["webrtc", "whip", "whep", "streaming", "sans-io"]
categories = ["multimedia", "network-programming", "api-bindings"]
repository   = "https://github.com/fishloa/rust-broadcast"
readme       = "README.md"
rust-version = "1.86"
exclude = ["docs/**", "tests/fixtures/**"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
broadcast-common = { path = "../broadcast-common", version = "^9" }
broadcast-auth   = { path = "../broadcast-auth",   version = "0.2" }
thiserror = "2"
log       = "0.4"
serde = { version = "1", optional = true, default-features = false, features = ["derive", "alloc"] }

[features]
default = ["std"]
std     = []
serde   = ["dep:serde"]

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
