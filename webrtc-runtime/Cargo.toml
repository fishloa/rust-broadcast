[package]
name    = "webrtc-runtime"
version = "0.1.0"
edition = "2024"
description = "Sans-IO WHIP (RFC 9725) + WHEP (draft-ietf-wish-whep) HTTP signalling engine — SDP offer/answer, Trickle ICE, ICE restart, session lifecycle. No IO adapter; caller drives HTTP."
license      = "MIT OR Apache-2.0"
authors      = ["Alex Fishlock <alex.fishlock@racingjag.com>"]
keywords = ["webrtc", "whip", "whep", "streaming", "sans-io"]
categories = ["multimedia", "network-programming", "api-bindings"]
repository   = "https://github.com/fishloa/rust-broadcast"
readme       = "README.md"
rust-version.workspace = true
exclude = ["docs/**", "tests/fixtures/**"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# `default-features = false` on both, forwarded by this crate's own `std`
# feature below. Without that forwarding the advertised `no_std` build was a
# fiction: `--no-default-features` still pulled a std `broadcast-common` and a
# std `thiserror`, so the crate never linked without the std runtime.
broadcast-common = { path = "../broadcast-common", version = "9.3", default-features = false }
thiserror = { version = "2", default-features = false }
# `broadcast-auth` and `log` were declared here and referenced by not one line
# of this crate. Both are std-only, so they alone made the bare-metal build
# impossible — dead weight that cost the crate its headline property.
serde = { version = "1", optional = true, default-features = false, features = ["derive", "alloc"] }

# ---------------------------------------------------------------------------
# `media` feature only (see src/media/mod.rs). All optional: the default
# build (no_std-capable) never touches these. Feature-gated so a consumer
# that only needs WHIP/WHEP signalling does not build the ICE/DTLS-SRTP
# transport and its dependency tree.
# ---------------------------------------------------------------------------
rtp-packet  = { path = "../rtp-packet",  version = "0.4", optional = true }
rtcp-packet = { path = "../rtcp-packet", version = "0.3", optional = true }
rtc-ice     = { version = "0.20", optional = true }
rtc-dtls    = { version = "0.20", optional = true }
rtc-srtp    = { version = "0.20", optional = true }
rtc-stun    = { version = "0.20", optional = true }
rtc-shared  = { version = "0.20", optional = true }
sansio      = { version = "1",    optional = true }
bytes       = { version = "1",    optional = true }
# SHA-256 for the RFC 8122 DTLS certificate fingerprint signalled in SDP
# (`a=fingerprint:sha-256 ...`). Not in the umbrella-avoidance list of the
# issue brief, but there is no fingerprint helper on the approved rtc-*
# crates themselves, and this is the same minimal RustCrypto crate the
# feasibility spike used.
sha2        = { version = "0.10", optional = true }

[features]
default = ["std"]
std     = ["broadcast-common/std", "thiserror/std"]
serde   = ["dep:serde"]
# ICE + DTLS-SRTP media transport. Optional on dependency weight alone —
# it used to also require a newer rustc than the workspace MSRV (`rcgen`
# needs 1.88, the MSRV was 1.86), but the MSRV is now 1.95.0 (issue #949).
media = [
    "std",
    "dep:rtp-packet",
    "dep:rtcp-packet",
    "dep:rtc-ice",
    "dep:rtc-dtls",
    "dep:rtc-srtp",
    "dep:rtc-stun",
    "dep:rtc-shared",
    "dep:sansio",
    "dep:bytes",
    "dep:sha2",
]

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
# Fixture-verification only (tests/srtp_rfc3711_vectors.rs): an independent,
# from-spec-text AES-CM + HMAC-SHA1 implementation used to cross-check
# rtc-srtp's own output against the RFC 3711 Appendix B test vectors. Pinned
# to the same versions rtc-srtp itself already resolves to (see Cargo.lock),
# so this adds no new dependency version to the workspace's dependency graph.
aes    = "0.8"
cipher = "0.4"
ctr    = "0.9"
hmac   = "0.12"
sha1   = "0.10"

# Manual browser-interop smoke test (not run in CI): gated on `media` via
# `required-features` so `cargo build --examples` with default features
# skips it cleanly instead of failing to find the `media` module.
[[example]]
name              = "whip_media_smoke"
required-features = ["media"]

# RFC 3711 (SRTP) / RFC 5769 (STUN) spec-vector fixture tests — gated on
# `media` both here and via `#![cfg(feature = "media")]` in the files
# themselves (the workspace's documented feature-gated-test-file pattern),
# so `cargo test -p webrtc-runtime --locked` (no `media`) skips them
# cleanly instead of needing the media-only optional deps they import.
[[test]]
name              = "srtp_rfc3711_vectors"
required-features = ["media"]

[[test]]
name              = "stun_rfc5769_vectors"
required-features = ["media"]

# Real-fixture pcap test (fixtures/webrtc/whip-ice-dtls-srtp-loopback.pcap):
# decodes the genuine Chrome-emitted STUN messages from a captured
# ICE/DTLS/SRTP session. Same gating pattern as the two vector tests above.
[[test]]
name              = "whip_smoke_pcap_stun"
required-features = ["media"]
