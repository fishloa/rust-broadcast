[package]
name          = "atsc3"
version       = "0.1.0"
description   = "ATSC 3.0 (A/331) LLS binary envelope + Service List Table (SLT) parser"
authors.workspace     = true
edition.workspace     = true
license.workspace     = true
repository.workspace  = true
rust-version.workspace = true
categories   = ["multimedia::video", "parser-implementations", "no-std"]
keywords     = ["atsc3", "nextgentv", "lls", "slt", "broadcast"]

[dependencies]
broadcast-common = { path = "../broadcast-common", version = "9", default-features = false }
roxmltree        = { version = "0.20", default-features = false }
thiserror        = { version = "2", default-features = false }

[dependencies.flate2]
version  = "1"
optional = true

[features]
default = ["std"]
std     = ["broadcast-common/std", "thiserror/std", "roxmltree/std", "dep:flate2"]
serde   = ["dep:serde", "broadcast-common/serde"]

[dependencies.serde]
version  = "1"
features = ["derive"]
optional = true

[package.metadata.docs.rs]
all-features = true
