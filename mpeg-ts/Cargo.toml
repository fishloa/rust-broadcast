[package]
name         = "mpeg-ts"
version      = "0.10.0"
edition      = "2024"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/fishloa/rust-broadcast"
rust-version.workspace = true
description  = "MPEG-2 Transport Stream framing (ITU-T H.222.0 / ISO/IEC 13818-1): TS packet, adaptation field, PCR, PSI section reassembly + packetisation, resync. no_std."
keywords     = ["mpeg-ts", "transport-stream", "mpeg2", "psi", "no-std"]
categories   = ["parser-implementations", "multimedia::video", "no-std"]
exclude      = ["docs/**"]

[dependencies]
broadcast-common = { path = "../broadcast-common", version = "14.0.0", default-features = false }
broadcast-core = { path = "../broadcast-core", version = "0.1.0", default-features = false }
thiserror  = { version = "2", default-features = false }
bytes      = { version = "1", default-features = false }
serde      = { version = "1", default-features = false, features = ["derive", "alloc"], optional = true }

[features]
default = ["std"]
std    = ["broadcast-common/std", "broadcast-core/std", "thiserror/std", "serde?/std"]
serde  = ["dep:serde", "broadcast-common/serde", "broadcast-core/serde"]

[dev-dependencies]
test-fixtures = { path = "../test-fixtures" }
isobmff  = { path = "../isobmff",  version = "0.1.0", default-features = false }
test-alloc = { path = "../test-alloc" }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
